                code: success
                message: ''
                tips: null
                data: null
    DocumentConvertResponse:
      description: Document conversion result. While processing is in progress or after a failure, the service may return an empty result or `data=null`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentConvertResponse'
          example:
            code: success
            message: ''
            tips: null
            data:
              task_id: task_abc123
              img_detail_list:
                - page_num: 1
                  img_base64: ''
                  img_url: https://example.com/temp/task_abc123/page-1.png
                  width: 1240
                  height: 1754
                  preprocess: {}
              total_num: 1
              metadata: {}
              file_type: pdf
              source_file_type: pdf
              spreadsheet_manifest_file_id: ''
              spreadsheet_manifest_url: ''
              view_type: ''
              page_count: 1
              sheet_count: 0
              logical_unit_count: 0
              document_contents: []
              document_details: []
              warnings: []
              billing: {}
    WebhookEventListResponse:
      description: Webhook system event catalog.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookEventListResponse'
    WebhookMutationResponse:
      description: Webhook creation or update result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookMutationResponse'
    EmptyMutationResponse:
      description: The operation succeeded and `data` is an empty object.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmptyDataResponse'
    WebhookListResponse:
      description: Webhook configurations for the current account. Signing secrets are not included.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookListResponse'
    WebhookLogResponse:
      description: Webhook delivery logs. `response_body` may contain sensitive data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookLogResponse'
    WorkflowApplicationListResponse:
      description: Published workflow applications visible to the current Access Key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkflowApplicationListResponse'
    WorkflowApplicationResponse:
      description: Workflow application details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkflowApplicationResponse'
    WorkflowRunExportResponse:
      description: Workflow-run export result. Treat the download URL as a temporary sensitive link.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkflowRunExportResponse'
  schemas:
    DocumentConvertRequest:
      type: object
      additionalProperties: false
      oneOf:
        - title: Use file URL
          required: [file_url]
        - title: Use Base64 file
          required: [file_base64]
      properties:
        file_url:
          type: string
          format: uri
          maxLength: 2048
          description: Public HTTPS URL of the file to convert. Do not pass an internal-network URL or a URL containing long-lived credentials.
        file_base64:
          type: string
          format: byte
          description: Base64 content of the file to convert. The decoded file can be at most 50 MiB.
        scale:
          type: number
          exclusiveMinimum: 0
          default: 1
          description: Page scale factor. The server currently exposes no stable upper bound; use the default value unless necessary.
        first_convert_page:
          type: integer
          minimum: 1
          description: First page to convert, starting at 1. Omit it to start from the first page.
        last_convert_page:
          type: integer
          minimum: 1
          description: Last page to convert, starting at 1 and not less than the first page. Omit it to continue through the last page.
        result_mode:
          type: string
          enum: [url, base64]
          default: url
          description: How page images are returned. URLs are temporary; Base64 significantly increases the response size.
    DocumentConvertAsyncRequest:
      type: object
      additionalProperties: false
      oneOf:
        - title: Use file URL
          required: [file_url]
        - title: Use Base64 file
          required: [file_base64]
      properties:
        file_url:
          type: string
          format: uri
          maxLength: 2048
          description: Public HTTPS URL of the file to convert.
        file_base64:
          type: string
          format: byte
          description: Base64 content of the file to convert. The decoded file can be at most 50 MiB.
        scale:
          type: number
          exclusiveMinimum: 0
          default: 1
        first_convert_page:
          type: integer
          minimum: 1
        last_convert_page:
          type: integer
          minimum: 1
      description: Asynchronous conversion currently always returns page results as URLs. The backend ignores `result_mode`, so the public contract does not expose that field.
    DocumentConvertTaskResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              oneOf:
                - type: object
                  properties:
                    task_id:
                      type: string
                  required: [task_id]
                - type: 'null'
    DocumentConvertResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              oneOf:
                - $ref: '#/components/schemas/DocumentConvertData'
                - type: 'null'
    DocumentConvertData:
      type: object
      properties:
        task_id:
          type: string
        img_detail_list:
          type: array
          items:
            $ref: '#/components/schemas/DocumentConvertImage'
        total_num:
          type: integer
          minimum: 0
        metadata:
          type: object
          additionalProperties: true
        file_type:
          type: string
          description: Conversion result type, such as `pdf`, `image`, or `spreadsheet`.
        source_file_type:
          type: string
          description: Detected source-file extension type.
        spreadsheet_manifest_file_id:
          type: string
        spreadsheet_manifest_url:
          type: string
          description: Temporary download URL for the native Excel preview manifest.
        view_type:
          type: string
          description: Set to `spreadsheet` for native Excel parsing.
        page_count:
          type: integer
          minimum: 0
        sheet_count:
          type: integer
          minimum: 0
        logical_unit_count:
          type: integer
          minimum: 0
        document_contents:
          type: array
          items:
            type: string
        document_details:
          type: array
          items: {}
        warnings:
          type: array
          items:
            type: object
            additionalProperties: true
        billing:
          type: object
          additionalProperties: true
      required: [task_id, img_detail_list, total_num, metadata, file_type, source_file_type, spreadsheet_manifest_file_id, spreadsheet_manifest_url, view_type, page_count, sheet_count, logical_unit_count, document_contents, document_details, warnings, billing]
    DocumentConvertImage:
      type: object
      properties:
        page_num: {type: integer, minimum: 0}
        img_base64:
          type: string
          description: Page-image content when `result_mode=base64`; otherwise it is generally an empty string.
        img_url:
          type: string
          description: Temporary page URL when `result_mode=url`; otherwise it is generally an empty string.
        width: {type: integer, minimum: 0}
        height: {type: integer, minimum: 0}
        preprocess:
          type: object
          additionalProperties: true
      required: [page_num, img_base64, img_url, width, height, preprocess]
    EmptyDataResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
          required: [data]
    WebhookEventType:
      type: string
      enum:
        - doc_parse_completed
        - doc_extract_completed
        - collaboration_start
        - collaboration_success
        - collaboration_failed
        - collaboration_completed
        - collaboration_timeout
    WebhookEventListResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/WebhookEvent'
              required: [events]
          required: [data]
    WebhookEvent:
      type: object
      properties:
        event_type:
          $ref: '#/components/schemas/WebhookEventType'
        name:
          type: string
        description:
          type: string
      required: [event_type, name, description]
    WebhookCreateRequest:
      type: object
      additionalProperties: false
      properties:
        webhook_url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 512
          description: Caller-controlled, public HTTPS callback URL. The public contract does not accept HTTP or internal-network URLs.
        event_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookEventType'
        app_id:
          type: [array, 'null']
          uniqueItems: true
          description: Application scope. Omit it, pass `null`, or pass an empty array to subscribe to all applications under the current account.
          items:
            type: string
            minLength: 1
      required: [webhook_url, event_types]
    WebhookUpdateRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required: [webhook_url]
        - required: [event_types]
        - required: [app_id]
      properties:
        webhook_id:
          type: string
          minLength: 1
        webhook_url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 512
          description: New public HTTPS callback URL.
        event_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookEventType'
        app_id:
          type: [array, 'null']
          uniqueItems: true
          description: Passing `null` or an empty array explicitly clears the application scope; omitting it leaves the scope unchanged.
          items:
            type: string
            minLength: 1
      required: [webhook_id]
    WebhookDeleteRequest:
      type: object
      additionalProperties: false
      properties:
        webhook_id:
          type: string
          minLength: 1
      required: [webhook_id]
    WebhookMutationResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              oneOf:
                - type: object
                  properties:
                    webhook_id:
                      type: string
                  required: [webhook_id]
                - type: 'null'
    WebhookListResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                webhook_list:
                  type: array
                  items:
                    $ref: '#/components/schemas/WebhookConfig'
              required: [webhook_list]
          required: [data]
    WebhookConfig:
      type: object
      properties:
        webhook_id: {type: string}
        webhook_url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        app_id:
          type: [array, 'null']
          items:
            type: string
        is_active:
          type: integer
          enum: [0, 1]
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
      required: [webhook_id, webhook_url, event_types, is_active]
    WebhookLogQueryRequest:
      type: object
      additionalProperties: false
      properties:
        webhook_id:
          type: [string, 'null']
          description: Webhook configuration ID. Always provide it whenever possible to narrow the query scope.
        start_time:
          type: [string, 'null']
          pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
          description: Start time in `YYYY-MM-DD HH:mm:ss` format. If omitted, defaults to 72 hours before the end time.
        end_time:
          type: [string, 'null']
          pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
          description: End time in `YYYY-MM-DD HH:mm:ss` format. If omitted, defaults to the current time.
        page:
          type: integer
          default: 1
          minimum: 1
        page_size:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
    WebhookLogResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                logs:
                  type: array
                  items:
                    $ref: '#/components/schemas/WebhookLog'
                total: {type: integer, minimum: 0}
                page: {type: integer, minimum: 1}
                page_size: {type: integer, minimum: 1, maximum: 100}
              required: [logs, total, page, page_size]
          required: [data]
    WebhookLog:
      type: object
      properties:
        id: {type: string}
        webhook_id: {type: string}
        webhook_url:
          type: string
          format: uri
        event_type:
          $ref: '#/components/schemas/WebhookEventType'
        app_id: {type: [string, 'null']}
        app_name: {type: [string, 'null']}
        status:
          type: string
          enum: [pending, success, failed, final_failed]
        retry_count: {type: integer, minimum: 0}
        next_retry_at:
          type: [string, 'null']
          format: date-time
        response_code: {type: [integer, 'null']}
        response_body:
          type: [string, 'null']
          maxLength: 2000
          description: Last receiver response or error message. It may contain sensitive data.
        delivered_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
      required: [id, webhook_id, webhook_url, event_type, status, retry_count]
    WorkflowApplication:
      type: object
      properties:
        id:
          type: string
          description: Workflow application ID.
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
        tags:
          type: [array, 'null']
          items:
            type: string
      required: [id, name, description, status, tags]
    WorkflowApplicationListResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                range:
                  type: object
                  properties:
                    offset: {type: integer, minimum: 0}
                    size: {type: integer, minimum: 1}
                    total: {type: [integer, 'null'], minimum: 0}
                  required: [offset, size, total]
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkflowApplication'
              required: [range, list]
          required: [data]
    WorkflowApplicationResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              oneOf:
                - $ref: '#/components/schemas/WorkflowApplication'
                - type: 'null'
    WorkflowRunExportRequest:
      type: object
      additionalProperties: false
      properties:
        application_id:
          type: string
          minLength: 1
          description: Workflow application ID.
        run_ids:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          description: Explicitly authorized run IDs to export. The public contract does not allow `null` or an empty array to export all runs.
          items:
            type: string
            minLength: 1
        node_ids:
          type: array
          uniqueItems: true
          description: Optional node IDs. If omitted, all exportable nodes in each run are included.
          items:
            type: string
            minLength: 1
        format:
          type: string
          enum: [excel, word, markdown, json]
          default: excel
        report_mode:
          type: string
          enum: [merged, per_run]
          default: merged
          description: "`merged` produces one combined report; `per_run` separates output by run."
        include_failed_runs:
          type: boolean
          default: false
        primary_key_variable:
          type: string
          description: Optional workflow input-variable name to use as the export primary key.
        max_text_length:
          type: integer
          minimum: 1
          maximum: 30000
          default: 10000
          description: Maximum exported characters for one text value. The route currently defaults to 10,000.
      required: [application_id, run_ids]
    WorkflowRunExportResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              oneOf:
                - $ref: '#/components/schemas/WorkflowRunExportData'
                - type: 'null'
    WorkflowRunExportData:
      type: object
      properties:
        file_id: {type: string}
        download_url:
          type: string
          format: uri
          description: Temporary download URL. It is currently generally valid for approximately one hour, but this is not a stable SLA.
        filename: {type: string}
        file_size: {type: integer, minimum: 0}
        format:
          type: string
          enum: [excel, word, markdown, json]
        report_mode:
          type: string
          enum: [merged, per_run]
        total_runs: {type: integer, minimum: 0, maximum: 200}
        included_runs: {type: integer, minimum: 0, maximum: 200}
        skipped_runs: {type: integer, minimum: 0, maximum: 200}
        run_summaries:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRunExportSummary'
        export_time:
          type: string
          format: date-time
      required: [file_id, download_url, filename, file_size, format, report_mode, total_runs, included_runs, skipped_runs, run_summaries, export_time]
    WorkflowRunExportSummary:
      type: object
      properties:
        run_id: {type: string}
        status: {type: string}
        started_at:
          type: [string, 'null']
          format: date-time
        ended_at:
          type: [string, 'null']
          format: date-time
        included_nodes: {type: integer, minimum: 0}
        skipped_nodes: {type: integer, minimum: 0}
      required: [run_id, status, started_at, ended_at, included_nodes, skipped_nodes]
    SimpleResponse:
      type: object
      properties:
        code:
          oneOf:
            - type: string
            - type: integer
          description: Business code. A successful response is usually success or 200.
        message:
          type: string
          description: Response message.
        tips:
          type:
            - string
            - 'null'
          description: Details. Defaults to null.
    HTTPValidationError:
      type: object
      description: FastAPI/Pydantic request validation error.
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
      required: [detail]
    ValidationErrorItem:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
          description: Validation error type.
        loc:
          type: array
          description: Location of the invalid field in the request.
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
          description: Human-readable validation error message.
        input:
          description: Input value that failed validation.
        ctx:
          type: object
          additionalProperties: true
          description: Additional context supplied by the validator.
        url:
          type: string
          format: uri
          description: Link to the Pydantic error documentation.
      required: [type, loc, msg]
    DocumentFileRequest:
      oneOf:
        - title: Use file URL
          type: object
          additionalProperties: false
          properties:
            app_id:
              default: *documentRecognitionAppId
              type: string
              description: Unique application ID.
            file_url:
              default: *documentRecognitionFileUrl
              type: string
              format: uri
              description: File URL. Use either file_url or file_base64.
            file_name:
              type: string
              description: File name. Provide it when using Base64 or when the file name cannot be inferred from the URL.
            model_params:
              $ref: '#/components/schemas/DocumentRecognizeModelParams'
          required: [app_id, file_url]
        - title: Use file Base64
          type: object
          additionalProperties: false
          properties:
            app_id:
              default: *documentRecognitionAppId
              type: string
              description: Unique application ID.
            file_base64:
              default: *documentRecognitionFileBase64
              type: string
              description: Base64-encoded file. Use either file_base64 or file_url.
            file_name:
              type: string
              description: File name. Provide it when using Base64 or when the file name cannot be inferred from the URL.
            model_params:
              $ref: '#/components/schemas/DocumentRecognizeModelParams'
          required: [app_id, file_base64]
    DocumentRecognizeModelParams:
      type: object
      additionalProperties: true
      description: |
        Model parameters for this document recognition call. If omitted, the saved application parsing configuration is used. To temporarily override parsing options for this call, pass them in recognize_config.
      properties:
        recognize_config:
          $ref: '#/components/schemas/DocumentRecognizeConfig'
    DocumentRecognizeConfig:
      type: object
      additionalProperties: false
      description: Parsing configuration for this call.
      properties:
        recognize_mode:
          type: string
          enum: [standard, advance, agentic, fast_vlm, agentic_v2]
          default: standard
          description: |
            Parsing mode. Available values are:

            - standard: Standard parsing for clear digital documents, balancing speed and accuracy.
            - advance: Enhanced parsing 1.0 for documents with stamps, signatures, multiple tables, or moderately complex layouts.
            - agentic: Smart parsing that combines standard and enhanced parsing and performs secondary parsing when conditions are met.
            - fast_vlm: Enhanced parsing 2.0 for complex layouts, scanned documents, and documents with multiple tables, improving parsing stability.
            - agentic_v2: Smart parsing 2.0 with two-stage layout analysis and content recognition for documents with complex layouts, tables, and formulas.
        enable_highlight:
          type: integer
          enum: [0, 1]
          default: 1
          description: Whether to show source locations. 1 keeps source positions for text blocks and tables; 0 omits positions. Supported in standard, agentic, fast_vlm, and agentic_v2 modes. Not supported in advance mode.
        enable_pdf_parse:
          type: boolean
          default: false
          description: Whether to use PDF text first. Effective only for digital PDFs with selectable text. Improves speed and text stability.
        pdf_pic_second_parsing:
          type: boolean
          default: false
          description: When PDF text first is enabled, whether to use VLM to parse image regions in the PDF again.
        enable_stamp_recognition:
          type: boolean
          default: false
          description: Whether to enable stamp recognition. When enabled, the service detects stamps in the document and attempts to extract stamp text.
    DocumentExtractRequest:
      oneOf:
        - title: Use file URL
          type: object
          additionalProperties: false
          properties:
            app_id:
              default: app_abc123
              type: string
              description: Unique application ID.
            file_url:
              default: *documentRecognitionFileUrl
              type: string
              format: uri
              description: File URL. Use either file_url or file_base64.
            file_name:
              type: string
              description: File name. Provide it when using Base64 or when the file name cannot be inferred from the URL.
            with_rec_result:
              type: boolean
              description: Whether to return document recognition results. High-speed extraction does not return recognition results.
              default: false
          required: [app_id, file_url]
        - title: Use file Base64
          type: object
          additionalProperties: false
          properties:
            app_id:
              default: app_abc123
              type: string
              description: Unique application ID.
            file_base64:
              default: JVBERi0xLjQKJcfs...
              type: string
              description: Base64-encoded file. Use either file_base64 or file_url.
            file_name:
              type: string
              description: File name. Provide it when using Base64 or when the file name cannot be inferred from the URL.
            with_rec_result:
              type: boolean
              description: Whether to return document recognition results. High-speed extraction does not return recognition results.
              default: false
          required: [app_id, file_base64]
    TaskCreateResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                task_id:
                  type: string
                metadata:
                  type: object
                  additionalProperties: true
                  description: Document processing task metadata.
    DocumentExtractResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DocumentExtractData'
    DocumentExtractData:
      type: object
      properties:
        task_id:
          type: string
        file_url:
          type: string
        message:
          type: string
          description: Task status or processing result message.
        status:
          type: integer
          enum: [0, 1, 2, 4, 5, 6]
          description: 0=unknown, 1=ready, 2=running, 4=succeeded, 5=failed, 6=canceled or rejected.
        doc_recognize_result:
          type: array
          items:
            $ref: '#/components/schemas/RecognizePage'
        extraction_result:
          type: array
          items:
            $ref: '#/components/schemas/ExtractionField'
        extract_config_version:
          type: string
          description: Configuration version used for this extraction.
        collaboration_result:
          type: array
          items:
            type: object
            additionalProperties: true
        output_result:
          type: array
          items:
            type: object
            additionalProperties: true
        metadata:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: Document processing task metadata.
        aigc:
          oneOf:
            - $ref: '#/components/schemas/AigcLabel'
            - type: 'null'
          description: AI-generated content compliance label.
        spreadsheet_manifest_file_id:
          type: string
          description: Native Excel preview manifest file ID. Usually an empty string for non-Excel documents.
        spreadsheet_manifest_url:
          type: string
          description: Native Excel preview manifest download URL. Usually an empty string for non-Excel documents.
        spreadsheet_billing:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: Billing details for Excel worksheets and embedded images.
    DocumentRecognizeResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                task_id:
                  type: string
                file_url:
                  type: string
                message:
                  type: string
                  description: Task status or processing result message.
                status:
                  type: integer
                  enum: [0, 1, 2, 4, 5, 6]
                  description: 0=unknown, 1=ready, 2=running, 4=succeeded, 5=failed, 6=canceled or rejected.
                doc_recognize_result:
                  type: array
                  items:
                    $ref: '#/components/schemas/RecognizePage'
                metadata:
                  type: object
                  additionalProperties: true
                  description: Document processing task metadata.
                aigc:
                  oneOf:
                    - $ref: '#/components/schemas/AigcLabel'
                    - type: 'null'
                  description: AI-generated content compliance label.
                convert_result:
                  type: object
                  additionalProperties: true
                  description: Document conversion result. For Excel files, this includes the native preview manifest and billing details.
                spreadsheet:
                  type: object
                  additionalProperties: true
                  description: Summary of the native Excel structure.
    AigcLabel:
      type: object
      properties:
        Label:
          type: string
          description: Content label type.
        ContentProducer:
          type: string
          description: Content generation service provider identifier.
        ProduceID:
          type: string
          description: Content production identifier.
        ReservedCode1:
          type: string
          description: Reserved validation code for content generation.
        ContentPropagator:
          type: string
          description: Content distribution service provider identifier.
        PropagateID:
          type: string
          description: Content distribution identifier.
        ReservedCode2:
          type: string
          description: Reserved validation code for content distribution.
        ProcessingTypes:
          type: array
          description: AI processing types used to produce this response.
          items:
            type: string
    RecognizePage:
      type: object
      properties:
        page_num:
          type: integer
        document_content:
          type: string
        document_details:
          type: array
          items:
            $ref: '#/components/schemas/DocumentDetail'
        stamps:
          type: array
          description: Stamp recognition results. Returned only when enable_stamp_recognition is enabled and at least one stamp is detected.
          items:
            type: object
            additionalProperties: true
    DocumentDetail:
      type: object
      properties:
        type:
          type: string
        text:
          type: string
        position:
          type: array
          items:
            type: object
            properties:
              points:
                type: array
                items:
                  $ref: '#/components/schemas/Point'
        ocr_confidence:
          type: object
          properties:
            ocr_mean_confidence:
              type: number
            ocr_min_confidence:
              type: number
            is_overall_confidence:
              type: integer
    Point:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
    ExtractionField:
      type: object
      additionalProperties: true
      properties:
        field_key:
          type: string
        field_name:
          type: string
        field_values:
          type: array
          items:
            type: object
            additionalProperties: true
        references:
          type: array
          items:
            type: object
            additionalProperties: true
        table_values:
          type: array
          items:
            type: array
            items:
              type: object
              additionalProperties: true
    ExtractionFieldConfig:
      type: object
      additionalProperties: false
      properties:
        field_key:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
          description: Unique field identifier. Required when you create a high-speed custom extraction application. Standard applications do not require this field.
        field_name:
          type: string
          minLength: 1
          maxLength: 50
          description: Field name.
        field_type:
          type: string
          enum: [string, date, table]
          description: Field type. Use table for table fields.
        field_prompt:
          type: string
          description: Field extraction prompt.
        sub_fields:
          type: array
          minItems: 1
          maxItems: 20
          description: Table sub-fields. When field_type is table, provide at least one valid sub-field.
          items:
            $ref: '#/components/schemas/ExtractionSubFieldConfig'
      required: [field_name, field_type]
    ExtractionSubFieldConfig:
      type: object
      additionalProperties: false
      properties:
        field_key:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
          description: Unique sub-field identifier. Required when you create a high-speed custom extraction application. Standard applications do not require this field.
        field_name:
          type: string
          minLength: 1
          maxLength: 50
          description: Sub-field name.
        field_type:
          type: string
          enum: [string, date]
          description: Sub-field type. Nested tables are not supported inside a table.
        field_prompt:
          type: string
          description: Sub-field extraction prompt.
      required: [field_name, field_type]
    LongDocConfig:
      type: object
      additionalProperties: false
      properties:
        doc_type:
          type: string
          description: Document type.
        doc_desc:
          type: string
          description: Document type description.
      required: [doc_type]
    ExtractionAppCreateRequest:
      description: Set ai_function first. Use the standard custom extraction application parameters when ai_function is 1406. Use the high-speed custom extraction application parameters when ai_function is 1425.
      discriminator:
        propertyName: ai_function
        mapping:
          '1406': '#/components/schemas/StandardExtractionAppCreateRequest'
          '1425': '#/components/schemas/HighSpeedExtractionAppCreateRequest'
      oneOf:
        - $ref: '#/components/schemas/StandardExtractionAppCreateRequest'
        - $ref: '#/components/schemas/HighSpeedExtractionAppCreateRequest'
    StandardExtractionAppCreateRequest:
      type: object
      additionalProperties: false
      title: Create standard custom extraction application
      properties:
        ai_function:
          type: integer
          enum: [1406]
          default: 1406
          description: Application type. Use 1406 to create a standard custom extraction application. If omitted, the API handles the request as 1406 by default.
        app_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Application name.
        app_label:
          type: array
          maxItems: 5
          description: Application labels. Up to 5 labels.
          items:
            type: string
        extract_fields:
          type: array
          minItems: 1
          maxItems: 20
          description: Extraction field configuration list. Up to 20 fields.
          items:
            $ref: '#/components/schemas/ExtractionFieldConfig'
        parse_mode:
          type: string
          enum: [standard, advance, agentic, fast_vlm, agentic_v2]
          description: |
            Parsing mode. Required for standard custom extraction applications. Available parsing modes are:

            - standard: Standard parsing for clear digital documents, balancing speed and accuracy.
            - advance: Enhanced parsing 1.0 for documents with stamps, signatures, multiple tables, or moderately complex layouts.
            - agentic: Smart parsing that combines standard and enhanced parsing and performs secondary parsing when conditions are met.
            - fast_vlm: Enhanced parsing 2.0 for complex layouts, scanned documents, and documents with multiple tables, improving parsing stability.
            - agentic_v2: Smart parsing 2.0 with two-stage layout analysis and content recognition for documents with complex layouts, tables, and formulas.
        enable_highlight:
          type: integer
          enum: [0, 1]
          default: 1
          description: Whether to include source locations. Pass 1 to enable or 0 to disable. Supported by standard, agentic, fast_vlm, and agentic_v2. Not supported by advance.
        enable_pdf_parse:
          type: boolean
          default: false
          description: Whether to prefer PDF text extraction. Use this for digital PDFs with selectable text to improve processing speed and text stability.
        pdf_pic_second_parsing:
          type: boolean
          default: false
          description: When PDF text extraction is enabled, whether to run secondary parsing on images inside the PDF.
        enable_stamp_recognition:
          type: boolean
          default: false
          description: Whether to enable stamp recognition. The service attempts to recognize stamp information in the document. Stamp recognition capability must be enabled.
        enable_field_value_translation:
          type: boolean
          default: false
          description: Whether to enable extracted value translation. Disabled by default.
        enable_long_doc:
          type: boolean
          default: false
          description: Whether to enable long document support.
        long_doc_config:
          type: array
          maxItems: 5
          description: Long document configuration. Used only when enable_long_doc is true.
          items:
            $ref: '#/components/schemas/LongDocConfig'
      required: [ai_function, app_name, extract_fields, parse_mode]
    HighSpeedExtractionAppCreateRequest:
      type: object
      additionalProperties: false
      title: Create high-speed extraction application
      properties:
        ai_function:
          type: integer
          enum: [1425]
          default: 1425
          description: Application type. Use 1425 to create a high-speed custom extraction application.
        app_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Application name.
        app_label:
          type: array
          maxItems: 5
          description: Application labels. Up to 5 labels.
          items:
            type: string
        extract_fields:
          type: array
          minItems: 1
          maxItems: 50
          description: High-speed extraction field configuration list. Up to 50 fields. Every field must provide field_key.
          items:
            $ref: '#/components/schemas/HighSpeedExtractionFieldConfig'
        enable_field_value_translation:
          type: boolean
          default: false
          description: Whether to enable extracted value translation. Disabled by default.
      required: [ai_function, app_name, extract_fields]
    HighSpeedExtractionFieldConfig:
      type: object
      additionalProperties: false
      title: High-speed field
      description: High-speed field configuration. For ordinary fields, set field_type to string or date and do not pass sub_fields. For table fields, set field_type to table and pass sub_fields.
      properties:
        field_key:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
          description: Unique field identifier. It must start with an English letter and can contain only English letters, numbers, and underscores. Maximum 64 characters.
        field_name:
          type: string
          minLength: 1
          maxLength: 50
          description: Field name.
        field_type:
          type: string
          enum: [string, date, table]
          description: Field type. Use string or date for ordinary fields. Use table for table fields.
        field_prompt:
          type: string
          maxLength: 200
          description: Field extraction prompt.
        sub_fields:
          type: array
          maxItems: 30
          description: Table sub-fields. Fill this only when field_type is table, and provide at least one valid sub-field. Do not pass this parameter for ordinary fields.
          items:
            $ref: '#/components/schemas/HighSpeedExtractionSubFieldConfig'
          examples:
            - - field_key: item_name
                field_name: Item name
                field_type: string
      required: [field_key, field_name, field_type]
      allOf:
        - if:
            properties:
              field_type:
                const: table
            required: [field_type]
          then:
            required: [sub_fields]
            properties:
              sub_fields:
                minItems: 1
    HighSpeedExtractionSubFieldConfig:
      type: object
      additionalProperties: false
      properties:
        field_key:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
          description: Unique sub-field identifier. It must start with an English letter and can contain only English letters, numbers, and underscores. Maximum 64 characters.
        field_name:
          type: string
          minLength: 1
          maxLength: 50
          description: Sub-field name.
        field_type:
          type: string
          enum: [string, date]
          description: Sub-field type. Nested tables are not supported inside a table.
        field_prompt:
          type: string
          maxLength: 200
          description: Sub-field extraction prompt.
      required: [field_key, field_name, field_type]
    ExtractionAppUpdateRequest:
      oneOf:
        - $ref: '#/components/schemas/StandardExtractionAppUpdateRequest'
        - $ref: '#/components/schemas/HighSpeedExtractionAppUpdateRequest'
    StandardExtractionAppUpdateRequest:
      type: object
      additionalProperties: false
      title: Update standard custom extraction application
      properties:
        app_id:
          type: string
          description: Application ID.
        app_name:
          type: string
          description: Application name. If omitted or passed as an empty string, the name is not updated.
        config_version:
          type: string
          description: Current configuration version. The update is saved as a new version.
        app_label:
          type: array
          maxItems: 5
          description: Application labels. Up to 5 labels.
          items:
            type: string
        extract_fields:
          type: array
          maxItems: 20
          description: Extraction field configuration list. Up to 20 fields.
          items:
            $ref: '#/components/schemas/ExtractionFieldConfig'
        parse_mode:
          type: string
          enum: [standard, advance, agentic, fast_vlm, agentic_v2]
          description: |
            Parsing mode. Required for standard custom extraction applications. High-speed custom extraction applications do not support setting this parameter. Available parsing modes are:

            - standard: Standard parsing for clear digital documents, balancing speed and accuracy.
            - advance: Enhanced parsing 1.0 for documents with stamps, signatures, multiple tables, or moderately complex layouts.
            - agentic: Smart parsing that combines standard and enhanced parsing and performs secondary parsing when conditions are met.
            - fast_vlm: Enhanced parsing 2.0 for complex layouts, scanned documents, and documents with multiple tables, improving parsing stability.
            - agentic_v2: Smart parsing 2.0 with two-stage layout analysis and content recognition for documents with complex layouts, tables, and formulas.
        enable_highlight:
          type: integer
          enum: [0, 1]
          default: 1
          description: Whether to include source locations. Pass 1 to enable or 0 to disable. Supported by standard, agentic, fast_vlm, and agentic_v2. Not supported by advance.
        enable_pdf_parse:
          type: boolean
          default: false
          description: Whether to prefer PDF text extraction. Use this for digital PDFs with selectable text to improve processing speed and text stability.
        pdf_pic_second_parsing:
          type: boolean
          default: false
          description: When PDF text extraction is enabled, whether to run secondary parsing on images inside the PDF.
        enable_stamp_recognition:
          type: boolean
          default: false
          description: Whether to enable stamp recognition. The service attempts to recognize stamp information in the document. Stamp recognition capability must be enabled.
        enable_field_value_translation:
          type: boolean
          default: false
          description: Whether to enable extracted value translation. Disabled by default.
        enable_long_doc:
          type: boolean
          default: false
          description: Whether to enable long document support. Standard custom extraction applications support this parameter. High-speed custom extraction applications do not support setting this parameter.
        long_doc_config:
          type: array
          maxItems: 5
          description: Long document configuration. Used only when enable_long_doc is true.
          items:
            $ref: '#/components/schemas/LongDocConfig'
      required: [app_id, extract_fields, parse_mode]
    HighSpeedExtractionAppUpdateRequest:
      type: object
      additionalProperties: false
      title: Update high-speed extraction application
      properties:
        app_id:
          type: string
          description: High-speed custom extraction application ID.
        app_name:
          type: string
          description: Application name. If omitted or passed as an empty string, the name is not updated.
        config_version:
          type: string
          description: Current configuration version. The update is saved as a new version.
        app_label:
          type: array
          maxItems: 5
          description: Application labels. Up to 5 labels.
          items:
            type: string
        extract_fields:
          type: array
          minItems: 1
          maxItems: 50
          description: High-speed extraction field configuration list. Up to 50 fields. Every field must provide field_key.
          items:
            $ref: '#/components/schemas/HighSpeedExtractionFieldConfig'
        enable_field_value_translation:
          type: boolean
          default: false
          description: Whether to enable extracted value translation. Disabled by default.
      required: [app_id, extract_fields]
    AppIdRequest:
      type: object
      additionalProperties: false
      properties:
        app_id:
          type: string
          description: Application ID. To delete a high-speed custom extraction application, pass the app_id of the high-speed application.
      required: [app_id]
    AppVersionDeleteRequest:
      type: object
      additionalProperties: false
      properties:
        app_id:
          type: string
          description: Application ID. To delete a high-speed custom extraction application configuration, pass the app_id of the high-speed application.
        config_version:
          type: string
          description: Configuration version to delete.
      required: [app_id, config_version]
    AppConfigQueryRequest:
      type: object
      additionalProperties: false
      properties:
        app_id:
          type: string
          description: Application ID. To query a high-speed custom extraction application configuration, pass the app_id of the high-speed application.
        config_version:
          type: string
          description: Configuration version. Optional. Defaults to the latest version.
      required: [app_id]
    AiRecommendRequest:
      type: object
      additionalProperties: false
      description: Field configuration generation request. Standard applications require at least one of prompt, file_url, or file_base64. High-speed applications still require file_url or file_base64, and prompt is only supporting guidance. Because the application type is resolved from app_id, OpenAPI cannot fully express the two conditional contracts from request fields alone.
      properties:
        app_id:
          type: string
          description: Application ID. When you pass a high-speed custom extraction application, the response returns a high-speed auto-configuration preview.
        file_base64:
          type: string
          description: Base64-encoded file. Required for high-speed applications if file_url is not provided.
        file_url:
          type: string
          format: uri
          description: File URL. Required for high-speed applications if file_base64 is not provided.
        prompt:
          type: string
          description: User-provided generation instruction. Standard applications can use prompt alone; high-speed applications must also provide a file.
        doc_type:
          type: string
          description: Document type. You can provide this for standard application recommendations. High-speed applications detect the document type automatically.
        doc_type_description:
          type: string
          description: Document type description. You can provide this for standard application recommendations.
      required: [app_id]
      anyOf:
        - required: [prompt]
        - required: [file_base64]
        - required: [file_url]
    ExtractionAppResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
