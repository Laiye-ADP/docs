            page_size: 20
    WorkflowRunRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkflowRunRequest'
    WorkflowCancelRunRequest:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkflowCancelRunRequest'
          example:
