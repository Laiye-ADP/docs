          items:
            $ref: '#/components/schemas/HighSpeedExtractionFieldConfig'
        enable_field_value_translation:
          type: boolean
          default: false
          description: Field-value translation; off on create. On update, omitted/null inherits the reference version; false disables.
        description:
          type:
          - string
          - 'null'
          maxLength: 1500
          description: Classification description. On update, omit to retain; empty clears it.
        app_code:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Optional business code, up to 64 characters without a character-pattern restriction. Case-sensitive unique
            per tenant/owner. Omit on update to retain; empty clears; unset returns null. Not an authentication credential.
        enable_highlight:
          type: boolean
          default: false
          description: Source locations; off on create. On update, omitted/null inherits the reference version; false disables.
        enable_confidence:
          type: boolean
          default: false
          description: Field confidence evaluation; off on create. On update, omitted/null inherits the reference version; false
            disables.
      required:
      - ai_function
      - app_name
      - extract_fields
    HighSpeedExtractionFieldConfig:
      type: object
      additionalProperties: false
      title: High-speed field
      description: Keys are unique across scalars, tables and columns, ignoring case. Names may repeat across tables or between
        a scalar and a column.
      properties:
        field_key:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_]{0,63}$
          description: 1–64 characters, beginning with a letter or digit, followed by letters, digits or underscores. 1425 keys
            are globally unique across scalars/tables/columns, ignoring case.
        field_name:
          type: string
          minLength: 1
          maxLength: 50
          description: Field name.
        field_type:
          type: string
          enum:
          - string
          - number
          - date
          - table
          description: 'Scalars/columns: text, number or date. Use table for the table itself.'
        field_prompt:
          type: string
          maxLength: 3000
          description: Field extraction prompt.
        sub_fields:
          type: array
          maxItems: 30
          description: Table sub-fields. Fill this only when field_type is table, and provide at least one valid sub-field. Do
            not pass this parameter for ordinary fields.
          items:
            $ref: '#/components/schemas/HighSpeedExtractionSubFieldConfig'
          examples:
          - - field_key: item_name
              field_name: Item name
              field_type: string
        format:
          anyOf:
          - $ref: '#/components/schemas/FieldFormat'
          - type: 'null'
          description: For number/date fields and columns, not a whole table. Omit on update to retain a same-key/same-type format;
            null clears it.
      required:
      - field_key
      - field_name
      - field_type
      allOf:
      - if:
          properties:
            field_type:
              const: table
          required:
          - field_type
        then:
          required:
          - sub_fields
          properties:
            sub_fields:
              minItems: 1
    HighSpeedExtractionSubFieldConfig:
      type: object
      additionalProperties: false
      properties:
        field_key:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_]{0,63}$
          description: 1–64 characters, beginning with a letter or digit, followed by letters, digits or underscores. 1425 keys
            are globally unique across scalars/tables/columns, ignoring case.
        field_name:
          type: string
          minLength: 1
          maxLength: 50
          description: Sub-field name.
        field_type:
          type: string
          enum:
          - string
          - number
          - date
          description: 'Scalars/columns: text, number or date. Use table for the table itself.'
          default: string
        field_prompt:
          type: string
          maxLength: 3000
          description: Sub-field extraction prompt.
        format:
          anyOf:
          - $ref: '#/components/schemas/FieldFormat'
          - type: 'null'
          description: For number/date fields and columns, not a whole table. Omit on update to retain a same-key/same-type format;
            null clears it.
      required:
      - field_key
      - field_name
      description: Keys are unique across scalars, tables and columns, ignoring case. Names may repeat across tables or between
        a scalar and a column.
