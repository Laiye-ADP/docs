      type: object
      properties:
        id:
          type: string
          description: Collaboration task primary ID, used for queries and file_task_id.
        task_number:
          type: string
          description: Display task number; cannot be used to query or correct a task.
        app_id:
          type: string
        app_name:
          type:
            - string
            - 'null'
        rule_id:
          type:
            - string
            - 'null'
        rule_name:
          type:
            - string
            - 'null'
        rule_logic_operator:
          type:
            - string
            - 'null'
        file_id:
          type:
            - string
            - 'null'
        file_name:
          type:
            - string
            - 'null'
