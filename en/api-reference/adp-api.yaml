          description: 1=waiting, 2=pending human review, 3=passed automatically, 4=completed by a reviewer, 5=failed, 6=canceled. Submit corrections only in state 2.
        task_state_name:
          type:
            - string
            - 'null'
        completed_time:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        thumbnail_file_url:
          type:
            - string
            - 'null'
        converted_file_url_result:
          type:
            - array
            - 'null'
          items:
            type: string
        extraction_result:
          type: array
          items:
            $ref: '#/components/schemas/ExtractionField'
          description: Original machine extraction result, retained after human correction.
        collaboration_result:
          type: array
          items:
            $ref: '#/components/schemas/CollaborationReviewField'
          description: Collaboration review details, including field review state and values. Original machine verification conclusions do not indicate whether human review is complete.
        output_result:
          type: array
          items:
            $ref: '#/components/schemas/CollaborationOutputField'
