      type: object
      additionalProperties: true
      properties:
        field_key:
          type: string
          description: Unique field identifier. Returned for high-speed auto-configuration.
        field_name:
          type: string
          description: Field name.
        field_type:
          type: string
          enum: [string, date, table]
          description: Field type.
        field_prompt:
          type:
            - string
            - 'null'
          description: Field prompt.
        field_description:
          type:
            - string
            - 'null'
          description: Field description.
        sub_fields:
          type: array
          description: Table sub-field list. Standard table fields may return this field. For high-speed table fields, use table_rule.
          items:
            $ref: '#/components/schemas/AiRecommendSubFieldConfig'
      required: [field_name, field_type]
    AiRecommendSubFieldConfig:
      type: object
      additionalProperties: true
      properties:
        field_key:
          type: string
          description: Unique sub-field identifier.
        field_name:
          type: string
          description: Sub-field name.
        field_type:
          type: string
          enum: [string, date]
          description: Sub-field type.
        field_prompt:
          type:
            - string
            - 'null'
          description: Sub-field prompt.
        field_description:
          type:
            - string
            - 'null'
          description: Sub-field description.
      required: [field_name, field_type]
    AiRecommendGeneratedRuleField:
      type: object
      additionalProperties: true
      properties:
        field_key:
          type: string
          description: Unique field identifier. A table sub-field's field_parent_id references the table parent field's field_key.
        field_name:
          type: string
          description: Field name.
        field_type:
          type: string
          enum: [string, date, table]
          description: Field type. table means a table parent field.
        field_description:
          type: string
          description: Field description.
        field_parent_id:
          type: string
          description: Parent field_key for a table sub-field. Empty means an ordinary field or a table parent field.
        config:
          type: object
          additionalProperties: true
          description: Field extension configuration.
        source:
          type: integer
          description: Field source.
        _field_key_source:
          type: string
          description: Original field key generated by the model. Returned only when the service keeps debug information.
    UserPaymentResponse:
      type: object
      properties:
        user_id:
          type: string
          description: ID of the user associated with the current Access Key.
        payment_type:
          type: string
          enum: [paid, free]
          description: User payment type.
        concurrency:
          type: integer
          description: Number of concurrent requests supported by the current plan.
        total_credits:
          type: number
          description: Total credits.
        used_credits:
          type: number
          description: Used credits.
        expired_credits:
          type: number
          description: Expired credits.
        remaining_credits:
          type: number
          description: Remaining credits.
      required: [user_id, payment_type, concurrency, total_credits, used_credits, expired_credits, remaining_credits]
    WorkflowRunRequest:
      type: object
      additionalProperties: false
      properties:
        application_id:
          type: string
        release_version_id:
          type: string
        session_id:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowInputFile'
        inputs:
          type: object
          additionalProperties: true
          description: Workflow input values. Available fields are defined by the input configuration of the target published workflow version.
          properties:
            query:
              type: string
              description: Common text input example. A workflow can define any other fields.
      required: [application_id]
    WorkflowInputFile:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
        name:
          type: string
        mime_type:
          type: string
        size:
          type: integer
        metadata:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: Custom metadata passed with the file to the workflow.
      required: [url, name, mime_type]
    WorkflowCancelRunRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          description: Optional cancel reason. When provided, it is stored as the run error message.
    WorkflowRunResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                run_id:
                  type: string
                status:
                  type: string
                  enum: [pending, running, succeeded, failed, cancelled, paused, timeout]
                output:
                  type:
                    - object
                    - 'null'
                  additionalProperties: true
                error:
                  type:
                    - string
                    - 'null'
                started_at:
                  type:
                    - string
                    - 'null'
                  format: date-time
                ended_at:
                  type:
                    - string
                    - 'null'
                  format: date-time
    FileUploadRequest:
      type: object
      additionalProperties: false
      properties:
        chunk:
          type: string
          format: binary
        application_id:
          type: string
        sharing_scope:
          type: string
          enum: [user, application]
          default: application
      required: [chunk]
    FileUploadResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FileUploadData'
    FileUploadData:
      type: object
      properties:
        id:
          type: string
          description: File ID.
        file_name:
          type: string
          description: File name.
        file_size:
          type: integer
          description: File size in bytes.
        content_type:
          type:
            - string
            - 'null'
          description: MIME type.
        download_url:
          type:
            - string
            - 'null'
          description: File download URL.
      required: [id, file_name, file_size, content_type, download_url]
    FileInfoResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FileInfoData'
    FileInfoData:
      type: object
      properties:
        id:
          type: string
          description: File ID.
        file_name:
          type: string
          description: File name.
        file_size:
          type: integer
          description: File size in bytes.
        content_type:
          type:
            - string
            - 'null'
          description: MIME type.
        status:
          type: string
          description: File status.
      required: [id, file_name, file_size, content_type, status]
