            properties:
              page:
                type: integer
              type:
                type: string
                enum:
                - invoice
                - receipt
                - other
              ticket_index:
                type:
                - integer
                - 'null'
        classify_result:
          type:
          - object
          - 'null'
          additionalProperties: true
        document_classification_detail:
          type:
          - object
          - 'null'
          additionalProperties: true
    DocumentRecognizeResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                task_id:
                  type: string
                file_url:
                  type: string
                message:
                  type: string
                  description: Task status or processing result message.
                status:
                  type: integer
                  enum: [0, 1, 2, 4, 5, 6]
                  description: 0=unknown, 1=ready, 2=running, 4=succeeded, 5=failed, 6=canceled or rejected.
                doc_recognize_result:
                  type: array
                  items:
                    $ref: '#/components/schemas/RecognizePage'
                metadata:
                  type: object
                  additionalProperties: true
                  description: Document processing task metadata.
                aigc:
                  oneOf:
                    - $ref: '#/components/schemas/AigcLabel'
                    - type: 'null'
                  description: AI-generated content compliance label.
                convert_result:
                  type: object
                  additionalProperties: true
                  description: Document conversion result. For Excel files, this includes the native preview manifest and billing details.
                spreadsheet:
                  type: object
                  additionalProperties: true
                  description: Summary of the native Excel structure.
    AigcLabel:
      type: object
      properties:
        Label:
          type: string
          description: Content label type.
        ContentProducer:
          type: string
          description: Content generation service provider identifier.
        ProduceID:
          type: string
          description: Content production identifier.
        ReservedCode1:
          type: string
          description: Reserved validation code for content generation.
        ContentPropagator:
          type: string
          description: Content distribution service provider identifier.
        PropagateID:
          type: string
          description: Content distribution identifier.
        ReservedCode2:
          type: string
          description: Reserved validation code for content distribution.
        ProcessingTypes:
          type: array
          description: AI processing types used to produce this response.
          items:
            type: string
    RecognizePage:
      type: object
      properties:
        page_num:
          type: integer
        document_content:
          type: string
        document_details:
          type: array
          items:
            $ref: '#/components/schemas/DocumentDetail'
        stamps:
          type: array
          description: Stamp recognition results. Returned only when enable_stamp_recognition is enabled and at least one stamp is detected.
          items:
            type: object
            additionalProperties: true
    DocumentDetail:
      type: object
      properties:
        type:
          type: string
        text:
          type: string
        position:
          type: array
          items:
            type: object
            properties:
              points:
                type: array
                items:
                  $ref: '#/components/schemas/Point'
        ocr_confidence:
          type: object
          properties:
            ocr_mean_confidence:
              type: number
            ocr_min_confidence:
              type: number
            is_overall_confidence:
              type: integer
    Point:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
    ExtractionField:
      type: object
      additionalProperties: true
      properties:
        field_key:
          type: string
        field_name:
          type: string
        field_values:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              field_value:
                description: 1425/1423/1424 return string values, including an empty string when missing.
              field_value_translation:
                type: string
                description: Translation separate from field_value.
              field_confidence:
                type: number
                minimum: 0
                maximum: 1
                description: For review when enabled; disabled defaults are not evaluated scores.
              references:
                type: array
                items:
                  type: object
                  additionalProperties: true
        references:
          type: array
          items:
            type: object
            additionalProperties: true
        table_values:
          type: array
          items:
            type: array
            items:
              type: object
              additionalProperties: true
      description: 1425 missing scalar values/cells in existing rows return field_value=""; absent tables return table_values=[]
        without fabricated rows. Zero and valid multiple values are preserved.
    ExtractionFieldConfig:
      type: object
      additionalProperties: false
      properties:
        field_key:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_]{0,63}$
          description: 1–64 characters, beginning with a letter or digit, followed by letters, digits or underscores. 1425 keys
            are globally unique across scalars/tables/columns, ignoring case.
        field_name:
          type: string
          minLength: 1
          maxLength: 50
          description: Field name.
        field_type:
          type: string
          enum:
          - string
          - date
          - table
          description: Field type. Use table for table fields.
        field_prompt:
          type: string
          description: Field extraction prompt.
          maxLength: 3000
        sub_fields:
          type: array
          minItems: 1
          maxItems: 20
          description: Table sub-fields. When field_type is table, provide at least one valid sub-field.
          items:
            $ref: '#/components/schemas/ExtractionSubFieldConfig'
      required:
      - field_name
      - field_type
    ExtractionSubFieldConfig:
      type: object
      additionalProperties: false
      properties:
        field_key:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_]{0,63}$
          description: 1–64 characters, beginning with a letter or digit, followed by letters, digits or underscores. 1425 keys
            are globally unique across scalars/tables/columns, ignoring case.
        field_name:
          type: string
          minLength: 1
          maxLength: 50
          description: Sub-field name.
        field_type:
          type: string
          enum:
          - string
          - date
          description: Sub-field type. Nested tables are not supported inside a table.
          default: string
        field_prompt:
          type: string
          description: Sub-field extraction prompt.
          maxLength: 3000
      required:
      - field_name
    LongDocConfig:
      type: object
      additionalProperties: false
      properties:
        doc_type:
          type: string
          description: Document type.
        doc_desc:
          type: string
          description: Document type description.
      required: [doc_type]
    ExtractionAppCreateRequest:
      oneOf:
      - $ref: '#/components/schemas/HighSpeedExtractionAppCreateRequest'
      - $ref: '#/components/schemas/StandardExtractionAppCreateRequest'
      - $ref: '#/components/schemas/InvoiceApplicationCreateRequest'
      - $ref: '#/components/schemas/ClassificationAppCreateRequest'
    StandardExtractionAppCreateRequest:
      type: object
      additionalProperties: false
      title: Create standard custom extraction application
      properties:
        ai_function:
          type: integer
          enum:
          - 1406
          default: 1406
          description: Application type. Use 1406 to create a standard custom extraction application. If omitted, the API handles
            the request as 1406 by default.
        app_name:
          type: string
          minLength: 1
          maxLength: 50
          description: 1–50 characters after trimming; blank/null names are rejected. Omit on update to retain.
        app_label:
          type: array
          maxItems: 5
          description: Application labels. Up to 5 labels.
          items:
            type: string
        extract_fields:
          type: array
          minItems: 1
          maxItems: 20
          description: Extraction field configuration list. Up to 20 fields.
          items:
            $ref: '#/components/schemas/ExtractionFieldConfig'
        parse_mode:
          type: string
          enum:
          - standard
          - advance
          - agentic
          - fast_vlm
          - agentic_v2
          description: 'Parsing mode. Required for standard custom extraction applications. Available parsing modes are:


            - standard: Standard parsing for clear digital documents, balancing speed and accuracy.

            - advance: Enhanced parsing 1.0 for documents with stamps, signatures, multiple tables, or moderately complex layouts.

            - agentic: Smart parsing that combines standard and enhanced parsing and performs secondary parsing when conditions
            are met.

            - fast_vlm: Enhanced parsing 2.0 for complex layouts, scanned documents, and documents with multiple tables, improving
            parsing stability.

            - agentic_v2: Smart parsing 2.0 with two-stage layout analysis and content recognition for documents with complex
            layouts, tables, and formulas.

            '
        enable_highlight:
          anyOf:
          - type: boolean
          - type: integer
            enum:
            - 0
            - 1
          description: Classic creation defaults to enabled; legacy 0/1 input remains accepted. High-speed apps use booleans.
        enable_pdf_parse:
          type: boolean
          default: false
          description: Whether to prefer PDF text extraction. Use this for digital PDFs with selectable text to improve processing
            speed and text stability.
        pdf_pic_second_parsing:
          type: boolean
          default: false
          description: When PDF text extraction is enabled, whether to run secondary parsing on images inside the PDF.
        enable_stamp_recognition:
          type: boolean
          default: false
          description: Whether to enable stamp recognition. The service attempts to recognize stamp information in the document.
            Stamp recognition capability must be enabled.
        enable_field_value_translation:
          type: boolean
          default: false
          description: Whether to enable extracted value translation. Disabled by default.
        enable_long_doc:
          type: boolean
          default: false
          description: Whether to enable long document support.
        long_doc_config:
          type: array
          maxItems: 5
          description: Long document configuration. Used only when enable_long_doc is true.
          items:
            $ref: '#/components/schemas/LongDocConfig'
        description:
          type:
          - string
          - 'null'
          maxLength: 1500
          description: Classification description. On update, omit to retain; empty clears it.
        app_code:
          type:
          - string
          - 'null'
          maxLength: 64
          description: Optional business code, up to 64 characters without a character-pattern restriction. Case-sensitive unique
            per tenant/owner. Omit on update to retain; empty clears; unset returns null. Not an authentication credential.
      required:
      - app_name
      - extract_fields
      - parse_mode
    HighSpeedExtractionAppCreateRequest:
      type: object
      additionalProperties: false
      title: Create high-speed extraction application
