components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Production API Key. You can find it under My API in the ADP platform. Make sure the API Key is active and belongs to the production environment.
    EngineApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key for workflow endpoints.
  parameters:
    TenantName:
      name: tenant_name
      in: path
      required: true
      description: "Tenant name. Default: laiye."
      schema:
        type: string
        default: laiye
    TaskId:
      name: task_id
      in: path
      required: true
      description: Task ID.
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      description: Run ID.
      schema:
        type: string
    FileId:
      name: file_id
      in: path
      required: true
      description: File ID.
      schema:
        type: string
    AcceptLanguage:
      name: accept-language
      in: header
      required: false
      description: Field name language. Use zh for Chinese or en for English.
      schema:
        type: string
        enum: [zh, en]
        default: en
  examples:
    DocumentRecognitionFileBase64:
      summary: Use file Base64
      value:
        file_base64: &documentRecognitionFileBase64 data:image/jpeg;base64,
        app_id: &documentRecognitionAppId ootb_k7m2x9p4v1n8w3q6r5t0y2b4
