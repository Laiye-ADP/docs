    AppConfigResponse:
      description: Application configuration result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppConfigResponse'
          examples:
            highSpeed:
              value:
                code: success
                message: ''
                tips: null
                data:
                  app_id: 8f4b2c506df811f1a3d90242ac120002
                  app_name: Purchase contracts
                  description: Purchase contracts and signature pages, excluding invoices
                  app_code: purchase_contract
                  config_version: v1
                  extract_fields:
                  - field_key: contract_no
                    field_name: Contract No
                    field_type: string
                    field_prompt: 提取合同编号
                  - field_key: contract_amount
                    field_name: Contract Amount
                    field_type: number
                    field_prompt: 提取合同总金额
                    format:
                      mode: preset
                      preset: grouped_decimal
                      decimal_places: 2
                      rounding: half_up
                  - field_key: signed_at
                    field_name: Signed At
                    field_type: date
                    field_prompt: 提取合同签署日期
                    format:
                      mode: preset
                      preset: date_iso
                  - field_key: purchase_items
                    field_name: Purchase Items
                    field_type: table
                    sub_fields:
                    - field_key: item_name
                      field_name: Item Name
                      field_type: string
                      field_prompt: 提取每一行的商品名称
                    - field_key: item_amount
                      field_name: Item Amount
                      field_type: number
                      field_prompt: 提取每一行的金额
                      format:
                        mode: preset
                        preset: grouped_decimal
                        decimal_places: 2
                        rounding: half_up
                    - field_key: delivery_date
                      field_name: Delivery Date
                      field_type: date
                      field_prompt: 提取每一行约定的交付日期
                      format:
                        mode: preset
                        preset: date_iso
                  - field_key: payment_schedule
                    field_name: Payment Schedule
                    field_type: table
                    sub_fields:
                    - field_key: payment_stage
                      field_name: Payment Stage
                      field_type: string
                      field_prompt: 提取每一行的付款阶段
                    - field_key: payment_amount
                      field_name: Payment Amount
                      field_type: number
                      field_prompt: 提取每一行应付的金额
                      format:
                        mode: preset
                        preset: grouped_decimal
                        decimal_places: 2
                        rounding: half_up
                    - field_key: payment_date
                      field_name: Payment Date
                      field_type: date
                      field_prompt: 提取每一行约定的付款日期
                      format:
                        mode: preset
                        preset: date_iso
                  parse_mode: null
                  enable_highlight: true
                  enable_field_value_translation: false
                  enable_confidence: true
                  enable_long_doc: false
    FieldConfigGenerateResponse:
      description: Normalized field configuration generated from a sample file. The endpoint does not create an application or save a configuration version.
