    CollaborationRuleItem:
      type: object
      properties:
        rule_dimension:
          type: string
          description: 'Review dimension: 整体文档 (overall document), 文档置信度 (document confidence), or a published field name. Prefer ordinary fields whose name matches their key; verify triggering
            for system dimensions and fields whose name differs from their key.'
        rule_setting:
          type: string
          description: Natural-language condition that triggers human review, for example “equals INV-AUDIT-001”. A match routes the document to human review.
      required:
        - rule_dimension
        - rule_setting
    CollaborationRuleRequest:
      type: object
      properties:
        app_id:
          type: string
          description: Application ID. Use the actual ID of a published standard custom extraction application owned by the current account.
          example: app_abc123
        rule_name:
          type: string
          description: Rule name. The current service allows at most 50 characters and requires unique names across applications under the same account.
          minLength: 1
          maxLength: 50
        rule_status:
          type: boolean
          default: true
          description: Whether the rule is enabled. Use false to disable it. The query endpoint may still return true; verify the effect with an extraction run.
        rule:
          type: array
          items:
            $ref: '#/components/schemas/CollaborationRuleItem'
          minItems: 1
          maxItems: 100
          description: Review trigger conditions, 1–100 items.
        rule_logic:
          type: integer
          default: 1
          enum:
            - 1
            - 2
          description: 1=any condition matches (OR); 2=all conditions match (AND). Send only 1 or 2; other values may currently be accepted incorrectly.
      required:
        - app_id
        - rule_name
        - rule
    CollaborationRuleData:
      type: object
      properties:
        rule_name:
          type: string
        app_id:
          type: string
        rule_status:
          type: boolean
          description: Enabled status. This may remain true after disabling; do not use it alone to confirm the effective state.
        rule:
          type: array
          items:
            $ref: '#/components/schemas/CollaborationRuleItem'
        rule_logic:
          type: integer
          description: 1=OR, 2=AND.
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - rule_name
        - app_id
        - rule_status
        - rule_logic
    CollaborationTableCell:
      type: object
      properties:
        field_name:
          type: string
          description: Published table column name.
        field_key:
          type: string
          description: Original cell field key. Copy it from task details when it must be preserved.
        field_values:
          type: array
          items:
            type: object
            properties:
              field_value:
                type: string
                description: Corrected cell text.
              references:
                type: array
                items:
                  type: object
                  additionalProperties: true
                description: Document locations from the original value. Copy them in full from the query result to retain them.
            required:
              - field_value
            additionalProperties: true
          description: Cell values are an array of objects, unlike the string array used for ordinary fields.
        references:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Original cell source locations. Copy them from task details to retain highlighting.
      required:
        - field_name
        - field_values
      additionalProperties: true
    CollaborationResultField:
      type: object
      properties:
        field_name:
          type: string
          description: Exact name of an existing extraction field. Unknown names may be ignored while still completing the task; validate names before submission.
        field_type:
          type: string
          description: 'Field type: string=text, date=date, table=table. Match the original field type.'
        field_values:
          type: array
          items:
            type: string
          default: []
          description: Full value list for an ordinary field. Provide it explicitly; shortening the list may leave old trailing values, so read the complete result back. Omit this parameter
            for table fields.
        table_values:
          anyOf:
            - type: array
              items:
                type: array
                items:
                  $ref: '#/components/schemas/CollaborationTableCell'
            - type: 'null'
          description: 'Replaces the entire table: outer array=rows, each row=array of cell objects. Submit the complete target table, copying field_key/references and other information
            to retain. Do not also send field_values.'
      required:
        - field_name
        - field_type
    CollaborationResultRequest:
      type: object
      properties:
        file_task_id:
          type: string
          description: 'Collaboration task primary ID: data.metadata.collaboration_task_id from asynchronous extraction or data.id from task details. This is not task_number, the extraction
            task_id, or data_id.'
        collaboration_result:
          type: array
          items:
            $ref: '#/components/schemas/CollaborationResultField'
          description: Existing fields to confirm or correct. Submit valid fields with explicit values only for a task in task_state=2. Submission completes the task.
      required:
        - file_task_id
        - collaboration_result
    CollaborationResultData:
      type: object
      properties:
        file_status:
          type: integer
          description: A successful submission returns 4=completed. See task_state in task details for the full collaboration status dictionary.
          example: 4
      required:
        - file_status
