    WorkflowRunExportRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkflowRunExportRequest'
          example:
            application_id: app_abc123
            run_ids: [run_xyz789]
            format: excel
            report_mode: merged
            include_failed_runs: false
            max_text_length: 10000
  responses:
    SimpleResponse:
      description: Common response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleResponse'
          example:
            code: success
            message: success
    ValidationError:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPValidationError'
          example:
            detail:
