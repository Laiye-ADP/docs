      properties:
        mode:
          type: string
          const: preset
        preset:
          type: string
          enum:
          - date_iso
          - date_slash
          - date_cn
          - datetime
          description: YYYY-MM-DD / YYYY/MM/DD / YYYY年MM月DD日 / YYYY-MM-DD HH:mm:ss
    NumberPresetFormat:
      type: object
      additionalProperties: false
      required:
      - mode
      - preset
      properties:
        mode:
          type: string
          const: preset
        preset:
          type: string
          enum:
          - integer
          - decimal
          - grouped_integer
          - grouped_decimal
        decimal_places:
          type: integer
          minimum: 0
          description: For decimal/grouped_decimal only; defaults to 2, may be 0. Omit for integer presets.
        rounding:
          type: string
          enum:
          - half_up
          - truncate
          default: half_up
          description: half_up rounds ties away from zero; truncate discards toward zero.
      allOf:
      - if:
          properties:
            preset:
              enum:
              - integer
              - grouped_integer
        then:
          not:
            required:
            - decimal_places
