    FileUploadResponse:
      description: File upload result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FileUploadResponse'
    FileInfoResponse:
      description: File information.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FileInfoResponse'
    DocumentConvertTaskResponse:
