openapi: 3.1.0
info:
  title: ADP API
  version: 1.0.0
  description: Laiye ADP OpenAPI reference for document extraction, recognition, and conversion; extraction application management; webhooks; credit usage; workflow discovery, runs, exports, and file management.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://adp-global.laiye.com
    description: ADP global production endpoint
tags:
  - name: Document extraction
    description: Extract structured fields from uploaded documents.
  - name: Document recognition
    description: Recognize text, layout blocks, and positions from uploaded documents.
  - name: Document conversion
    description: Convert PDFs, Office documents, OFD files, and images into page images or native spreadsheet structures.
  - name: Application management
    description: Create, update, delete, and query extraction applications and configurations.
  - name: Webhook
    description: List system events and manage event callbacks.
  - name: Account
    description: Query credit usage.
  - name: Workflow
    description: Run workflow applications and query run results.
  - name: Workflow files
    description: Upload and manage files used by workflow applications.
paths:
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract:
    post:
      tags: [Document extraction]
      summary: Extract document (sync)
      description: For a user-uploaded document, call the specified document extraction application and extract content from the file based on the application configuration and rules. The same endpoint applies to custom extraction applications, overseas invoices, receipts, purchase orders, domestic general bills, and cards.
      operationId: extractDocument
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        $ref: '#/components/requestBodies/DocumentExtractRequest'
      responses:
        '200':
          $ref: '#/components/responses/DocumentExtractResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract/create/task:
    post:
      tags: [Document extraction]
      summary: Create document extraction task
      description: Create a document extraction task and return task_id immediately. Use this endpoint for large documents or long-running extraction tasks.
      operationId: createDocumentExtractTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        $ref: '#/components/requestBodies/DocumentExtractRequest'
      responses:
        '200':
          $ref: '#/components/responses/TaskCreateResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract/query/task/{task_id}:
    get:
      tags: [Document extraction]
      summary: Query document extraction result
      description: Query document extraction status and results by the task_id returned by the task creation endpoint.
      operationId: queryDocumentExtractTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          $ref: '#/components/responses/DocumentExtractResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/recognize:
    post:
      tags: [Document recognition]
      summary: Recognize document (sync)
      description: Recognize text content and block positions from an uploaded document.
      operationId: recognizeDocument
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        $ref: '#/components/requestBodies/DocumentFileRequest'
      responses:
        '200':
          $ref: '#/components/responses/DocumentRecognizeResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/recognize/create/task:
    post:
      tags: [Document recognition]
      summary: Create document recognition task
      description: Create an async document recognition task and return task_id immediately.
      operationId: createDocumentRecognizeTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        $ref: '#/components/requestBodies/DocumentFileRequest'
      responses:
        '200':
          $ref: '#/components/responses/TaskCreateResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/recognize/query/task/{task_id}:
    get:
      tags: [Document recognition]
      summary: Query document recognition result
      description: Query document recognition status and results by task_id.
      operationId: queryDocumentRecognizeTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          $ref: '#/components/responses/DocumentRecognizeResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/doc/convert:
    post:
      tags: [Document conversion]
      summary: Convert document (sync)
      description: |
        Convert a PDF, DOC/DOCX, XLS/XLSX, PPT/PPTX, OFD file, or common image into page images. XLSX input may instead return a native spreadsheet structure. Provide exactly one of `file_url` and `file_base64`.

        The current implementation accepts at most 50 MiB and 260 pages. A synchronous request may reach the service timeout at approximately 120 seconds, so production integrations should prefer the asynchronous create and query endpoints. A failure branch may return HTTP 200 with `code=success` and `data=null`. Confirm that `data` exists, then inspect `task_id`, `img_detail_list`, or the spreadsheet structure fields. Returned URLs are currently valid for approximately one hour, but this is not a stable SLA; download them promptly.
      operationId: convertDocument
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/DocumentConvertRequest'
      responses:
        '200':
          $ref: '#/components/responses/DocumentConvertResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/doc/convert/create/task:
    post:
      tags: [Document conversion]
      summary: Create asynchronous document conversion task
      description: |
        Create a document conversion task and return its `task_id` immediately. Queue messages are currently retained for approximately one hour, a task consumer times out after approximately 180 seconds, and result files are generally valid for approximately one hour. These durations are not stable SLAs.

        Creation failure may still appear as HTTP 200 with `code=success` and `data=null`. Require a non-empty `data.task_id`, then poll the query endpoint with a backoff strategy.
      operationId: createDocumentConvertTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/DocumentConvertAsyncRequest'
      responses:
        '200':
          $ref: '#/components/responses/DocumentConvertTaskResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/doc/convert/query/task/{task_id}:
    get:
      tags: [Document conversion]
      summary: Query asynchronous document conversion task
      description: |
        Query a conversion result by `task_id`. The current response has no separate task-status field. While processing is still in progress, the service may return `code=success` with an empty `img_detail_list` and zero `total_num`. Poll with backoff and stop only after page results or a spreadsheet structure is available.

        An empty result cannot reliably distinguish "still processing" from "no visual pages." Set a total client timeout and a maximum poll count.
      operationId: queryDocumentConvertTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - name: task_id
          in: path
          required: true
          description: Task ID returned after an asynchronous conversion task is created.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          $ref: '#/components/responses/DocumentConvertResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/webhook/events:
    get:
      tags: [Webhook]
      summary: List Webhook event catalog
      description: |
        Return the system event types currently registered for subscription. The catalog indicates only that an event name can be configured; it does not imply a delivery SLA for every event. Fields in callback `data` may also vary by event.

        The current catalog contains seven events: document recognition completed, document extraction completed, and human collaboration started, succeeded, failed, completed, or timed out. `collaboration_timeout` currently means only that the event is registered; actual delivery is not guaranteed.
      operationId: listWebhookEvents
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      responses:
        '200':
          $ref: '#/components/responses/WebhookEventListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/webhook/create:
    post:
      tags: [Webhook]
      summary: Create Webhook
      description: |
        Create a Webhook configuration. Each account can retain at most five configurations. If `app_id` is omitted, `null`, or an empty array, the Webhook subscribes to all applications under the current account. Pass an array to subscribe only to specific applications.

        Callbacks use POST `application/json` with a body shaped as `{event_type, timestamp, data}`. The production service sends `X-Webhook-Signature: sha256=...` and `X-Webhook-Timestamp`. The signature is computed as `HMAC-SHA256(secret, timestamp + "." + raw_body)`.

        The current OpenAPI does not return, set, or rotate the secret, so an external caller cannot independently verify signatures. Failed-delivery retries also have no public SLA. Configure only a caller-controlled, public HTTPS endpoint, and return HTTP 200 promptly from the receiver. Do not use this endpoint as a production event bus before a security and reliability review.
      operationId: createWebhook
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/WebhookCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/WebhookMutationResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/webhook/list:
    get:
      tags: [Webhook]
      summary: List Webhook configurations
      description: List Webhook configurations for the current account. Use `app_id` to match configurations that include the extraction application; configurations scoped to all applications also match. The response never returns the callback-signing secret.
      operationId: listWebhooks
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - name: app_id
          in: query
          required: false
          description: Filter by extraction application ID or application key.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/WebhookListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/webhook/update:
    post:
      tags: [Webhook]
      summary: Update Webhook
      description: |
        Update the callback URL, event types, or application scope. Omitting `app_id` leaves the application scope unchanged. Passing `null` or an empty array explicitly clears the scope and subscribes to all applications under the current account.

        The backend accepts a request containing only `webhook_id` as a no-op. The public contract requires at least one field to update. Use only a caller-controlled, public HTTPS callback URL.
      operationId: updateWebhook
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/WebhookUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/WebhookMutationResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/webhook/delete:
    post:
      tags: [Webhook]
      summary: Delete Webhook
      description: Delete a Webhook configuration for the current account. Deleting the configuration does not delete historical delivery logs that have already been generated.
      operationId: deleteWebhook
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/WebhookDeleteRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmptyMutationResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/webhook/logs:
    post:
      tags: [Webhook]
      summary: Query Webhook delivery logs
      description: |
        Query Webhook delivery results. The default window is the last 72 hours, and one request can span at most 30 days. `response_body` retains at most approximately 2,000 characters and may contain business or sensitive information returned by the receiver.

        The current service queries logs at tenant scope and does not further isolate them by the user who created the Webhook. Use this endpoint only with an administrator Access Key in a controlled tenant, and pass `webhook_id` whenever possible to narrow the scope. Do not expose log responses to ordinary end users.
      operationId: queryWebhookLogs
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/WebhookLogQueryRequest'
      responses:
        '200':
          $ref: '#/components/responses/WebhookLogResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app-manage/create:
    post:
      tags: [Application management]
      summary: Create extraction application
      description: Create a standard or high-speed custom extraction application, and configure labels, fields, and extraction settings. Standard applications support parse_mode, source locations, PDF text first, stamp recognition, and related parsing settings. To create a high-speed custom extraction application, set ai_function to 1425 and provide field_key for fields and table sub-fields. High-speed applications do not support standard parsing settings. An HTTP 200 response can still represent a business failure, so callers must check both the HTTP status and the response code.
      operationId: createExtractionApp
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/ExtractionAppCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/ExtractionAppResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-codeSamples:
        - lang: python
          label: Python (check HTTP status and business code)
          source: |
            import requests

            response = requests.post(
                "https://adp-global.laiye.com/open/agentic_doc_processor/laiye/v1/app-manage/create",
                headers={"X-API-KEY": "YOUR_API_KEY"},
                json={
                    "ai_function": 1406,
                    "app_name": "Purchase order extraction app",
                    "extract_fields": [
                        {"field_name": "Order number", "field_type": "string"}
                    ],
                    "parse_mode": "standard",
                },
                timeout=60,
            )
            response.raise_for_status()
            result = response.json()
            if result.get("code") not in ("success", 200, "200"):
                raise RuntimeError(result.get("message") or result.get("code"))
  /open/agentic_doc_processor/{tenant_name}/v1/app-manage/delete:
    post:
      tags: [Application management]
      summary: Delete extraction application
      description: Delete an extraction application. This action cannot be undone. To delete a high-speed custom extraction application, reuse this endpoint and pass the app_id of the high-speed application.
      operationId: deleteExtractionApp
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/AppIdRequest'
      responses:
        '200':
          $ref: '#/components/responses/ExtractionAppDeleteResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app-manage/update:
    post:
      tags: [Application management]
      summary: Update extraction application
      description: Update the name, labels, fields, and extraction configuration of an extraction application, and create a new configuration version. To update a high-speed custom extraction application, reuse this endpoint and pass the app_id of the high-speed application. The request body does not need ai_function. High-speed custom extraction applications do not support setting parse_mode, enable_highlight, enable_pdf_parse, pdf_pic_second_parsing, enable_stamp_recognition, or enable_long_doc. An HTTP 200 response can still represent a business failure, so callers must check both the HTTP status and the response code.
      operationId: updateExtractionApp
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/ExtractionAppUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/ExtractionAppUpdateResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-codeSamples:
        - lang: python
          label: Python (check HTTP status and business code)
          source: |
            import requests

            response = requests.post(
                "https://adp-global.laiye.com/open/agentic_doc_processor/laiye/v1/app-manage/update",
                headers={"X-API-KEY": "YOUR_API_KEY"},
                json={
                    "app_id": "app_1406",
                    "extract_fields": [
                        {"field_name": "Order number", "field_type": "string"}
                    ],
                    "parse_mode": "standard",
                },
                timeout=60,
            )
            response.raise_for_status()
            result = response.json()
            if result.get("code") not in ("success", 200, "200"):
                raise RuntimeError(result.get("message") or result.get("code"))
  /open/agentic_doc_processor/{tenant_name}/v1/app-manage/config:
    post:
      tags: [Application management]
      summary: Get application configuration
      description: Get an extraction application configuration by app_id. To get a high-speed custom extraction application configuration, pass the app_id of the high-speed application. If config_version is omitted, the latest configuration version is returned.
      operationId: getExtractionAppConfig
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/AppConfigQueryRequest'
      responses:
        '200':
          description: Application configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigResponse'
              examples:
                standardConfig:
                  value:
                    code: 200
                    message: success
                    data:
                      app_id: app_1406
                      app_name: Purchase order extraction app
                      app_label: [purchase-order]
                      config_version: v1
                      extract_fields:
                        - field_name: Order number
                          field_type: string
                          field_prompt: Extract the purchase order number.
                      parse_mode: fast_vlm
                      enable_highlight: 0
                      enable_pdf_parse: true
                      pdf_pic_second_parsing: false
                      enable_stamp_recognition: true
                      enable_long_doc: false
                highSpeedConfig:
                  value:
                    code: 200
                    message: success
                    data:
                      app_id: app_1425
                      app_name: High-speed invoice extraction app
                      app_label: [invoice, high-speed]
                      config_version: v1
                      extract_fields:
                        - field_name: Invoice number
                          field_type: string
                          field_prompt: Extract the unique invoice number from the invoice.
                      parse_mode: null
                      enable_highlight: null
                      enable_pdf_parse: null
                      pdf_pic_second_parsing: null
                      enable_stamp_recognition: null
                      enable_long_doc: false
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app-list:
    get:
      tags: [Application management]
      summary: List applications
      description: List applications. To list high-speed custom extraction applications, set ai_function=1425.
      operationId: listExtractionApps
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - name: app_name
          in: query
          required: false
          description: Filter by application name. Fuzzy matching is supported.
          schema:
            type: string
        - name: ai_function
          in: query
          required: false
          description: Filter by AI capability. Use 1425 for high-speed custom extraction applications and 1406 for standard custom extraction applications.
          schema:
            type: integer
            enum: [1406, 1425]
        - name: app_type
          in: query
          required: false
          description: Application type. 1 means custom application. 0 means system preset.
          schema:
            type: integer
            enum: [0, 1]
        - name: with_extra
          in: query
          required: false
          description: Whether to query extra information.
          schema:
            type: integer
            enum: [0, 1]
            default: 1
        - name: sort[]
          in: query
          required: false
          description: Sort fields. Prefix a field with - for descending order; omit the prefix for ascending order. The default is updated_at in descending order.
          style: form
          explode: true
          schema:
            type: array
            default: [-updated_at]
            items:
              type: string
        - name: offset
          in: query
          required: false
          description: Pagination offset.
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 1000
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 1000
      responses:
        '200':
          $ref: '#/components/responses/AppListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app-manage/version/delete:
    post:
      tags: [Application management]
      summary: Delete extraction application configuration
      description: Delete a field configuration version under an application. To delete the configuration of a high-speed custom extraction application, reuse this endpoint and pass the high-speed application app_id and the config_version to delete.
      operationId: deleteExtractionAppVersion
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/AppVersionDeleteRequest'
      responses:
        '200':
          $ref: '#/components/responses/ExtractionAppVersionDeleteResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app-manage/ai-recommend:
    post:
      tags: [Application management]
      summary: Generate extraction field prompts
      description: Generate field names, field types, field prompts, and other configuration references from a sample document or prompt. Standard applications require at least one of prompt, file_url, or file_base64. High-speed applications still require file_url or file_base64, and prompt is only an auxiliary instruction. When app_id belongs to a high-speed custom extraction application, the endpoint returns a configuration preview containing common_rule, field_rule, and table_rule. It does not save a configuration version or automatically populate the Web application. An HTTP 200 response can still represent a business failure, so callers must check both the HTTP status and the response code.
      operationId: recommendExtractionFields
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/AiRecommendRequest'
      responses:
        '200':
          $ref: '#/components/responses/AiRecommendResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-codeSamples:
        - lang: python
          label: Python (check HTTP status and business code)
          source: |
            import requests

            response = requests.post(
                "https://adp-global.laiye.com/open/agentic_doc_processor/laiye/v1/app-manage/ai-recommend",
                headers={"X-API-KEY": "YOUR_API_KEY"},
                json={
                    "app_id": "app_1406",
                    "prompt": "Generate fields for invoice number, invoice date, and total amount.",
                },
                timeout=120,
            )
            response.raise_for_status()
            result = response.json()
            if result.get("code") not in ("success", 200, "200"):
                raise RuntimeError(result.get("message") or result.get("code"))
  /open/agentic_doc_processor/{tenant_name}/v1/user/payment:
    get:
      tags: [Account]
      summary: Get credit usage
      description: Get current user credit usage by X-API-KEY.
      operationId: getUserPayment
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      responses:
        '200':
          $ref: '#/components/responses/UserPaymentResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_engine/laiye/v1/app/applications:
    get:
      tags: [Workflow]
      summary: List runnable workflow applications
      description: List published workflow applications visible to the current Access Key. Results can be searched by name and paginated. Use the returned `id` as `application_id` when calling a run endpoint.
      operationId: listWorkflowApplications
      security:
        - EngineApiKeyAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Search by application name.
          schema:
            type: string
        - name: offset
          in: query
          required: false
          description: Pagination offset.
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          description: Number of applications per page.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          $ref: '#/components/responses/WorkflowApplicationListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_engine/laiye/v1/app/applications/{application_id}:
    get:
      tags: [Workflow]
      summary: Get workflow application details (Limited preview)
      description: |
        Get an application's name, description, status, and tags by application ID.

        Limited preview: the detail route's visibility check is not fully aligned with the list route. Query only an `application_id` obtained from the list endpoint that is owned by the current account or explicitly shared with the current tenant. Do not pass an arbitrary external ID to this endpoint.
      operationId: getWorkflowApplication
      security:
        - EngineApiKeyAuth: []
      parameters:
        - name: application_id
          in: path
          required: true
          description: Application ID obtained from the workflow application list.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          $ref: '#/components/responses/WorkflowApplicationResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_engine/laiye/v1/app/run:
    post:
      tags: [Workflow]
      summary: Run workflow application (sync)
      description: Run the published workflow application version synchronously and wait for the result.
      operationId: runWorkflowApp
      security:
        - EngineApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/WorkflowRunRequest'
      responses:
        '200':
          $ref: '#/components/responses/WorkflowRunResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_engine/laiye/v1/app/run/create/task:
    post:
      tags: [Workflow]
      summary: Create workflow run task
      description: Trigger a workflow run asynchronously and return run_id immediately.
      operationId: createWorkflowRunTask
      security:
        - EngineApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/WorkflowRunRequest'
      responses:
        '200':
          $ref: '#/components/responses/WorkflowRunResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_engine/laiye/v1/app/run/query/task/{run_id}:
    get:
      tags: [Workflow]
      summary: Query workflow run result
      description: Query workflow run status and result by run_id.
      operationId: queryWorkflowRunTask
      security:
        - EngineApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          $ref: '#/components/responses/WorkflowRunResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_engine/laiye/v1/app/run/{run_id}/rerun:
    post:
      tags: [Workflow]
      summary: Rerun workflow
      description: Trigger a new workflow run from a historical run. The API reuses the original run's application, version, and inputs, and creates a new asynchronous run task.
      operationId: rerunWorkflowRunTask
      security:
        - EngineApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          $ref: '#/components/responses/WorkflowRunResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_engine/laiye/v1/app/run/{run_id}/cancel:
    post:
      tags: [Workflow]
      summary: Cancel workflow run
      description: Cancel a pending, running, or paused workflow run. Succeeded, failed, cancelled, or timed-out runs cannot be cancelled.
      operationId: cancelWorkflowRunTask
      security:
        - EngineApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        $ref: '#/components/requestBodies/WorkflowCancelRunRequest'
      responses:
        '200':
          $ref: '#/components/responses/WorkflowRunResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_engine/laiye/v1/app/runs/export:
    post:
      tags: [Workflow]
      summary: Export workflow runs (Limited preview)
      description: |
        Export specified workflow runs as Excel, Word, Markdown, or JSON, and return a temporary download URL plus run summaries. The public contract requires at least one explicit `run_id`; it does not expose the backend compatibility behavior that treats an empty list as "export all runs for the application."

        The current implementation processes at most 200 runs and generates at most 500,000 rows per request. Temporary files are generally valid for approximately one hour. Limited preview: this route validates only the Access Key and tenant; it has no independent administrator-role or application-visibility check. Use it only as an administrator in a controlled tenant, and export only `application_id` and `run_ids` that you have independently confirmed you can access. Exports may contain workflow inputs, node outputs, and business data. Protect the downloaded file at the same classification level as its source data.
      operationId: exportWorkflowRuns
      security:
        - EngineApiKeyAuth: []
      requestBody:
        $ref: '#/components/requestBodies/WorkflowRunExportRequest'
      responses:
        '200':
          $ref: '#/components/responses/WorkflowRunExportResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_engine/laiye/files/upload:
    post:
      tags: [Workflow files]
      summary: Upload file
      description: Upload a file to engine storage and return the file ID and download URL.
      operationId: uploadWorkflowFile
      security:
        - EngineApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '200':
          $ref: '#/components/responses/FileUploadResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_engine/laiye/files/{file_id}:
    get:
      tags: [Workflow files]
      summary: Get file information
      description: Get file metadata by file ID.
      operationId: getWorkflowFile
      security:
        - EngineApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          $ref: '#/components/responses/FileInfoResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Production OpenAPI Accessor access_key. You can find it in My API in the ADP platform. If the key is disabled, expired, or does not belong to the production environment, the API returns Accessor not found.
    EngineApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Workflow engine API access key.
  parameters:
    TenantName:
      name: tenant_name
      in: path
      required: true
      description: "Tenant name. Default: laiye."
      schema:
        type: string
        default: laiye
    TaskId:
      name: task_id
      in: path
      required: true
      description: Task ID.
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      description: Run ID.
      schema:
        type: string
    FileId:
      name: file_id
      in: path
      required: true
      description: File ID.
      schema:
        type: string
    AcceptLanguage:
      name: accept-language
      in: header
      required: false
      description: Field name language. Use zh for Chinese or en for English.
      schema:
        type: string
        enum: [zh, en]
        default: en
  examples:
    DocumentRecognitionFileBase64:
      summary: Use file Base64
      value:
        file_base64: &documentRecognitionFileBase64 data:image/jpeg;base64,
        app_id: &documentRecognitionAppId ootb_k7m2x9p4v1n8w3q6r5t0y2b4
        model_params:
          recognize_config:
            recognize_mode: standard
            enable_highlight: 1
            enable_pdf_parse: false
            pdf_pic_second_parsing: false
            enable_stamp_recognition: false
    DocumentRecognitionFileUrl:
      summary: Use file URL
      value:
        file_url: &documentRecognitionFileUrl https://adp.laiye.com/web/agentic_doc_processor/laiye/file/2003c711818811f1a36200163e358400
        app_id: *documentRecognitionAppId
        model_params:
          recognize_config:
            recognize_mode: standard
            enable_highlight: 1
            enable_pdf_parse: true
            pdf_pic_second_parsing: false
            enable_stamp_recognition: false
  requestBodies:
    DocumentFileRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentFileRequest'
          examples:
            fileUrl:
              $ref: '#/components/examples/DocumentRecognitionFileUrl'
            fileBase64:
              $ref: '#/components/examples/DocumentRecognitionFileBase64'
    DocumentExtractRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentExtractRequest'
          examples:
            fileUrl:
              value:
                app_id: app_abc123
                file_url: https://adp.laiye.com/web/agentic_doc_processor/laiye/file/2003c711818811f1a36200163e358400
                with_rec_result: false
            fileBase64:
              value:
                app_id: app_abc123
                file_base64: JVBERi0xLjQKJcfs...
                with_rec_result: true
    AppIdRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppIdRequest'
          examples:
            standardCustomExtractionApp:
              summary: Delete standard custom extraction application
              value:
                app_id: app_abc123
            highSpeedCustomExtractionApp:
              summary: Delete high-speed custom extraction application
              value:
                app_id: app_1425
    AppVersionDeleteRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppVersionDeleteRequest'
          examples:
            highSpeedConfigVersion:
              summary: Delete high-speed custom extraction application configuration version
              value:
                app_id: app_1425
                config_version: v2
    ExtractionAppCreateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExtractionAppCreateRequest'
          examples:
            standardCustomExtractionApp:
              summary: Create standard custom extraction application
              value:
                ai_function: 1406
                app_name: Purchase order extraction app
                app_label: [purchase-order]
                extract_fields:
                  - field_name: Order number
                    field_type: string
                    field_prompt: Extract the purchase order number.
                  - field_name: Order date
                    field_type: date
                    field_prompt: Extract the order date.
                parse_mode: standard
                enable_highlight: 1
                enable_pdf_parse: false
                pdf_pic_second_parsing: false
                enable_stamp_recognition: false
                enable_long_doc: false
            highSpeedCustomExtractionApp:
              summary: Create high-speed custom extraction application
              value:
                ai_function: 1425
                app_name: High-speed invoice extraction app
                app_label: [invoice, high-speed]
                extract_fields:
                  - field_key: invoice_no
                    field_name: Invoice number
                    field_type: string
                    field_prompt: Extract the unique invoice number from the invoice.
                  - field_key: invoice_date
                    field_name: Invoice date
                    field_type: date
                    field_prompt: Extract the invoice issue date.
                  - field_key: line_items
                    field_name: Line items
                    field_type: table
                    sub_fields:
                      - field_key: item_name
                        field_name: Item name
                        field_type: string
                      - field_key: item_date
                        field_name: Date
                        field_type: date
                enable_field_value_translation: false
    ExtractionAppUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExtractionAppUpdateRequest'
          examples:
            standardCustomExtractionApp:
              summary: Update standard custom extraction application
              value:
                app_id: app_1406
                app_name: Purchase order extraction app (new version)
                config_version: v1
                app_label: [purchase-order]
                extract_fields:
                  - field_name: Order number
                    field_type: string
                    field_prompt: Extract the purchase order number.
                  - field_name: Supplier name
                    field_type: string
                    field_prompt: Extract the supplier name.
                parse_mode: fast_vlm
                enable_highlight: 1
                enable_pdf_parse: true
                pdf_pic_second_parsing: false
                enable_stamp_recognition: true
                enable_long_doc: false
            highSpeedCustomExtractionApp:
              summary: Update high-speed custom extraction application
              value:
                app_id: app_1425
                app_name: High-speed invoice extraction app (new version)
                config_version: v1
                app_label: [invoice, high-speed]
                extract_fields:
                  - field_key: invoice_no
                    field_name: Invoice number
                    field_type: string
                    field_prompt: Extract the unique invoice number from the invoice.
                  - field_key: invoice_date
                    field_name: Invoice date
                    field_type: date
                    field_prompt: Extract the invoice issue date.
                  - field_key: total_amount
                    field_name: Total amount
                    field_type: string
                    field_prompt: Extract the total amount including tax.
                  - field_key: line_items
                    field_name: Line items
                    field_type: table
                    sub_fields:
                      - field_key: item_name
                        field_name: Item name
                        field_type: string
                      - field_key: item_amount
                        field_name: Amount
                        field_type: string
                enable_field_value_translation: false
    AppConfigQueryRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppConfigQueryRequest'
          examples:
            highSpeedConfig:
              summary: Get high-speed custom extraction application configuration
              value:
                app_id: app_1425
            highSpeedConfigVersion:
              summary: Get a specified high-speed configuration version
              value:
                app_id: app_1425
                config_version: v1
    AiRecommendRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AiRecommendRequest'
          examples:
            standardCustomExtractionApp:
              summary: Generate field prompts for a standard custom extraction application
              value:
                app_id: app_1406
                prompt: Extract the invoice number, invoice date, and total amount from the invoice.
            highSpeedCustomExtractionApp:
              summary: Generate a high-speed custom extraction configuration preview
              value:
                app_id: app_1425
                file_url: https://adp.laiye.com/web/agentic_doc_processor/laiye/file/2003c711818811f1a36200163e358400
                prompt: Generate field configuration based on the document layout. Use English snake_case field keys.
    DocumentConvertRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentConvertRequest'
          examples:
            fileUrl:
              value:
                file_url: https://example.com/invoice.pdf
                scale: 1
                first_convert_page: 1
                last_convert_page: 5
                result_mode: url
            fileBase64:
              value:
                file_base64: JVBERi0xLjQKJcfs...
                result_mode: base64
    DocumentConvertAsyncRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentConvertAsyncRequest'
          example:
            file_url: https://example.com/long-document.pdf
            first_convert_page: 1
            last_convert_page: 20
    WebhookCreateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookCreateRequest'
          example:
            webhook_url: https://hooks.example.com/adp
            event_types: [doc_extract_completed]
            app_id: [app_abc123]
    WebhookUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookUpdateRequest'
          example:
            webhook_id: webhook_abc123
            event_types: [doc_parse_completed, doc_extract_completed]
    WebhookDeleteRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookDeleteRequest'
          example:
            webhook_id: webhook_abc123
    WebhookLogQueryRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookLogQueryRequest'
          example:
            webhook_id: webhook_abc123
            start_time: '2026-08-01 00:00:00'
            end_time: '2026-08-02 00:00:00'
