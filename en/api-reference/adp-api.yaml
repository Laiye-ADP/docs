          type: string
          description: Template version used by the application. Reusing an application preserves its version.
        application_id:
          type: string
          description: Created or reused account application ID, usable for file uploads and workflow runs.
        application_name:
          type: string
          description: Application name.
        release_version_id:
          type: string
          description: Current published version ID.
        application_status:
          type: string
          description: Application status, always published on success.
          enum:
          - published
        can_run:
          type: boolean
          const: true
          description: Whether the application can run, always true on success.
      required:
      - template_key
      - template_version
      - application_id
      - application_name
      - release_version_id
      - application_status
      - can_run
    CreateWorkflowTemplateApplicationResponse:
      allOf:
      - $ref: '#/components/schemas/SimpleResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/CreatedWorkflowTemplateApplication'
        required:
        - data
    DocumentConvertRequest:
      type: object
      additionalProperties: false
      oneOf:
        - title: Use file URL
          required: [file_url]
        - title: Use Base64 file
          required: [file_base64]
      properties:
        file_url:
          type: string
          format: uri
          maxLength: 2048
          description: Public HTTPS URL of the file to convert. Do not pass an internal-network URL or a URL containing long-lived credentials.
        file_base64:
          type: string
          format: byte
          description: Base64 content of the file to convert. The decoded file can be at most 50 MiB.
        scale:
          type: number
          exclusiveMinimum: 0
          default: 1
          description: Page scale factor. The server currently exposes no stable upper bound; use the default value unless necessary.
        first_convert_page:
          type: integer
          minimum: 1
          description: First page to convert, starting at 1. Omit it to start from the first page.
        last_convert_page:
          type: integer
          minimum: 1
          description: Last page to convert, starting at 1 and not less than the first page. Omit it to continue through the last page.
        result_mode:
          type: string
          enum: [url, base64]
          default: url
          description: How page images are returned. URLs are temporary; Base64 significantly increases the response size.
    DocumentConvertAsyncRequest:
      type: object
      additionalProperties: false
      oneOf:
        - title: Use file URL
          required: [file_url]
        - title: Use Base64 file
          required: [file_base64]
      properties:
        file_url:
          type: string
          format: uri
          maxLength: 2048
          description: Public HTTPS URL of the file to convert.
        file_base64:
          type: string
          format: byte
          description: Base64 content of the file to convert. The decoded file can be at most 50 MiB.
        scale:
          type: number
          exclusiveMinimum: 0
          default: 1
        first_convert_page:
          type: integer
          minimum: 1
        last_convert_page:
          type: integer
          minimum: 1
      description: Asynchronous conversion currently always returns page results as URLs. The backend ignores `result_mode`, so the public contract does not expose that field.
    DocumentConvertTaskResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              oneOf:
                - type: object
                  properties:
                    task_id:
                      type: string
                  required: [task_id]
                - type: 'null'
    DocumentConvertResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              oneOf:
                - $ref: '#/components/schemas/DocumentConvertData'
                - type: 'null'
    DocumentConvertData:
      type: object
      properties:
        task_id:
          type: string
        img_detail_list:
          type: array
          items:
            $ref: '#/components/schemas/DocumentConvertImage'
        total_num:
          type: integer
          minimum: 0
        metadata:
          type: object
          additionalProperties: true
        file_type:
          type: string
          description: Conversion result type, such as `pdf`, `image`, or `spreadsheet`.
        source_file_type:
          type: string
          description: Detected source-file extension type.
        spreadsheet_manifest_file_id:
          type: string
        spreadsheet_manifest_url:
          type: string
          description: Temporary download URL for the native Excel preview manifest.
        view_type:
          type: string
          description: Set to `spreadsheet` for native Excel parsing.
        page_count:
          type: integer
          minimum: 0
        sheet_count:
          type: integer
          minimum: 0
        logical_unit_count:
          type: integer
          minimum: 0
        document_contents:
          type: array
          items:
            type: string
        document_details:
          type: array
          items: {}
        warnings:
          type: array
          items:
            type: object
            additionalProperties: true
        billing:
          type: object
          additionalProperties: true
      required: [task_id, img_detail_list, total_num, metadata, file_type, source_file_type, spreadsheet_manifest_file_id, spreadsheet_manifest_url, view_type, page_count, sheet_count, logical_unit_count, document_contents, document_details, warnings, billing]
    DocumentConvertImage:
      type: object
      properties:
        page_num: {type: integer, minimum: 0}
        img_base64:
          type: string
          description: Page-image content when `result_mode=base64`; otherwise it is generally an empty string.
        img_url:
          type: string
          description: Temporary page URL when `result_mode=url`; otherwise it is generally an empty string.
        width: {type: integer, minimum: 0}
        height: {type: integer, minimum: 0}
        preprocess:
          type: object
          additionalProperties: true
      required: [page_num, img_base64, img_url, width, height, preprocess]
    EmptyDataResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
          required: [data]
    WebhookEventType:
      type: string
      enum:
        - doc_parse_completed
        - doc_extract_completed
        - collaboration_start
        - collaboration_success
        - collaboration_failed
        - collaboration_completed
        - collaboration_timeout
    WebhookEventListResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/WebhookEvent'
              required: [events]
          required: [data]
    WebhookEvent:
      type: object
      properties:
        event_type:
          $ref: '#/components/schemas/WebhookEventType'
        name:
          type: string
        description:
          type: string
      required: [event_type, name, description]
    WebhookCreateRequest:
      type: object
      additionalProperties: false
      properties:
        webhook_url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 512
          description: Caller-controlled, public HTTPS callback URL. The public contract does not accept HTTP or internal-network URLs.
        event_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookEventType'
        app_id:
          type: [array, 'null']
          uniqueItems: true
          description: Application scope. Omit it, pass `null`, or pass an empty array to subscribe to all applications under the current account.
          items:
            type: string
            minLength: 1
      required: [webhook_url, event_types]
    WebhookUpdateRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required: [webhook_url]
        - required: [event_types]
        - required: [app_id]
      properties:
        webhook_id:
          type: string
          minLength: 1
        webhook_url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 512
          description: New public HTTPS callback URL.
        event_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WebhookEventType'
        app_id:
          type: [array, 'null']
          uniqueItems: true
          description: Passing `null` or an empty array explicitly clears the application scope; omitting it leaves the scope unchanged.
          items:
            type: string
            minLength: 1
      required: [webhook_id]
    WebhookDeleteRequest:
      type: object
      additionalProperties: false
      properties:
        webhook_id:
          type: string
          minLength: 1
      required: [webhook_id]
    WebhookMutationResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              oneOf:
                - type: object
                  properties:
                    webhook_id:
                      type: string
                  required: [webhook_id]
                - type: 'null'
    WebhookListResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                webhook_list:
                  type: array
                  items:
                    $ref: '#/components/schemas/WebhookConfig'
              required: [webhook_list]
          required: [data]
    WebhookConfig:
      type: object
      properties:
        webhook_id: {type: string}
        webhook_url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        app_id:
          type: [array, 'null']
          items:
            type: string
        is_active:
          type: integer
          enum: [0, 1]
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
      required: [webhook_id, webhook_url, event_types, is_active]
    WebhookLogQueryRequest:
      type: object
      additionalProperties: false
      properties:
        webhook_id:
          type: [string, 'null']
          description: Webhook configuration ID. Always provide it whenever possible to narrow the query scope.
        start_time:
          type: [string, 'null']
          pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
          description: Start time in `YYYY-MM-DD HH:mm:ss` format. If omitted, defaults to 72 hours before the end time.
        end_time:
          type: [string, 'null']
          pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
          description: End time in `YYYY-MM-DD HH:mm:ss` format. If omitted, defaults to the current time.
        page:
          type: integer
          default: 1
          minimum: 1
        page_size:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
    WebhookLogResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                logs:
                  type: array
                  items:
                    $ref: '#/components/schemas/WebhookLog'
                total: {type: integer, minimum: 0}
                page: {type: integer, minimum: 1}
                page_size: {type: integer, minimum: 1, maximum: 100}
              required: [logs, total, page, page_size]
          required: [data]
    WebhookLog:
      type: object
      properties:
        id: {type: string}
        webhook_id: {type: string}
        webhook_url:
          type: string
          format: uri
        event_type:
          $ref: '#/components/schemas/WebhookEventType'
        app_id: {type: [string, 'null']}
        app_name: {type: [string, 'null']}
        status:
          type: string
          enum: [pending, success, failed, final_failed]
        retry_count: {type: integer, minimum: 0}
        next_retry_at:
          type: [string, 'null']
          format: date-time
        response_code: {type: [integer, 'null']}
        response_body:
          type: [string, 'null']
          maxLength: 2000
          description: Last receiver response or error message. It may contain sensitive data.
        delivered_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
      required: [id, webhook_id, webhook_url, event_type, status, retry_count]
    BusinessWorkflowTemplate:
      type: object
      additionalProperties: false
      properties:
        template_key:
          type: string
          description: Business workflow template key.
        name:
          type: string
          description: Template name.
        description:
          type: [string, 'null']
          description: Template description.
        template_version:
          type: string
          description: Current template version. This value can change when the template is updated.
        application_id:
          type: string
          description: Fixed template ID accepted as application_id by the synchronous and asynchronous run endpoints. ADP reuses the corresponding runnable application, or creates and publishes one before running it. The recommended flow is to create an application first, then use the returned data.application_id for file uploads and runs.
        is_added:
          type: boolean
          description: Whether the account associated with the current API key has added this template.
        application_status:
          oneOf:
            - type: string
              enum: [draft, published]
            - type: 'null'
          description: Status of the corresponding application in the current account. It is null when the template has not been added.
        can_run:
          type: boolean
          description: Whether the current account already has a corresponding runnable application. A false value does not block creation or running with the fixed template ID; either flow can create and publish an application automatically.
      required: [template_key, name, template_version, application_id, is_added, can_run]
    BusinessWorkflowTemplateListResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                range:
                  type: object
                  properties:
                    offset: {type: integer, minimum: 0}
                    size: {type: integer, minimum: 1, maximum: 100}
                    total: {type: integer, minimum: 0}
                  required: [offset, size, total]
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/BusinessWorkflowTemplate'
              required: [range, list]
          required: [data]
    WorkflowApplication:
      type: object
      properties:
        id:
          type: string
          description: Workflow application ID.
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
        tags:
          type: [array, 'null']
          items:
            type: string
      required: [id, name, description, status, tags]
    WorkflowApplicationListResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                range:
                  type: object
                  properties:
                    offset: {type: integer, minimum: 0}
                    size: {type: integer, minimum: 1}
                    total: {type: [integer, 'null'], minimum: 0}
                  required: [offset, size, total]
                list:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkflowApplication'
              required: [range, list]
          required: [data]
    WorkflowApplicationResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              oneOf:
                - $ref: '#/components/schemas/WorkflowApplication'
                - type: 'null'
    WorkflowRunExportRequest:
      type: object
      additionalProperties: false
      properties:
        application_id:
          type: string
          minLength: 1
          description: Workflow application ID.
        run_ids:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Omitted/null/empty selects eligible current-user runs for merged/per_run; task_data/task_package requires
            one nonblank ID.
        node_ids:
          type:
          - array
          - 'null'
          description: Optional node IDs. If omitted, all exportable nodes in each run are included.
          items:
            type: string
            minLength: 1
        format:
          type: string
          enum:
          - excel
          - word
          - markdown
          - html
          - json
          default: excel
        report_mode:
          type: string
          enum:
          - merged
          - per_run
          - task_data
          - task_package
          default: merged
          description: merged combines; per_run creates per-run ZIP; task_data exports task data; task_package creates a report/attachment
            ZIP.
        include_failed_runs:
          type: boolean
          default: false
          description: Generic modes default to successful runs; enabling includes non-success runs, which may be skipped without
            exportable content. Task modes separately validate terminal state and saved results.
        primary_key_variable:
          type:
          - string
          - 'null'
          description: Optional workflow input-variable name to use as the export primary key.
        max_text_length:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 30000
          default: 10000
          description: Maximum exported characters for one text value. The route currently defaults to 10,000.
        locale:
          type:
          - string
          - 'null'
          enum:
          - zh-CN
          - en-US
          - null
          description: Used by task modes; defaults to the saved run display locale. Does not rerun the task or change extracted
            values.
        node_types:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Optional node-type filter for merged/per_run only.
        variable_filters:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: merged/per_run only; match input variable values, including dotted paths.
      required:
      - application_id
      allOf:
      - if:
          properties:
            report_mode:
              enum:
              - task_data
              - task_package
          required:
          - report_mode
        then:
          required:
          - run_ids
          properties:
            run_ids:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: string
                pattern: \S
            node_ids:
              type:
              - array
              - 'null'
              maxItems: 0
            node_types:
              type:
              - array
              - 'null'
              maxItems: 0
            variable_filters:
              type:
              - object
              - 'null'
              maxProperties: 0
      - if:
          properties:
            report_mode:
              const: task_data
          required:
          - report_mode
        then:
          properties:
            format:
              enum:
              - excel
              - json
      - if:
          properties:
            report_mode:
              const: task_package
          required:
          - report_mode
        then:
          required:
          - format
          properties:
            format:
              enum:
              - word
              - markdown
              - html
    WorkflowRunExportResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              oneOf:
                - $ref: '#/components/schemas/WorkflowRunExportData'
                - type: 'null'
    WorkflowRunExportData:
      type: object
      properties:
        file_id:
          type: string
        download_url:
          type: string
          format: uri
          description: Temporary download URL. It is currently generally valid for approximately one hour, but this is not a stable
            SLA.
        filename:
          type: string
        file_size:
          type: integer
          minimum: 0
        format:
          type: string
          enum:
          - excel
          - word
          - markdown
          - html
          - json
        report_mode:
          type: string
          enum:
          - merged
          - per_run
          - task_data
          - task_package
        total_runs:
          type: integer
          minimum: 0
          maximum: 200
        included_runs:
          type: integer
          minimum: 0
          maximum: 200
        skipped_runs:
          type: integer
          minimum: 0
          maximum: 200
        run_summaries:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRunExportSummary'
        export_time:
          type: string
          format: date-time
      required:
      - file_id
      - download_url
      - filename
      - file_size
      - format
      - report_mode
      - total_runs
      - included_runs
      - skipped_runs
      - run_summaries
      - export_time
    WorkflowRunExportSummary:
      type: object
      properties:
        run_id: {type: string}
        status: {type: string}
        started_at:
          type: [string, 'null']
          format: date-time
        ended_at:
          type: [string, 'null']
          format: date-time
        included_nodes: {type: integer, minimum: 0}
        skipped_nodes: {type: integer, minimum: 0}
      required: [run_id, status, started_at, ended_at, included_nodes, skipped_nodes]
    SimpleResponse:
      type: object
      properties:
        code:
          oneOf:
            - type: string
            - type: integer
          description: Business code. A successful response is usually success or 200.
        message:
          type: string
          description: Response message.
        tips:
          type:
            - string
            - 'null'
          description: Details. Defaults to null.
    HTTPValidationError:
      type: object
      description: FastAPI/Pydantic request validation error.
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
      required: [detail]
    ValidationErrorItem:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
          description: Validation error type.
        loc:
          type: array
          description: Location of the invalid field in the request.
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
          description: Human-readable validation error message.
        input:
          description: Input value that failed validation.
        ctx:
          type: object
          additionalProperties: true
          description: Additional context supplied by the validator.
        url:
          type: string
          format: uri
          description: Link to the Pydantic error documentation.
      required: [type, loc, msg]
    DocumentFileRequest:
      oneOf:
        - title: Use file URL
          type: object
          additionalProperties: false
          properties:
            app_id:
              default: *documentRecognitionAppId
              type: string
              description: Unique application ID.
            file_url:
              default: *documentRecognitionFileUrl
              type: string
              format: uri
              description: File URL. Use either file_url or file_base64.
            file_name:
              type: string
              description: File name. Provide it when using Base64 or when the file name cannot be inferred from the URL.
            model_params:
              $ref: '#/components/schemas/DocumentRecognizeModelParams'
          required: [app_id, file_url]
        - title: Use file Base64
          type: object
          additionalProperties: false
          properties:
            app_id:
              default: *documentRecognitionAppId
              type: string
              description: Unique application ID.
            file_base64:
              default: *documentRecognitionFileBase64
              type: string
              description: Base64-encoded file. Use either file_base64 or file_url.
            file_name:
              type: string
              description: File name. Provide it when using Base64 or when the file name cannot be inferred from the URL.
            model_params:
              $ref: '#/components/schemas/DocumentRecognizeModelParams'
          required: [app_id, file_base64]
    DocumentRecognizeModelParams:
      type: object
      additionalProperties: true
      description: |
        Model parameters for this document recognition call. If omitted, the saved application parsing configuration is used. To temporarily override parsing options for this call, pass them in recognize_config.
      properties:
        recognize_config:
          $ref: '#/components/schemas/DocumentRecognizeConfig'
    DocumentRecognizeConfig:
      type: object
      additionalProperties: false
      description: Parsing configuration for this call.
      properties:
        recognize_mode:
          type: string
          enum: [standard, advance, agentic, fast_vlm, agentic_v2]
          default: standard
          description: |
            Parsing mode. Available values are:

            - standard: Standard parsing for clear digital documents, balancing speed and accuracy.
            - advance: Enhanced parsing 1.0 for documents with stamps, signatures, multiple tables, or moderately complex layouts.
            - agentic: Smart parsing that combines standard and enhanced parsing and performs secondary parsing when conditions are met.
            - fast_vlm: Enhanced parsing 2.0 for complex layouts, scanned documents, and documents with multiple tables, improving parsing stability.
            - agentic_v2: Smart parsing 2.0 with two-stage layout analysis and content recognition for documents with complex layouts, tables, and formulas.
        enable_highlight:
          type: integer
          enum: [0, 1]
          default: 1
          description: Whether to show source locations. 1 keeps source positions for text blocks and tables; 0 omits positions. Supported in standard, agentic, fast_vlm, and agentic_v2 modes. Not supported in advance mode.
        enable_pdf_parse:
          type: boolean
          default: false
          description: Whether to use PDF text first. Effective only for digital PDFs with selectable text. Improves speed and text stability.
        pdf_pic_second_parsing:
          type: boolean
          default: false
          description: When PDF text first is enabled, whether to use VLM to parse image regions in the PDF again.
        enable_stamp_recognition:
          type: boolean
          default: false
          description: Whether to enable stamp recognition. When enabled, the service detects stamps in the document and attempts to extract stamp text.
    DocumentExtractRequest:
      type: object
      additionalProperties: true
      properties:
        app_id:
          type:
          - string
          - 'null'
          description: Recommended application ID; legacy callers may use app_key and app_secret instead.
          examples:
          - 8f4b2c506df811f1a3d90242ac120002
        file_url:
          type:
          - string
          - 'null'
          format: uri
          description: Send one file source. For legacy single-app requests with both valid sources, Base64 takes precedence.
          examples:
          - https://files.example.com/materials.pdf
        file_name:
          type: string
          description: File name. Provide it when using Base64 or when the file name cannot be inferred from the URL.
        with_rec_result:
          type: boolean
          description: Whether to return document recognition results. High-speed extraction does not return recognition results.
          default: false
        model_params:
          type:
          - object
          - 'null'
          additionalProperties: true
          properties:
            pages:
              type: array
              uniqueItems: true
              items:
                type: integer
                minimum: 1
              description: Original 1-based pages; native Markdown has logical page 1 only.
            scale:
              type: number
              exclusiveMinimum: 0
              default: 1.0
              description: Image-page conversion scale; does not promise to affect native XLSX/Markdown.
            disable_collaboration:
              anyOf:
              - type: boolean
              - type: integer
                enum:
                - 0
                - 1
              description: Sync defaults to 1; 1425 forces 1 for sync/async and cannot enable human collaboration.
            keep_content:
              type: boolean
              default: false
              description: Retain inline content when large recognition results are returned by URL on classic extraction; does
                not make 1425 return recognition output.
            page_task_timeout_seconds:
              type: number
              exclusiveMinimum: 0
              description: Per-page large recognition result preparation/upload timeout, not an end-to-end or per-page inference
                timeout.
            card_type:
              type: string
              description: For card-capable apps only; an explicit top-level card_type wins.
            enable_multi_ticket:
              type: boolean
              default: true
              description: Only for multi-ticket-capable apps; an explicit top-level value wins.
          description: Known options apply by capability. Acceptance of extra keys does not guarantee effect; current 1425/1423/1424
            do not use temperature/top_p/max_tokens to override their saved call configuration. The three result switches must
            remain top-level.
        enable_highlight:
          type:
          - boolean
          - 'null'
          description: Source locations; high-speed override for this request only. Omitted/null inherits the app; config is not
            saved.
        enable_field_value_translation:
          type:
          - boolean
          - 'null'
          description: Field-value translation; high-speed override for this request only. Omitted/null inherits the app; config
            is not saved.
        enable_confidence:
          type:
          - boolean
          - 'null'
          description: Field confidence evaluation; high-speed override for this request only. Omitted/null inherits the app;
            config is not saved.
        file_base64:
          type:
          - string
          - 'null'
          description: Send one file source. For legacy single-app requests with both valid sources, Base64 takes precedence.
          examples:
          - JVBERi0xLjQK...
        app_key:
          type:
          - string
          - 'null'
          description: Legacy app credential; requires app_secret and still requires X-API-Key.
        app_secret:
          type:
          - string
          - 'null'
          writeOnly: true
          description: Legacy application secret. Avoid mixing with app_id; a complete key/secret pair takes precedence.
        enable_multi_ticket:
          type:
          - boolean
          - 'null'
          default: true
          description: Per-call multi-ticket option; explicit top-level input wins over the nested value. Unsupported apps do
            not gain multi-ticket capability.
        card_type:
          type:
          - string
          - 'null'
          description: Card-app type hint; explicit top-level input takes precedence.
      allOf:
      - anyOf:
        - required:
          - app_id
          properties:
            app_id:
              type: string
              minLength: 1
              pattern: \S
        - required:
          - app_key
          - app_secret
          properties:
            app_key:
              type: string
              minLength: 1
              pattern: \S
            app_secret:
              type: string
              minLength: 1
              pattern: \S
      - anyOf:
        - required:
          - file_url
          properties:
            file_url:
              type: string
              minLength: 1
              pattern: \S
        - required:
          - file_base64
          properties:
            file_base64:
              type: string
              minLength: 1
              pattern: \S
      description: 'Single-app compatibility: at least one app identity and file source. Unknown top-level fields may be ignored,
        not interpreted as new options. Classification/routing still enforce exactly one file source.'
    TaskCreateResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                task_id:
                  type: string
                metadata:
                  type: object
                  additionalProperties: true
                  description: Document processing task metadata.
    DocumentExtractResponse:
