openapi: 3.1.0
info:
  title: Domestic general bills
  version: 1.0.0
  description: ADP preset application API for extracting domestic general bills.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://adp-global.laiye.com
    description: ADP global production endpoint
tags:
  - name: Domestic bill extraction
    description: Extract fields from domestic general bills.
  - name: Domestic invoice verification
    description: Verify domestic invoices from invoice details.
paths:
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract:
    post:
      tags: [Domestic bill extraction]
      summary: Extract domestic general bill (sync)
      description: Extract fields from domestic general bills. Pass enable_invoice_verify=true to enable invoice verification for this extraction; omit it to use the saved application setting. Verifiable invoices can include the verification result, verification error message, and voided flag in their extracted fields.
      operationId: extractDomesticBill
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/DocumentExtractRequest'
      responses:
        '200':
          $ref: '#/components/responses/DocumentExtractResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract/create/task:
    post:
      tags: [Domestic bill extraction]
      summary: Create domestic bill extraction task
      description: Create an asynchronous domestic bill extraction task and immediately receive its task_id. Use this endpoint for large files or longer-running tasks.
      operationId: createDomesticBillExtractTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/DocumentExtractRequest'
      responses:
        '200':
          $ref: '#/components/responses/TaskCreateResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract/query/task/{task_id}:
    get:
      tags: [Domestic bill extraction]
      summary: Query domestic bill extraction task
      description: Query the status and result of a domestic bill extraction task by task_id.
      operationId: queryDomesticBillExtractTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          $ref: '#/components/responses/DocumentExtractResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/invoice/verify:
    post:
      tags: [Domestic invoice verification]
      summary: Verify domestic invoice
      description: Verify an invoice from its invoice number, issue date, and tax-inclusive total.
      operationId: verifyDomesticInvoice
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/InvoiceVerifyRequest'
      responses:
        '200':
          $ref: '#/components/responses/InvoiceVerifyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
  parameters:
    TenantName:
      name: tenant_name
      in: path
      required: true
      description: "Tenant name. Default: laiye."
      schema:
        type: string
        default: laiye
    TaskId:
      name: task_id
      in: path
      required: true
      description: Task ID.
      schema:
        type: string
  examples:
    DomesticBillsFileBase64:
      summary: Use file Base64
      value:
        file_base64: &domesticBillsFileBase64 data:image/jpeg;base64,
        app_id: &domesticBillsAppId ootb_v9x2y5z8a1b4c7d0e3f6h9j1k4m7
        enable_invoice_verify: true
    DomesticBillsFileUrl:
      summary: Use file URL
      value:
        file_url: &domesticBillsFileUrl https://adp.laiye.com/web/agentic_doc_processor/laiye/file/2003c711818811f1a36200163e358400
        app_id: *domesticBillsAppId
        enable_invoice_verify: true
  requestBodies:
    DocumentExtractRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentExtractRequest'
          examples:
            fileUrl:
              $ref: '#/components/examples/DomesticBillsFileUrl'
            fileBase64:
              $ref: '#/components/examples/DomesticBillsFileBase64'
    InvoiceVerifyRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvoiceVerifyRequest'
          examples:
            electronicInvoice:
              summary: Verify a VAT electronic invoice
              value:
                fpNumber: '0123456789'
                fpDate: '2026-06-01'
                fpAmount: '100.00'
  responses:
    DocumentExtractResponse:
      description: Extraction result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentExtractResponse'
          examples:
            invoiceVerification:
              summary: Extraction result containing invoice verification fields
              value:
                code: success
                message: ''
                tips: null
                data:
                  task_id: ''
                  file_url: ''
                  status: 4
                  extraction_result:
                    - field_key: vat_electronic_special_invoice_new
                      field_name: Electronic VAT Special Invoice
                      object_values:
                        - document_type: vat_electronic_special_invoice_new
                          pages: [0]
                          extraction_result:
                            - field_key: fpVerification
                              field_name: Verification result
                              field_values:
                                - field_value: ''
                                  confidence: 0.0
                            - field_key: fpVerificationMsg
                              field_name: Verification error message
                              field_values:
                                - field_value: ''
                                  confidence: 0.0
                            - field_key: fpIsVoided
                              field_name: Voided flag
                              field_values:
                                - field_value: ''
                                  confidence: 0.0
    InvoiceVerifyResponse:
      description: Invoice verification result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvoiceVerifyResponse'
          examples:
            verifiedInvoice:
              summary: Successfully verified invoice
              value:
                code: success
                message: ''
                data:
                  result:
                    type_key: vat_electronic_invoice_new
                    fpVerification: Invoice verified and matched
                    fpVerificationMsg: ''
                    fpIsVoided: Not voided
                    fpNumber: '0123456789'
                    fpDate: '2026-06-01'
                    fpAmount: '100.00'
                  metadata:
                    trace_id: 94fe9b74e0e311f091505e345594c618
                    attempt_verify_page_count: 1
                    actual_consume_page_count: 1
                    billable_pages: [1]
    TaskCreateResponse:
      description: Task creation result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskCreateResponse'
    ValidationError:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleResponse'
  schemas:
    DocumentExtractRequest:
      oneOf:
        - title: Use file URL
          type: object
          additionalProperties: false
          properties:
            file_url:
              default: *domesticBillsFileUrl
              type: string
              format: uri
              description: File URL. Use either file_url or file_base64.
            app_id:
              default: *domesticBillsAppId
              type: string
              description: Unique identifier of the domestic general bills preset application.
            enable_invoice_verify:
              type: boolean
              description: Whether to enable invoice verification for this extraction. true enables it and false disables it; omit the field to use the saved application setting.
          required: [app_id, file_url]
        - title: Use file Base64
          type: object
          additionalProperties: false
          properties:
            file_base64:
              default: *domesticBillsFileBase64
              type: string
              description: Base64-encoded file. Use either file_base64 or file_url.
            app_id:
              default: *domesticBillsAppId
              type: string
              description: Unique identifier of the domestic general bills preset application.
            enable_invoice_verify:
              type: boolean
              description: Whether to enable invoice verification for this extraction. true enables it and false disables it; omit the field to use the saved application setting.
          required: [app_id, file_base64]
    SimpleResponse:
      type: object
      properties:
        code:
          oneOf:
            - type: string
            - type: integer
        message:
          type: string
        tips:
          type:
            - string
            - 'null'
    TaskCreateResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                task_id:
                  type: string
    InvoiceVerifyRequest:
      type: object
      additionalProperties: false
      required: [fpNumber, fpDate, fpAmount]
      properties:
        fpNumber:
          type: string
          description: Invoice number.
        fpDate:
          type: string
          format: date
          description: Invoice issue date in YYYY-MM-DD format.
        fpAmount:
          type: string
          description: Tax-inclusive total.
    InvoiceVerifyResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                result:
                  $ref: '#/components/schemas/InvoiceVerifyResult'
                metadata:
                  $ref: '#/components/schemas/InvoiceVerifyMetadata'
    InvoiceVerifyResult:
      type: object
      properties:
        type_key:
          type: string
          description: Invoice type.
        instance_id:
          type: string
          description: Your business instance ID.
        fpVerification:
          type: string
          description: Verification status.
        fpVerificationMsg:
          type: string
          description: Verification message or error details.
        fpIsVoided:
          type: string
          description: Void status.
        fpType:
          type: string
          description: Invoice type name.
        fpCode:
          type: string
          description: Invoice code.
        fpNumber:
          type: string
          description: Invoice number.
        fpDate:
          type: string
          description: Invoice issue date, creation date, or travel date.
        fpAmount:
          type: string
          description: Tax-inclusive total, fare, or total amount.
        fpNoTaxAmount:
          type: string
          description: Tax-exclusive amount.
        fpTotalTaxAmount:
          type: string
          description: Total tax amount.
        fpSellerName:
          type: string
          description: Seller name.
        fpSellerID:
          type: string
          description: Seller taxpayer ID.
        fpPayerName:
          type: string
          description: Buyer name.
        fpPayerID:
          type: string
          description: Buyer taxpayer ID.
        fpRemarks:
          type: string
          description: Remarks.
        fpItems:
          type: array
          description: Invoice line items.
          items:
            type: object
            additionalProperties: true
    InvoiceVerifyMetadata:
      type: object
      properties:
        trace_id:
          type: string
          description: Trace ID.
        attempt_verify_page_count:
          type: integer
          description: Number of pages submitted for verification.
        actual_consume_page_count:
          type: integer
          description: Number of pages charged.
        billable_pages:
          type: array
          description: Charged page numbers.
          items:
            type: integer
    DocumentExtractResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true
              properties:
                task_id:
                  type: string
                file_url:
                  type: string
                status:
                  type: integer
                doc_recognize_result:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                extraction_result:
                  type: array
                  items:
                    $ref: '#/components/schemas/ExtractionResult'
                classify_result:
                  type: object
                  additionalProperties: true
    ExtractionResult:
      type: object
      additionalProperties: true
      properties:
        field_key:
          type: string
          description: Unique identifier of the document type.
        field_name:
          type: string
          description: Name of the document type.
        object_values:
          type: array
          description: Extraction results for each recognized document.
          items:
            $ref: '#/components/schemas/DocumentObjectValue'
    DocumentObjectValue:
      type: object
      additionalProperties: true
      properties:
        document_type:
          type: string
          description: Identifier of the recognized document type.
        pages:
          type: array
          items:
            type: integer
          description: Zero-based page indexes containing the document.
        extraction_result:
          type: array
          description: Extracted fields. Verifiable invoices can also include fpVerification (verification result), fpVerificationMsg (verification error message), and fpIsVoided (voided flag).
          items:
            $ref: '#/components/schemas/ExtractedField'
    ExtractedField:
      type: object
      additionalProperties: true
      properties:
        field_key:
          type: string
          description: Unique field identifier. Invoice verification uses fpVerification, fpVerificationMsg, and fpIsVoided.
        field_name:
          type: string
          description: Display name of the field.
        field_values:
          type: array
          description: List of values for the field.
          items:
            $ref: '#/components/schemas/ExtractedFieldValue'
    ExtractedFieldValue:
      type: object
      additionalProperties: true
      properties:
        field_value:
          type: string
          description: Field value.
        field_confidence:
          type: number
          format: float
          description: Confidence score of the extracted field.
        confidence:
          type: number
          format: float
          description: Confidence score of an invoice verification field.
