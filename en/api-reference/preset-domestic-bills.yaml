    InvoiceVerifyMetadata:
      type: object
      additionalProperties: true
      required:
        - trace_id
        - attempt_verify_page_count
        - actual_consume_page_count
        - billable_pages
      properties:
        trace_id:
          type: string
          description: Trace ID. Include it in support requests when troubleshooting.
        attempt_verify_page_count:
          type: integer
          enum: [0, 1]
          description: Number of invoices with complete fields submitted to the verification service.
        actual_consume_page_count:
          type: integer
          enum: [0, 1]
          description: |-
            Number of invoices that reached a billable state. This is not necessarily the final credit deduction because a feature package can cover consumption.
        billable_pages:
          type: array
          maxItems: 1
          uniqueItems: true
          description: Billable page numbers. For standalone single-invoice verification, this is `[1]` when billable and an empty array otherwise.
          items:
            type: integer
            const: 1
    DocumentExtractResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true
              properties:
                task_id:
                  type: string
                file_url:
                  type: string
                message:
                  type: string
                  description: Task status or processing result message.
                status:
                  type: integer
                  enum: [0, 1, 2, 4, 5, 6]
                  description: 0=unknown, 1=ready, 2=running, 4=succeeded, 5=failed, 6=cancelled or rejected.
                doc_recognize_result:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                extraction_result:
                  type: array
                  items:
                    $ref: '#/components/schemas/ExtractionResult'
                extract_config_version:
                  type: string
                  description: Extraction configuration version used for this request.
                metadata:
                  type: [object, 'null']
                  additionalProperties: true
                  description: Document processing task metadata.
