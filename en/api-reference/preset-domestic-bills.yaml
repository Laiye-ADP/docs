openapi: 3.1.0
info:
  title: Domestic general bills
  version: 1.1.0
  description: ADP preset application API for extracting domestic general bills.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://adp-global.laiye.com
    description: ADP global production endpoint
tags:
  - name: Domestic bill extraction
    description: Extract fields from domestic general bills.
  - name: Domestic invoice verification
    description: Verify domestic invoices from invoice details.
paths:
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract:
    post:
      tags: [Domestic bill extraction]
      summary: Extract domestic general bill (sync)
      description: Extract fields from domestic general bills. Pass enable_invoice_verify=true to enable invoice verification for this extraction; omit it to use the saved application setting. Verifiable invoices can include the verification result, verification error message, and voided flag in their extracted fields.
      operationId: extractDomesticBill
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/DocumentExtractRequest'
      responses:
        '200':
          $ref: '#/components/responses/DocumentExtractResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract/create/task:
    post:
      tags: [Domestic bill extraction]
      summary: Create domestic bill extraction task
      description: Create an asynchronous domestic bill extraction task and immediately receive its task_id. Use this endpoint for large files or longer-running tasks.
      operationId: createDomesticBillExtractTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/DocumentExtractRequest'
      responses:
        '200':
          $ref: '#/components/responses/TaskCreateResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract/query/task/{task_id}:
    get:
      tags: [Domestic bill extraction]
      summary: Query domestic bill extraction task
      description: Query the status and result of a domestic bill extraction task by task_id.
      operationId: queryDomesticBillExtractTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          $ref: '#/components/responses/DocumentExtractResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/invoice/verify:
    post:
      tags:
        - Domestic invoice verification
      summary: Verify a domestic invoice
      description: |-
        Verify one domestic invoice from its invoice type and the required verification fields.

        **Compatibility rules**

        - The request body remains flat; do not use a batch array or a nested `verify_params` object.
        - `type_key` is optional. If omitted, the request is handled as `vat_electronic_invoice_new`.
        - `fpNumber` and `fpDate` are common to every invoice type. Other fields are conditionally required by `type_key`.
        - Send codes, numbers, dates, amounts, and check codes as JSON strings to preserve leading zeros and numeric precision.
        - Do not infer an invoice type from its field combination. Pass `type_key` for every non-default invoice type.

        **Required fields by invoice type**

        | type_key | Invoice type | Required fields |
        | --- | --- | --- |
        | `vat_special_invoice` | VAT special invoice | `fpCode`, `fpNumber`, `fpDate`, `fpNoTaxAmount` |
        | `vat_electronic_special_invoice` | VAT electronic special invoice | `fpCode`, `fpNumber`, `fpDate`, `fpNoTaxAmount` |
        | `vat_common_invoice` | VAT common invoice | `fpCode`, `fpNumber`, `fpDate`, `fpCRC` |
        | `vat_electronic_invoice` | VAT electronic common invoice | `fpCode`, `fpNumber`, `fpDate`, `fpCRC` |
        | `vat_roll_invoice` | VAT roll invoice | `fpCode`, `fpNumber`, `fpDate`, `fpCRC` |
        | `vat_electronic_special_invoice_new` | Fully digitalized electronic special invoice | `fpNumber`, `fpDate`, `fpAmount` |
        | `vat_electronic_invoice_new` | Fully digitalized electronic common invoice | `fpNumber`, `fpDate`, `fpAmount` |
        | `motor_vehicle_sale_invoice` | Motor vehicle sales invoice | `fpCode`, `fpNumber`, `fpDate`, `fpNoTaxAmount` |
        | `used_car_purchase_invoice` | Used-car sales invoice | `fpCode`, `fpNumber`, `fpDate`, `fpAmount` |
        | `electronic_air_transport` | Electronic air transport itinerary invoice | `fpNumber`, `fpDate`, `fpAmount` |
        | `electronic_train_ticket` | Electronic railway ticket invoice | `fpNumber`, `fpDate`, `fpAmount` |

        **Interpreting the result**

        HTTP 200 with `code=success` means that the API processed the request. It does not mean that the invoice passed verification. Read `data.result.fpVerification` for the verification conclusion. Missing conditional fields and downstream verification failures can still return HTTP 200, with details in `fpVerification` and `fpVerificationMsg`.

        **Billing metadata**

        `attempt_verify_page_count` is the number of invoices with complete fields submitted to the verification service. For this single-invoice API, it is 0 or 1. `actual_consume_page_count` is the number of invoices that reached a billable state and is also 0 or 1. A feature package can still cover the actual credit consumption.
      operationId: verifyDomesticInvoice
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/InvoiceVerifyRequest'
      responses:
        '200':
          $ref: '#/components/responses/InvoiceVerifyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/TenantNotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: ADP API Key.
  parameters:
    TenantName:
      name: tenant_name
      in: path
      required: true
      description: Tenant name. This path parameter must be provided explicitly.
      schema:
        type: string
      example: laiye
    TaskId:
      name: task_id
      in: path
      required: true
      description: Task ID.
      schema:
        type: string
  examples:
    DomesticBillsFileBase64:
      summary: Use file Base64
      value:
        file_base64: &domesticBillsFileBase64 data:image/jpeg;base64,
        app_id: &domesticBillsAppId ootb_v9x2y5z8a1b4c7d0e3f6h9j1k4m7
        enable_invoice_verify: true
    DomesticBillsFileUrl:
      summary: Use file URL
      value:
        file_url: &domesticBillsFileUrl https://adp.laiye.com/web/agentic_doc_processor/laiye/file/2003c711818811f1a36200163e358400
        app_id: *domesticBillsAppId
        enable_invoice_verify: true
    LegacyElectronicInvoiceRequest:
      summary: Legacy three-field request
      description: Request structure example. Omitting `type_key` uses the fully digitalized electronic common invoice type. Replace all values with values from the invoice.
      value:
        fpNumber: '23322000000000000000'
        fpDate: '2026-08-25'
        fpAmount: '106.00'
    VatSpecialInvoiceRequest:
      summary: VAT special invoice
      value:
        type_key: vat_special_invoice
        fpCode: '044001900111'
        fpNumber: '12345678'
        fpDate: '2026-08-25'
        fpNoTaxAmount: '100.00'
    VatElectronicSpecialInvoiceRequest:
      summary: VAT electronic special invoice
      value:
        type_key: vat_electronic_special_invoice
        fpCode: '044001900111'
        fpNumber: '12345678'
        fpDate: '2026-08-25'
        fpNoTaxAmount: '100.00'
    VatCommonInvoiceRequest:
      summary: VAT common invoice
      value:
        type_key: vat_common_invoice
        fpCode: '044001900111'
        fpNumber: '12345678'
        fpDate: '2026-08-25'
        fpCRC: '123456'
    VatElectronicInvoiceRequest:
      summary: VAT electronic common invoice
      value:
        type_key: vat_electronic_invoice
        fpCode: '044001900111'
        fpNumber: '12345678'
        fpDate: '2026-08-25'
        fpCRC: '123456'
    VatRollInvoiceRequest:
      summary: VAT roll invoice
      value:
        type_key: vat_roll_invoice
        fpCode: '044001900111'
        fpNumber: '12345678'
        fpDate: '2026-08-25'
        fpCRC: '123456'
    VatElectronicSpecialInvoiceNewRequest:
      summary: Fully digitalized electronic special invoice
      value:
        type_key: vat_electronic_special_invoice_new
        fpNumber: '23322000000000000001'
        fpDate: '2026-08-25'
        fpAmount: '106.00'
    VatElectronicInvoiceNewRequest:
      summary: Fully digitalized electronic common invoice
      value:
        type_key: vat_electronic_invoice_new
        fpNumber: '23322000000000000000'
        fpDate: '2026-08-25'
        fpAmount: '106.00'
    MotorVehicleSaleInvoiceRequest:
      summary: Motor vehicle sales invoice
      value:
        type_key: motor_vehicle_sale_invoice
        fpCode: '044001900111'
        fpNumber: '12345678'
        fpDate: '2026-08-25'
        fpNoTaxAmount: '100000.00'
    UsedCarPurchaseInvoiceRequest:
      summary: Used-car sales invoice
      value:
        type_key: used_car_purchase_invoice
        fpCode: '044001900111'
        fpNumber: '12345678'
        fpDate: '2026-08-25'
        fpAmount: '80000.00'
    ElectronicAirTransportRequest:
      summary: Electronic air transport itinerary invoice
      value:
        type_key: electronic_air_transport
        fpNumber: '23322000000000000002'
        fpDate: '2026-08-25'
        fpAmount: '1280.00'
    ElectronicTrainTicketRequest:
      summary: Electronic railway ticket invoice
      value:
        type_key: electronic_train_ticket
        fpNumber: '23322000000000000003'
        fpDate: '2026-08-25'
        fpAmount: '553.00'
    VerifiedInvoiceResponse:
      summary: Verified and consistent invoice
      value:
        code: success
        message: ''
        tips: null
        data:
          result:
            type_key: vat_electronic_invoice_new
            instance_id: customer-order-001
            invoice_pdf_page_number: 1
            fpVerification: 查验成功发票一致
            fpVerificationMsg: ''
            fpIsVoided: 未作废
            fpType: 电子发票普通发票
            fpCode: null
            fpNumber: '23322000000000000000'
            fpDate: '2026-08-25'
            fpAmount: '106.00'
            fpNoTaxAmount: '100.00'
            fpTotalTaxAmount: '6.00'
            fpSellerName: 示例销售方有限公司
            fpSellerID: '91310000XXXXXXXXXX'
            fpPayerName: 示例购买方有限公司
            fpPayerID: '91320000XXXXXXXXXX'
            fpRemarks: ''
            fpItems:
              - itemName: 技术服务
                itemModel: null
                itemUnit: 次
                itemQuantity: '1'
                itemUnitPrice: '100.00'
                itemAmount: '100.00'
                itemTaxRate: '6%'
                itemTaxAmount: '6.00'
          metadata:
            trace_id: 94fe9b74e0e311f091505e345594c618
            attempt_verify_page_count: 1
            actual_consume_page_count: 1
            billable_pages: [1]
    MissingRequiredElementResponse:
      summary: Missing conditionally required field
      description: Verification did not complete, but v1 compatibility behavior still returns HTTP 200 and `code=success`.
      value:
        code: success
        message: ''
        tips: null
        data:
          result:
            type_key: vat_special_invoice
            instance_id: vat_special_invoice_0
            invoice_pdf_page_number: 1
            fpVerification: 未能查验
            fpVerificationMsg: 增值税专用发票 识别结果缺少查验必须字段 不含税金额
            fpIsVoided: ''
          metadata:
            trace_id: 94fe9b74e0e311f091505e345594c619
            attempt_verify_page_count: 0
            actual_consume_page_count: 0
            billable_pages: []
    FrameworkBusinessErrorResponse:
      summary: Framework-level business error
      description: The current v1 compatibility framework can return a non-`success` API error with HTTP 200.
      value:
        code: http_server_error
        message: 业务处理失败
        tips: null
  requestBodies:
    DocumentExtractRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentExtractRequest'
          examples:
            fileUrl:
              $ref: '#/components/examples/DomesticBillsFileUrl'
            fileBase64:
              $ref: '#/components/examples/DomesticBillsFileBase64'
    InvoiceVerifyRequest:
      required: true
      description: Fields for verifying one invoice. Examples show request structure only; replace them with values from the invoice.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvoiceVerifyRequest'
          examples:
            legacyElectronicInvoice:
              $ref: '#/components/examples/LegacyElectronicInvoiceRequest'
            vatSpecialInvoice:
              $ref: '#/components/examples/VatSpecialInvoiceRequest'
            vatElectronicSpecialInvoice:
              $ref: '#/components/examples/VatElectronicSpecialInvoiceRequest'
            vatCommonInvoice:
              $ref: '#/components/examples/VatCommonInvoiceRequest'
            vatElectronicInvoice:
              $ref: '#/components/examples/VatElectronicInvoiceRequest'
            vatRollInvoice:
              $ref: '#/components/examples/VatRollInvoiceRequest'
            vatElectronicSpecialInvoiceNew:
              $ref: '#/components/examples/VatElectronicSpecialInvoiceNewRequest'
            vatElectronicInvoiceNew:
              $ref: '#/components/examples/VatElectronicInvoiceNewRequest'
            motorVehicleSaleInvoice:
              $ref: '#/components/examples/MotorVehicleSaleInvoiceRequest'
            usedCarPurchaseInvoice:
              $ref: '#/components/examples/UsedCarPurchaseInvoiceRequest'
            electronicAirTransport:
              $ref: '#/components/examples/ElectronicAirTransportRequest'
            electronicTrainTicket:
              $ref: '#/components/examples/ElectronicTrainTicketRequest'
  responses:
    DocumentExtractResponse:
      description: Extraction result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentExtractResponse'
          examples:
            invoiceVerification:
              summary: Extraction result containing invoice verification fields
              value:
                code: success
                message: ''
                tips: null
                data:
                  task_id: ''
                  file_url: ''
                  status: 4
                  extraction_result:
                    - field_key: vat_electronic_special_invoice_new
                      field_name: Electronic VAT Special Invoice
                      object_values:
                        - document_type: vat_electronic_special_invoice_new
                          pages: [0]
                          extraction_result:
                            - field_key: fpVerification
                              field_name: Verification result
                              field_values:
                                - field_value: ''
                                  confidence: 0.0
                            - field_key: fpVerificationMsg
                              field_name: Verification error message
                              field_values:
                                - field_value: ''
                                  confidence: 0.0
                            - field_key: fpIsVoided
                              field_name: Voided flag
                              field_values:
                                - field_value: ''
                                  confidence: 0.0
    InvoiceVerifyResponse:
      description: |-
        The request result. `code=success` means processing completed; use `data.result.fpVerification` for the invoice verification conclusion.
      headers:
        X-Process-Time:
          $ref: '#/components/headers/ProcessTime'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvoiceVerifyResponse'
          examples:
            verifiedInvoice:
              $ref: '#/components/examples/VerifiedInvoiceResponse'
            missingRequiredElement:
              $ref: '#/components/examples/MissingRequiredElementResponse'
            frameworkBusinessError:
              $ref: '#/components/examples/FrameworkBusinessErrorResponse'
    TaskCreateResponse:
      description: Task creation result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskCreateResponse'
    BusinessError:
      description: Business parameter error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleResponse'
    ValidationError:
      description: The request body, path parameter, or field type failed validation.
      headers:
        X-Process-Time:
          $ref: '#/components/headers/ProcessTime'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPValidationError'
          example:
            detail:
              - type: missing
                loc: [body, fpNumber]
                msg: Field required
                input:
                  fpDate: '2026-08-25'
                  fpAmount: '100.00'
    UnauthorizedError:
      description: A valid API Key was not provided.
      headers:
        X-Process-Time:
          $ref: '#/components/headers/ProcessTime'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
          example:
            detail: Invalid API Key
    TenantNotFoundError:
      description: The tenant in the request path does not exist.
      headers:
        X-Process-Time:
          $ref: '#/components/headers/ProcessTime'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
          example:
            detail: Tenant invalid-tenant not found
    InternalServerError:
      description: An unhandled server error occurred.
      headers:
        X-Process-Time:
          $ref: '#/components/headers/ProcessTime'
      content:
        text/plain:
          schema:
            type: string
          example: Internal server error
  schemas:
    DocumentExtractRequest:
      oneOf:
        - title: Use file URL
          type: object
          additionalProperties: false
          properties:
            file_url:
              default: *domesticBillsFileUrl
              type: string
              format: uri
              description: File URL. Use either file_url or file_base64.
            file_name:
              type: string
              description: File name. Provide it for Base64 input or when the name cannot be determined from the URL.
            app_id:
              default: *domesticBillsAppId
              type: string
              description: Unique identifier of the domestic general bills preset application.
            enable_invoice_verify:
              type: boolean
              description: Whether to enable invoice verification for this extraction. true enables it and false disables it; omit the field to use the saved application setting.
          required: [app_id, file_url]
        - title: Use file Base64
          type: object
          additionalProperties: false
          properties:
            file_base64:
              default: *domesticBillsFileBase64
              type: string
              description: Base64-encoded file. Use either file_base64 or file_url.
            file_name:
              type: string
              description: File name. Provide it for Base64 input or when the name cannot be determined from the URL.
            app_id:
              default: *domesticBillsAppId
              type: string
              description: Unique identifier of the domestic general bills preset application.
            enable_invoice_verify:
              type: boolean
              description: Whether to enable invoice verification for this extraction. true enables it and false disables it; omit the field to use the saved application setting.
          required: [app_id, file_base64]
    SimpleResponse:
      type: object
      additionalProperties: true
      required: [code, message, tips]
      properties:
        code:
          oneOf:
            - type: string
            - type: integer
          description: |-
            API processing code. It is `success` after entering the verification flow; `success` does not mean that the invoice passed verification.
        message:
          type: string
          description: API-level message.
        tips:
          type: [string, 'null']
          description: Optional information.
      description: API response envelope.
    HTTPValidationError:
      type: object
      additionalProperties: true
      required: [detail]
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
      description: Request validation error response.
    ValidationErrorItem:
      type: object
      additionalProperties: true
      required: [type, loc, msg]
      properties:
        type:
          type: string
          description: Validation error type.
        loc:
          type: array
          description: Location of the invalid field.
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
          description: Validation error message.
        input:
          description: Input value that caused the validation error.
        ctx:
          type: object
          additionalProperties: true
          description: Optional validation context.
      description: One request validation error.
    TaskCreateResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                task_id:
                  type: string
                metadata:
                  type: object
                  additionalProperties: true
                  description: Document processing task metadata.
    InvoiceVerifyRequest:
      description: Select a request model by invoice type. After choosing type_key, the API reference shows only the verification fields for that type. Existing callers can use compatibility mode and omit type_key.
      oneOf:
        - $ref: '#/components/schemas/LegacyInvoiceVerifyRequest'
        - $ref: '#/components/schemas/VatSpecialInvoiceVerifyRequest'
        - $ref: '#/components/schemas/VatElectronicSpecialInvoiceVerifyRequest'
        - $ref: '#/components/schemas/VatCommonInvoiceVerifyRequest'
        - $ref: '#/components/schemas/VatElectronicInvoiceVerifyRequest'
        - $ref: '#/components/schemas/VatRollInvoiceVerifyRequest'
        - $ref: '#/components/schemas/VatElectronicSpecialInvoiceNewVerifyRequest'
        - $ref: '#/components/schemas/VatElectronicInvoiceNewVerifyRequest'
        - $ref: '#/components/schemas/MotorVehicleSaleInvoiceVerifyRequest'
        - $ref: '#/components/schemas/UsedCarPurchaseInvoiceVerifyRequest'
        - $ref: '#/components/schemas/ElectronicAirTransportVerifyRequest'
        - $ref: '#/components/schemas/ElectronicTrainTicketVerifyRequest'
      discriminator:
        propertyName: type_key
        mapping:
          vat_special_invoice: '#/components/schemas/VatSpecialInvoiceVerifyRequest'
          vat_electronic_special_invoice: '#/components/schemas/VatElectronicSpecialInvoiceVerifyRequest'
          vat_common_invoice: '#/components/schemas/VatCommonInvoiceVerifyRequest'
          vat_electronic_invoice: '#/components/schemas/VatElectronicInvoiceVerifyRequest'
          vat_roll_invoice: '#/components/schemas/VatRollInvoiceVerifyRequest'
          vat_electronic_special_invoice_new: '#/components/schemas/VatElectronicSpecialInvoiceNewVerifyRequest'
          vat_electronic_invoice_new: '#/components/schemas/VatElectronicInvoiceNewVerifyRequest'
          motor_vehicle_sale_invoice: '#/components/schemas/MotorVehicleSaleInvoiceVerifyRequest'
          used_car_purchase_invoice: '#/components/schemas/UsedCarPurchaseInvoiceVerifyRequest'
          electronic_air_transport: '#/components/schemas/ElectronicAirTransportVerifyRequest'
          electronic_train_ticket: '#/components/schemas/ElectronicTrainTicketVerifyRequest'
      x-required-fields-by-type:
        vat_special_invoice:
          - fpNumber
          - fpDate
          - fpCode
          - fpNoTaxAmount
        vat_electronic_special_invoice:
          - fpNumber
          - fpDate
          - fpCode
          - fpNoTaxAmount
        vat_common_invoice:
          - fpNumber
          - fpDate
          - fpCode
          - fpCRC
        vat_electronic_invoice:
          - fpNumber
          - fpDate
          - fpCode
          - fpCRC
        vat_roll_invoice:
          - fpNumber
          - fpDate
          - fpCode
          - fpCRC
        vat_electronic_special_invoice_new:
          - fpNumber
          - fpDate
          - fpAmount
        vat_electronic_invoice_new:
          - fpNumber
          - fpDate
          - fpAmount
        motor_vehicle_sale_invoice:
          - fpNumber
          - fpDate
          - fpCode
          - fpNoTaxAmount
        used_car_purchase_invoice:
          - fpNumber
          - fpDate
          - fpCode
          - fpAmount
        electronic_air_transport:
          - fpNumber
          - fpDate
          - fpAmount
        electronic_train_ticket:
          - fpNumber
          - fpDate
          - fpAmount
    InvoiceVerifyResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              oneOf:
                - $ref: '#/components/schemas/InvoiceVerifyData'
                - type: 'null'
              description: |-
                Verification data when the request enters the business flow. It can be null or omitted for framework-level business errors.
    InvoiceVerifyResult:
      type: object
      additionalProperties: true
      description: |-
        The verification result for one invoice. The verification service can return additional authoritative fields by invoice type. Depend only on fields declared in this contract and ignore unknown fields.
      properties:
        type_key:
          type: [string, 'null']
          description: Invoice type identifier used for the request.
        instance_id:
          type: [string, 'null']
          description: Customer-provided or server-generated business instance ID.
        invoice_pdf_page_number:
          type: [integer, 'null']
          description: Invoice page number. Always 1 for standalone single-invoice verification.
          minimum: 1
        fpVerification:
          type: [string, 'null']
          description: |-
            Verification status. Known values include `查验成功发票一致`, `查验成功发票不一致`, `发票不存在`, `未能查验`, `不支持查验`, and `未知`.
        fpVerificationMsg:
          type: [string, 'null']
          description: Verification details, missing-field explanation, or downstream error message.
        fpIsVoided:
          type: [string, 'null']
          enum: [已作废, 未作废, '', null]
          description: Voided status. An empty string or null means it could not be determined.
        fpType:
          type: [string, 'null']
          description: Invoice type name returned by the verification service.
        fpCode:
          type: [string, 'null']
          description: Invoice code.
