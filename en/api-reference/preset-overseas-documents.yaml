openapi: 3.1.0
info:
  title: Global Invoices and receipts
  version: 1.0.0
  description: ADP preset application APIs for extracting Global Invoices and receipts.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://adp-global.laiye.com
    description: ADP global production endpoint
tags:
  - name: Global Invoices and receipts extraction
    description: Extract fields from Global Invoices and receipts.
paths:
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract:
    post:
      tags: [Global Invoices and receipts extraction]
      summary: Extract Global Invoices and receipts (sync)
      description: Extract fields from Global Invoices and receipts. Returned fields depend on the preset application configuration.
      operationId: extractOverseasDocuments
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        $ref: '#/components/requestBodies/DocumentExtractRequest'
      responses:
        '200':
          $ref: '#/components/responses/DocumentExtractResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract/create/task:
    post:
      tags: [Global Invoices and receipts extraction]
      summary: Create Global Invoices and receipts extraction task
      description: Create an async extraction task for Global Invoices or receipts.
      operationId: createOverseasDocumentExtractTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        $ref: '#/components/requestBodies/DocumentExtractRequest'
      responses:
        '200':
          $ref: '#/components/responses/TaskCreateResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract/query/task/{task_id}:
    get:
      tags: [Global Invoices and receipts extraction]
      summary: Query Global Invoices and receipts extraction result
      description: Query async extraction results for Global Invoices or receipts.
      operationId: queryOverseasDocumentExtractTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          $ref: '#/components/responses/DocumentExtractResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
  parameters:
    TenantName:
      name: tenant_name
      in: path
      required: true
      description: "Tenant name. Default: laiye."
      schema:
        type: string
        default: laiye
    TaskId:
      name: task_id
      in: path
      required: true
      description: Task ID.
      schema:
        type: string
    AcceptLanguage:
      name: accept-language
      in: header
      required: false
      description: Field name language. Use zh for Chinese or en for English.
      schema:
        type: string
        enum: [zh, en]
        default: en
  examples:
    OverseasDocumentsFileBase64:
      summary: Use file Base64
      value:
        file_base64: &overseasDocumentsFileBase64 data:image/jpeg;base64,
        app_id: ootb_r3s6t9u2v5w8x1y4z7a0b3c6d9e2
        enable_multi_ticket: true
        enable_field_value_translation: false
    OverseasDocumentsFileUrl:
      summary: Use file URL
      value:
        file_url: &overseasDocumentsFileUrl https://adp.laiye.com/web/agentic_doc_processor/laiye/file/2003c711818811f1a36200163e358400
        app_id: ootb_r3s6t9u2v5w8x1y4z7a0b3c6d9e2
        enable_multi_ticket: true
        enable_field_value_translation: false
  requestBodies:
    DocumentExtractRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentExtractRequest'
          examples:
            fileUrl:
              $ref: '#/components/examples/OverseasDocumentsFileUrl'
            fileBase64:
              $ref: '#/components/examples/OverseasDocumentsFileBase64'
  responses:
    DocumentExtractResponse:
      description: Extraction result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentExtractResponse'
    TaskCreateResponse:
      description: Task creation result.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskCreateResponse'
    ValidationError:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPValidationError'
  schemas:
    DocumentExtractRequest:
      oneOf:
        - title: Use file URL
          type: object
          additionalProperties: false
          properties:
            file_url:
              default: *overseasDocumentsFileUrl
              type: string
              format: uri
              description: File URL. Use either file_url or file_base64.
            file_name:
              type: string
              description: File name. Provide it for Base64 input or when the name cannot be determined from the URL.
            enable_multi_ticket:
              type: boolean
              default: true
              description: Whether to split multiple invoices or receipts in one file into separate results. Only the high-speed (global) and Southeast Asia versions support this option. It applies only to the current request and does not modify the application configuration.
            enable_field_value_translation:
              type: [boolean, 'null']
              description: Whether to enable field-value translation for the current request. If omitted or null, the saved application setting is used. This option does not modify the application configuration. The accept-language header determines the target language.
            app_id:
              type: string
              enum:
                - ootb_r3s6t9u2v5w8x1y4z7a0b3c6d9e2
                - ootb_u2v5w8x1y4z7a0b3c6d9e2f5g8
                - ootb_a3f8h1j5k9n2p7q4w6x0y3b5c8d1
              x-enumNames:
                - High-speed (global)
                - Southeast Asia
                - Standard
              x-enumDescriptions:
                - High-speed for global invoices and receipts (default)
                - Southeast Asia version with additional withholding tax fields
                - Standard
              default: ootb_r3s6t9u2v5w8x1y4z7a0b3c6d9e2
              description: "Preset application ID. High-speed (global, default): ootb_r3s6t9u2v5w8x1y4z7a0b3c6d9e2; Southeast Asia: ootb_u2v5w8x1y4z7a0b3c6d9e2f5g8; Standard: ootb_a3f8h1j5k9n2p7q4w6x0y3b5c8d1."
          required: [app_id, file_url]
        - title: Use file Base64
          type: object
          additionalProperties: false
          properties:
            file_base64:
              default: *overseasDocumentsFileBase64
              type: string
              description: Base64-encoded file. Use either file_base64 or file_url.
            file_name:
              type: string
              description: File name. Provide it for Base64 input or when the name cannot be determined from the URL.
            enable_multi_ticket:
              type: boolean
              default: true
              description: Whether to split multiple invoices or receipts in one file into separate results. Only the high-speed (global) and Southeast Asia versions support this option. It applies only to the current request and does not modify the application configuration.
            enable_field_value_translation:
              type: [boolean, 'null']
              description: Whether to enable field-value translation for the current request. If omitted or null, the saved application setting is used. This option does not modify the application configuration. The accept-language header determines the target language.
            app_id:
              type: string
              enum:
                - ootb_r3s6t9u2v5w8x1y4z7a0b3c6d9e2
                - ootb_u2v5w8x1y4z7a0b3c6d9e2f5g8
                - ootb_a3f8h1j5k9n2p7q4w6x0y3b5c8d1
              x-enumNames:
                - High-speed (global)
                - Southeast Asia
                - Standard
              x-enumDescriptions:
                - High-speed for global invoices and receipts (default)
                - Southeast Asia version with additional withholding tax fields
                - Standard
              default: ootb_r3s6t9u2v5w8x1y4z7a0b3c6d9e2
              description: "Preset application ID. High-speed (global, default): ootb_r3s6t9u2v5w8x1y4z7a0b3c6d9e2; Southeast Asia: ootb_u2v5w8x1y4z7a0b3c6d9e2f5g8; Standard: ootb_a3f8h1j5k9n2p7q4w6x0y3b5c8d1."
          required: [app_id, file_base64]
    SimpleResponse:
      type: object
      properties:
        code:
          oneOf:
            - type: string
            - type: integer
        message:
          type: string
        tips:
          type:
            - string
            - 'null'
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
      required: [detail]
    ValidationErrorItem:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
        loc:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
        input: {}
        ctx:
          type: object
          additionalProperties: true
      required: [type, loc, msg]
    TaskCreateResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                task_id:
                  type: string
                metadata:
                  type: object
                  additionalProperties: true
                  description: Document processing task metadata.
    DocumentExtractResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true
              properties:
                task_id:
                  type: string
                file_url:
                  type: string
                status:
                  type: integer
                  enum: [0, 1, 2, 4, 5, 6]
                  description: 0=unknown, 1=ready, 2=running, 4=succeeded, 5=failed, 6=canceled or rejected.
                message:
                  type: string
                  description: Task status or processing result message.
                extract_config_version:
                  type: string
                  description: Extraction configuration version used for this request.
                metadata:
                  type: [object, 'null']
                  additionalProperties: true
                  description: Document processing task metadata.
                aigc:
                  type: [object, 'null']
                  additionalProperties: true
                  description: AI-generated content compliance label.
                doc_recognize_result:
                  type: array
                  description: Document parsing results.
                  items:
                    type: object
                    additionalProperties: true
                extraction_result:
                  type: array
                  description: Document field extraction results.
                  items:
                    type: object
                    additionalProperties: true
                classify_result:
                  type: object
                  description: Document classification result.
                  additionalProperties: true
