        node_ids:
          type: array
          uniqueItems: true
          description: 可选的节点 ID 列表；省略时包含运行中的全部可导出节点。
          items:
            type: string
            minLength: 1
        format:
          type: string
          enum: [excel, word, markdown, json]
          default: excel
        report_mode:
          type: string
          enum: [merged, per_run]
          default: merged
          description: merged 合并为一份报告；per_run 按运行拆分。
        include_failed_runs:
          type: boolean
          default: false
        primary_key_variable:
          type: string
          description: 可选的工作流输入变量名，用作导出主键。
        max_text_length:
          type: integer
          minimum: 1
          maximum: 30000
          default: 10000
          description: 单个文本值导出的最大字符数；当前路由实际默认 10000。
      required: [application_id, run_ids]
    WorkflowRunExportResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              oneOf:
                - $ref: '#/components/schemas/WorkflowRunExportData'
                - type: 'null'
    WorkflowRunExportData:
      type: object
      properties:
        file_id: {type: string}
        download_url:
          type: string
          format: uri
