      description: |
        根据应用 ID 查询名称、描述、状态和标签。

        受限预览：当前详情路由的可见性校验与列表路由不完全一致。仅查询由当前账号拥有或明确共享给当前租户、且已从列表中取得的 application_id；不要把任意外部 ID 直接传入该接口。
      operationId: getWorkflowApplication
      security:
        - EngineApiKeyAuth: []
      parameters:
        - name: application_id
          in: path
          required: true
          description: 从工作流应用列表取得的应用 ID。
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          $ref: '#/components/responses/WorkflowApplicationResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_engine/laiye/v1/app/run:
    post:
      tags: [工作流]
