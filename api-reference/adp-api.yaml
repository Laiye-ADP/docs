        total_runs: {type: integer, minimum: 0, maximum: 200}
        included_runs: {type: integer, minimum: 0, maximum: 200}
        skipped_runs: {type: integer, minimum: 0, maximum: 200}
        run_summaries:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRunExportSummary'
        export_time:
          type: string
          format: date-time
      required: [file_id, download_url, filename, file_size, format, report_mode, total_runs, included_runs, skipped_runs, run_summaries, export_time]
    WorkflowRunExportSummary:
      type: object
      properties:
        run_id: {type: string}
        status: {type: string}
        started_at:
          type: [string, 'null']
          format: date-time
        ended_at:
          type: [string, 'null']
          format: date-time
        included_nodes: {type: integer, minimum: 0}
        skipped_nodes: {type: integer, minimum: 0}
      required: [run_id, status, started_at, ended_at, included_nodes, skipped_nodes]
    SimpleResponse:
      type: object
      properties:
        code:
          oneOf:
            - type: string
            - type: integer
          description: 业务码。成功通常为 success 或 200。
        message:
          type: string
          description: 返回信息。
        tips:
          type:
            - string
            - 'null'
          description: 详细信息，默认为空。
    HTTPValidationError:
      type: object
      description: FastAPI/Pydantic 请求参数校验错误。
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
      required: [detail]
    ValidationErrorItem:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
          description: 校验错误类型。
        loc:
          type: array
          description: 错误字段在请求中的位置。
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
          description: 可读的错误说明。
        input:
          description: 导致校验失败的输入值。
        ctx:
          type: object
          additionalProperties: true
          description: 校验器提供的补充上下文。
        url:
          type: string
          format: uri
          description: Pydantic 错误说明链接。
      required: [type, loc, msg]
    DocumentFileRequest:
      oneOf:
        - title: 使用文件 URL
          type: object
          additionalProperties: false
          properties:
            app_id:
              default: *documentRecognitionAppId
              type: string
              description: 应用的唯一标识。
            file_url:
              default: *documentRecognitionFileUrl
              type: string
              format: uri
              description: 待处理文件 URL，与 file_base64 二选一。
            file_name:
              type: string
              description: 文件名称。使用 Base64 或无法从 URL 判断文件名时可传入。
            model_params:
              $ref: '#/components/schemas/DocumentRecognizeModelParams'
          required: [app_id, file_url]
        - title: 使用文件 Base64
          type: object
          additionalProperties: false
          properties:
            app_id:
              default: *documentRecognitionAppId
              type: string
              description: 应用的唯一标识。
            file_base64:
              default: *documentRecognitionFileBase64
              type: string
              description: 待处理文件 Base64，与 file_url 二选一。
            file_name:
              type: string
              description: 文件名称。使用 Base64 或无法从 URL 判断文件名时可传入。
            model_params:
              $ref: '#/components/schemas/DocumentRecognizeModelParams'
          required: [app_id, file_base64]
    DocumentRecognizeModelParams:
      type: object
      additionalProperties: true
      description: |
        本次文档解析的模型调用参数。未传时使用应用已保存的解析配置；如需临时覆盖解析配置，在 recognize_config 中传入对应字段。
      properties:
        recognize_config:
          $ref: '#/components/schemas/DocumentRecognizeConfig'
    DocumentRecognizeConfig:
      type: object
      additionalProperties: false
      description: 本次调用使用的解析配置。
      properties:
        recognize_mode:
          type: string
          enum: [standard, advance, agentic, fast_vlm, agentic_v2]
          default: standard
          description: |
            解析模式。可选值如下：

            - standard：标准解析，适用于清晰的电子版文档，速度和准确率均衡。
            - advance：增强解析 1.0，适用于印章、签名、多表格等版式较复杂的文档。
            - agentic：智能解析，组合标准解析与增强解析，并按条件进行二次解析。
            - fast_vlm：增强解析 2.0，适用于复杂版式、扫描件、多表格等文档，提升解析稳定性。
            - agentic_v2：智能解析 2.0，采用两阶段版面分析与内容识别，适用于复杂版式、表格和公式文档。
        enable_highlight:
          type: integer
          enum: [0, 1]
          default: 1
          description: 是否显示来源位置。1 表示保留文本块和表格在原文中的位置；0 表示不返回位置。standard、agentic、fast_vlm、agentic_v2 模式支持，advance 模式不支持。
        enable_pdf_parse:
          type: boolean
          default: false
          description: 是否启用 PDF 文本优先。仅对可复制文字的电子 PDF 生效，可提升处理速度和文字稳定性。
        pdf_pic_second_parsing:
          type: boolean
          default: false
          description: 启用 PDF 文本优先时，是否对 PDF 中的图片区域进行 VLM 二次解析。
        enable_stamp_recognition:
          type: boolean
          default: false
          description: 是否启用印章识别。开启后会识别文档中的印章信息，并尝试提取印章文字。
    DocumentExtractRequest:
      oneOf:
        - title: 使用文件 URL
          type: object
          additionalProperties: false
          properties:
            app_id:
              default: app_abc123
              type: string
              description: 应用的唯一标识。
            file_url:
              default: *documentRecognitionFileUrl
              type: string
              format: uri
              description: 待处理文件 URL，与 file_base64 二选一。
            file_name:
              type: string
              description: 文件名称。使用 Base64 或无法从 URL 判断文件名时可传入。
            with_rec_result:
              type: boolean
              description: 是否返回文档解析结果。高速版抽取不返回解析结果。
              default: false
          required: [app_id, file_url]
        - title: 使用文件 Base64
          type: object
          additionalProperties: false
          properties:
            app_id:
              default: app_abc123
              type: string
              description: 应用的唯一标识。
            file_base64:
              default: JVBERi0xLjQKJcfs...
              type: string
              description: 待处理文件 Base64，与 file_url 二选一。
            file_name:
              type: string
              description: 文件名称。使用 Base64 或无法从 URL 判断文件名时可传入。
            with_rec_result:
              type: boolean
              description: 是否返回文档解析结果。高速版抽取不返回解析结果。
              default: false
          required: [app_id, file_base64]
    DocumentExtractResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DocumentExtractData'
    DocumentExtractData:
      type: object
      properties:
        task_id:
          type: string
        file_url:
          type: string
        message:
          type: string
          description: 任务状态或处理结果说明。
        status:
          type: integer
          enum: [0, 1, 2, 4, 5, 6]
          description: 0=未知，1=就绪，2=运行中，4=成功，5=失败，6=取消或拒绝。
        doc_recognize_result:
          type: array
          items:
            $ref: '#/components/schemas/RecognizePage'
        extraction_result:
          type: array
          items:
            $ref: '#/components/schemas/ExtractionField'
        extract_config_version:
          type: string
          description: 本次抽取使用的配置版本。
        collaboration_result:
          type: array
          items:
            type: object
            additionalProperties: true
        output_result:
          type: array
          items:
            type: object
            additionalProperties: true
        metadata:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: 文档处理任务元数据。
        aigc:
          oneOf:
            - $ref: '#/components/schemas/AigcLabel'
            - type: 'null'
          description: AI 生成内容合规标识。
        spreadsheet_manifest_file_id:
          type: string
          description: Excel 原生预览 Manifest 文件 ID；非 Excel 文档通常返回空字符串。
        spreadsheet_manifest_url:
          type: string
          description: Excel 原生预览 Manifest 下载地址；非 Excel 文档通常返回空字符串。
        spreadsheet_billing:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: Excel 工作表与内嵌图片计费信息。
    DocumentRecognizeResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                task_id:
                  type: string
                file_url:
                  type: string
                message:
                  type: string
                  description: 任务状态或处理结果说明。
                status:
                  type: integer
                  enum: [0, 1, 2, 4, 5, 6]
                  description: 0=未知，1=就绪，2=运行中，4=成功，5=失败，6=取消或拒绝。
                doc_recognize_result:
                  type: array
                  items:
                    $ref: '#/components/schemas/RecognizePage'
                metadata:
                  type: object
                  additionalProperties: true
                  description: 文档处理任务元数据。
                aigc:
                  oneOf:
                    - $ref: '#/components/schemas/AigcLabel'
                    - type: 'null'
                  description: AI 生成内容合规标识。
                convert_result:
                  type: object
                  additionalProperties: true
                  description: 文档转换结果；Excel 文件会携带原生预览 Manifest 与计费信息。
                spreadsheet:
                  type: object
                  additionalProperties: true
                  description: Excel 原生结构摘要。
    AigcLabel:
      type: object
      properties:
        Label:
          type: string
          description: 内容标识类型。
        ContentProducer:
          type: string
          description: 内容生成服务提供者编码。
        ProduceID:
          type: string
          description: 内容制作编号。
        ReservedCode1:
          type: string
          description: 内容生成侧预留校验码。
        ContentPropagator:
