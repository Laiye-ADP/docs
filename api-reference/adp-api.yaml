        PropagateID:
          type: string
          description: 内容传播编号。
        ReservedCode2:
          type: string
          description: 内容传播侧预留校验码。
        ProcessingTypes:
          type: array
          description: 本次响应涉及的 AI 处理类型。
          items:
            type: string
    RecognizePage:
      type: object
      properties:
        page_num:
          type: integer
        document_content:
          type: string
        document_details:
          type: array
          items:
            $ref: '#/components/schemas/DocumentDetail'
        stamps:
          type: array
          description: 印章识别结果。仅在开启 enable_stamp_recognition 且识别到印章时返回。
          items:
            type: object
            additionalProperties: true
    DocumentDetail:
      type: object
      properties:
        type:
          type: string
        text:
          type: string
        position:
          type: array
