openapi: 3.1.0
info:
  title: ADP API
  version: 1.0.0
  description: Laiye ADP 官方 OpenAPI 接口规范，覆盖文档抽取、解析与转换，抽取应用管理、Webhook、积分查询，以及工作流发现、运行、导出和文件管理。
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://adp.laiye.com
    description: ADP 生产环境
tags:
  - name: 文档抽取
    description: 从上传的文档中抽取结构化字段。
  - name: 文档解析
    description: 识别上传文档中的文字、版面块和位置信息。
  - name: 文档转换
    description: 将 PDF、Office、OFD 和图片转换为页面图片或电子表格结构。
  - name: 应用管理
    description: 创建、修改、删除和查询抽取应用及配置。
  - name: Webhook
    description: 查询事件目录并管理事件回调。
  - name: 账户
    description: 查询账户积分和使用情况。
  - name: 工作流
    description: 运行工作流应用并查询执行结果。
  - name: 工作流文件
    description: 上传和管理工作流应用使用的文件。
paths:
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract:
    post:
      tags: [文档抽取]
      summary: 文档抽取（同步接口）
      description: 针对用户上传的文档，调用指定的文档抽取应用，根据应用配置和规则从文件中提取指定内容。同一接口适用于自定义抽取应用、海外发票、收据、采购订单、国内通用票据和卡证等场景。
      operationId: extractDocument
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        $ref: '#/components/requestBodies/DocumentExtractRequest'
      responses:
        '200':
          $ref: '#/components/responses/DocumentExtractResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract/create/task:
    post:
      tags: [文档抽取]
      summary: 创建文档抽取异步任务
      description: 创建文档抽取任务并立即返回 task_id。适用于大文档或长时间抽取任务。
      operationId: createDocumentExtractTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        $ref: '#/components/requestBodies/DocumentExtractRequest'
      responses:
        '200':
          $ref: '#/components/responses/TaskCreateResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract/query/task/{task_id}:
    get:
      tags: [文档抽取]
      summary: 查询文档抽取任务结果
      description: 根据创建任务接口返回的 task_id 查询文档抽取状态和结果。
      operationId: queryDocumentExtractTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          $ref: '#/components/responses/DocumentExtractResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/recognize:
    post:
      tags: [文档解析]
      summary: 文档解析（同步接口）
      description: 接受用户上传的文档，识别文档中的文字内容和文本块位置信息。
      operationId: recognizeDocument
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        $ref: '#/components/requestBodies/DocumentFileRequest'
      responses:
        '200':
          $ref: '#/components/responses/DocumentRecognizeResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/recognize/create/task:
    post:
      tags: [文档解析]
      summary: 创建文档解析异步任务
      description: 创建文档解析任务并立即返回 task_id。
      operationId: createDocumentRecognizeTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        $ref: '#/components/requestBodies/DocumentFileRequest'
      responses:
        '200':
          $ref: '#/components/responses/TaskCreateResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/recognize/query/task/{task_id}:
    get:
      tags: [文档解析]
      summary: 查询文档解析任务结果
      description: 根据创建任务接口返回的 task_id 查询文档解析状态和结果。
      operationId: queryDocumentRecognizeTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          $ref: '#/components/responses/DocumentRecognizeResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/doc/convert:
    post:
      tags: [文档转换]
      summary: 文档转换（同步）
      description: |
        将 PDF、DOC/DOCX、XLS/XLSX、PPT/PPTX、OFD 或常见图片转换为页面图片；XLSX 也可能返回原生电子表格结构。file_url 与 file_base64 必须二选一。

        当前实现限制输入最大 50 MiB、最多 260 页；同步请求可能在约 120 秒达到服务超时，生产集成优先使用异步创建与查询接口。失败分支可能以 HTTP 200、code=success、data=null 返回，调用方必须确认 data 存在，并检查 task_id、img_detail_list 或电子表格结构字段。返回 URL 当前通常约 1 小时有效，应及时下载。
      operationId: convertDocument
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/DocumentConvertRequest'
      responses:
        '200':
          $ref: '#/components/responses/DocumentConvertResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/doc/convert/create/task:
    post:
      tags: [文档转换]
      summary: 创建文档转换异步任务
      description: |
        创建文档转换任务并立即返回 task_id。当前队列消息保留约 1 小时，单任务消费超时约 180 秒，结果文件通常约 1 小时有效；这些时长尚未作为稳定 SLA。

        创建失败仍可能表现为 HTTP 200、code=success、data=null，必须确认 data.task_id 非空。请使用查询接口轮询结果，并采用退避策略。
      operationId: createDocumentConvertTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/DocumentConvertAsyncRequest'
      responses:
        '200':
          $ref: '#/components/responses/DocumentConvertTaskResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/doc/convert/query/task/{task_id}:
    get:
      tags: [文档转换]
      summary: 查询文档转换异步任务
      description: |
        根据 task_id 查询转换结果。当前响应没有独立的任务状态字段；任务仍在处理时可能返回 code=success 以及空的 img_detail_list/total_num。请使用退避轮询，并在取得页面结果或电子表格结构后再结束。

        空结果不能可靠区分“处理中”和“无可视页面”，请为客户端设置总超时和最大轮询次数。
      operationId: queryDocumentConvertTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - name: task_id
          in: path
          required: true
          description: 创建异步转换任务后返回的任务 ID。
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          $ref: '#/components/responses/DocumentConvertResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/webhook/events:
    get:
      tags: [Webhook]
      summary: 查询 Webhook 事件目录
      description: |
        返回当前服务注册、可用于配置订阅的系统事件类型。事件目录只说明事件名称可被配置，不等于每种事件都已提供投递 SLA；回调 data 的字段也可能因事件而异。

        当前目录包含文档解析完成、文档抽取完成，以及人工协作开始/成功/失败/完成/超时等 7 个事件。collaboration_timeout 当前仅表示已注册事件，不承诺一定产生实际投递。
      operationId: listWebhookEvents
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      responses:
        '200':
          $ref: '#/components/responses/WebhookEventListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/webhook/create:
    post:
      tags: [Webhook]
      summary: 创建 Webhook
      description: |
        创建 Webhook 配置。每个账号最多保留 5 个配置；app_id 省略、为 null 或空数组时，订阅当前账号下所有应用，传数组时只订阅指定应用。

        回调使用 POST application/json，请求体为 `{event_type, timestamp, data}`。正式环境会发送 `X-Webhook-Signature: sha256=...` 和 `X-Webhook-Timestamp`；签名计算为 `HMAC-SHA256(secret, timestamp + "." + raw_body)`。

        当前 OpenAPI 不返回、设置或轮换 secret，因此外部调用方无法独立完成验签；失败重试也没有公开 SLA。只可配置由你控制的公网 HTTPS 地址，接收端应快速返回 HTTP 200。
      operationId: createWebhook
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/WebhookCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/WebhookMutationResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/webhook/list:
    get:
      tags: [Webhook]
      summary: 查询 Webhook 配置
      description: 查询当前账号的 Webhook 配置。可使用 app_id 过滤包含该抽取应用的配置；全应用范围的配置也会匹配。响应不会返回回调签名密钥。
      operationId: listWebhooks
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - name: app_id
          in: query
          required: false
          description: 按抽取应用 ID 或应用 Key 过滤。
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/WebhookListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/webhook/update:
    post:
      tags: [Webhook]
      summary: 修改 Webhook
      description: |
        修改回调地址、事件类型或应用范围。省略 app_id 表示不修改应用范围；显式传 null 或空数组会清除范围并改为订阅当前账号下所有应用。

        仅传 webhook_id 在后端是合法的空操作。公开合同要求至少提供一个待修改字段；回调地址只应使用由你控制的公网 HTTPS 地址。
      operationId: updateWebhook
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/WebhookUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/WebhookMutationResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/webhook/delete:
    post:
      tags: [Webhook]
      summary: 删除 Webhook
      description: 删除当前账号的 Webhook 配置。删除配置不会同步删除已经生成的历史投递日志。
      operationId: deleteWebhook
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/WebhookDeleteRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmptyMutationResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/webhook/logs:
    post:
      tags: [Webhook]
      summary: 查询 Webhook 投递日志
      description: |
        查询 Webhook 投递结果。默认返回最近 72 小时，单次时间范围最多 30 天；response_body 最多保留约 2000 个字符，可能包含接收端返回的业务或敏感信息。

        当前服务按租户范围查询日志，而不是按创建 Webhook 的用户二次隔离。该接口只应由受控租户的管理员 API Key 使用，并应尽量传 webhook_id 收窄范围。不要向普通终端用户暴露日志响应。
      operationId: queryWebhookLogs
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/WebhookLogQueryRequest'
      responses:
        '200':
          $ref: '#/components/responses/WebhookLogResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app-manage/create:
    post:
      tags: [应用管理]
      summary: 创建抽取应用
      description: 创建标准版或高速版自定义抽取应用，并设置标签、字段配置和抽取配置。标准版支持 parse_mode、显示来源位置、PDF 文本优先、印章识别等解析配置；创建高速版自定义抽取应用时，设置 ai_function 为 1425，且字段和表格子字段需要提供 field_key，不支持标准版解析配置。注意：HTTP 200 也可能表示业务失败，调用方必须同时检查响应中的业务 code。
      operationId: createExtractionApp
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/ExtractionAppCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/ExtractionAppResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-codeSamples:
        - lang: python
          label: Python（同时检查 HTTP 状态和业务码）
          source: |
            import requests

            response = requests.post(
                "https://adp.laiye.com/open/agentic_doc_processor/laiye/v1/app-manage/create",
                headers={"X-API-KEY": "YOUR_API_KEY"},
                json={
                    "ai_function": 1406,
                    "app_name": "采购单抽取应用",
                    "extract_fields": [
                        {"field_name": "订单号", "field_type": "string"}
                    ],
                    "parse_mode": "standard",
                },
                timeout=60,
            )
            response.raise_for_status()
            result = response.json()
            if result.get("code") not in ("success", 200, "200"):
                raise RuntimeError(result.get("message") or result.get("code"))
  /open/agentic_doc_processor/{tenant_name}/v1/app-manage/delete:
    post:
      tags: [应用管理]
      summary: 删除抽取应用
      description: 删除抽取应用，删除后无法恢复。删除高速版自定义抽取应用时，复用该接口并传入高速版应用的 app_id。
      operationId: deleteExtractionApp
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/AppIdRequest'
      responses:
        '200':
          $ref: '#/components/responses/ExtractionAppDeleteResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app-manage/update:
    post:
      tags: [应用管理]
      summary: 修改抽取应用
      description: 更新抽取应用的名称、标签、字段配置和抽取配置，并创建新的配置版本。修改高速版自定义抽取应用时，复用该接口并传入高速版应用的 app_id；请求体不需要传 ai_function。高速版自定义抽取应用不支持设置 parse_mode、enable_highlight、enable_pdf_parse、pdf_pic_second_parsing、enable_stamp_recognition 和 enable_long_doc。注意：HTTP 200 也可能表示业务失败，调用方必须同时检查响应中的业务 code。
      operationId: updateExtractionApp
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/ExtractionAppUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/ExtractionAppUpdateResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-codeSamples:
        - lang: python
          label: Python（同时检查 HTTP 状态和业务码）
          source: |
            import requests

            response = requests.post(
                "https://adp.laiye.com/open/agentic_doc_processor/laiye/v1/app-manage/update",
                headers={"X-API-KEY": "YOUR_API_KEY"},
                json={
                    "app_id": "app_1406",
                    "extract_fields": [
                        {"field_name": "订单号", "field_type": "string"}
                    ],
                    "parse_mode": "standard",
                },
                timeout=60,
            )
            response.raise_for_status()
            result = response.json()
            if result.get("code") not in ("success", 200, "200"):
                raise RuntimeError(result.get("message") or result.get("code"))
  /open/agentic_doc_processor/{tenant_name}/v1/app-manage/config:
    post:
      tags: [应用管理]
      summary: 查询应用配置
      description: 根据 app_id 查询抽取应用配置。查询高速版自定义抽取应用配置时，传入高速版应用的 app_id；不传 config_version 时返回最新配置版本。
      operationId: getExtractionAppConfig
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/AppConfigQueryRequest'
      responses:
        '200':
          description: 应用配置。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigResponse'
              examples:
                standardConfig:
                  value:
                    code: 200
                    message: success
                    data:
                      app_id: app_1406
                      app_name: 采购单抽取应用
                      app_label: [purchase-order]
                      config_version: v1
                      extract_fields:
                        - field_name: 订单号
                          field_type: string
                          field_prompt: 抽取采购订单编号。
                      parse_mode: fast_vlm
                      enable_highlight: 0
                      enable_pdf_parse: true
                      pdf_pic_second_parsing: false
                      enable_stamp_recognition: true
                      enable_long_doc: false
                highSpeedConfig:
                  value:
                    code: 200
                    message: success
                    data:
                      app_id: app_1425
                      app_name: 高速版发票抽取应用
                      app_label: [invoice, high-speed]
                      config_version: v1
                      extract_fields:
                        - field_name: 发票号码
                          field_type: string
                          field_prompt: 抽取发票上的唯一发票号码。
                      parse_mode: null
                      enable_highlight: null
                      enable_pdf_parse: null
                      pdf_pic_second_parsing: null
                      enable_stamp_recognition: null
                      enable_long_doc: false
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app-list:
    get:
      tags: [应用管理]
      summary: 查询应用列表
      description: 查询应用列表。查询高速版自定义抽取应用列表时，设置 ai_function=1425。
      operationId: listExtractionApps
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - name: app_name
          in: query
          required: false
          description: 按应用名称过滤，支持模糊匹配。
          schema:
            type: string
        - name: ai_function
          in: query
          required: false
          description: 按 AI 能力过滤。高速版自定义抽取应用传 1425；标准自定义抽取应用传 1406。
          schema:
            type: integer
            enum: [1406, 1425]
            default: 1425
        - name: app_type
          in: query
          required: false
          description: 应用类型。1=自定义应用，0=开箱即用。
          schema:
            type: integer
            enum: [0, 1]
        - name: with_extra
          in: query
          required: false
          description: 是否查询扩展信息。
          schema:
            type: integer
            enum: [0, 1]
            default: 1
        - name: sort[]
          in: query
          required: false
          description: 排序字段列表。字段名前加 - 表示降序，不加表示升序；默认按 updated_at 降序。
          style: form
          explode: true
          schema:
            type: array
            default: [-updated_at]
            items:
              type: string
        - name: offset
          in: query
          required: false
          description: 分页偏移量。
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 1000
        - name: limit
          in: query
          required: false
          description: 每页数量。
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 1000
      responses:
        '200':
          $ref: '#/components/responses/AppListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app-manage/version/delete:
    post:
      tags: [应用管理]
      summary: 删除抽取应用的配置
      description: 删除应用下某一个版本的字段配置信息。删除高速版自定义抽取应用的配置时，复用该接口并传入高速版应用的 app_id 和要删除的 config_version。
      operationId: deleteExtractionAppVersion
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/AppVersionDeleteRequest'
      responses:
        '200':
          $ref: '#/components/responses/ExtractionAppVersionDeleteResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app-manage/ai-recommend:
    post:
      tags: [应用管理]
      summary: 智能体生成抽取字段提示词
      description: 基于示例文档或提示词，AI 自动生成字段名称、字段类型和字段提示词等配置参考。标准版应用至少提供 prompt、file_url 或 file_base64 之一；高速版应用必须提供 file_url 或 file_base64，prompt 仅作为辅助生成提示。传入高速版自定义抽取应用的 app_id 时，会返回 common_rule、field_rule、table_rule 等配置预览；该接口不会保存配置版本，也不会自动回填到 Web 页面应用中。注意：HTTP 200 也可能表示业务失败，调用方必须同时检查响应中的业务 code。
      operationId: recommendExtractionFields
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/AiRecommendRequest'
      responses:
        '200':
          $ref: '#/components/responses/AiRecommendResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-codeSamples:
        - lang: python
          label: Python（同时检查 HTTP 状态和业务码）
          source: |
            import requests

            response = requests.post(
                "https://adp.laiye.com/open/agentic_doc_processor/laiye/v1/app-manage/ai-recommend",
                headers={"X-API-KEY": "YOUR_API_KEY"},
                json={
                    "app_id": "app_1406",
                    "prompt": "请生成发票号码、开票日期和价税合计字段",
                },
                timeout=120,
            )
            response.raise_for_status()
            result = response.json()
            if result.get("code") not in ("success", 200, "200"):
                raise RuntimeError(result.get("message") or result.get("code"))
  /open/agentic_doc_processor/{tenant_name}/v1/user/payment:
