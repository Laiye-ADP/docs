  schemas:
    # Schemas for the public and limited-preview operations above.
    DocumentConvertRequest:
      type: object
      additionalProperties: false
      oneOf:
        - title: 使用文件 URL
          required: [file_url]
        - title: 使用 Base64 文件
          required: [file_base64]
      properties:
        file_url:
          type: string
          format: uri
          maxLength: 2048
          description: 待转换文件的公网 HTTPS URL。不要传入内网地址或带长期凭证的 URL。
        file_base64:
          type: string
          format: byte
          description: 待转换文件的 Base64 内容。解码后最大 50 MiB。
        scale:
          type: number
          exclusiveMinimum: 0
          default: 1
          description: 页面缩放比例。服务端当前未设置稳定上限，建议使用默认值。
        first_convert_page:
          type: integer
          minimum: 1
          description: 转换起始页，从 1 开始；省略表示从第一页开始。
        last_convert_page:
          type: integer
          minimum: 1
          description: 转换结束页，从 1 开始且不能小于起始页；省略表示到最后一页。
        result_mode:
          type: string
          enum: [url, base64]
          default: url
          description: 页面图片返回方式。URL 为临时结果；Base64 会显著增加响应体。
    DocumentConvertAsyncRequest:
      type: object
      additionalProperties: false
      oneOf:
        - title: 使用文件 URL
          required: [file_url]
        - title: 使用 Base64 文件
          required: [file_base64]
      properties:
        file_url:
          type: string
          format: uri
          maxLength: 2048
          description: 待转换文件的公网 HTTPS URL。
        file_base64:
          type: string
          format: byte
          description: 待转换文件的 Base64 内容。解码后最大 50 MiB。
        scale:
          type: number
          exclusiveMinimum: 0
          default: 1
        first_convert_page:
          type: integer
          minimum: 1
        last_convert_page:
          type: integer
          minimum: 1
      description: 异步转换当前固定以 URL 返回页面结果，后端会忽略 result_mode，因此公共合同不暴露该字段。
    DocumentConvertTaskResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              oneOf:
                - type: object
                  properties:
                    task_id:
                      type: string
                  required: [task_id]
                - type: 'null'
    DocumentConvertResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              oneOf:
                - $ref: '#/components/schemas/DocumentConvertData'
                - type: 'null'
    DocumentConvertData:
      type: object
      properties:
        task_id:
          type: string
        img_detail_list:
          type: array
          items:
            $ref: '#/components/schemas/DocumentConvertImage'
        total_num:
          type: integer
          minimum: 0
        metadata:
          type: object
          additionalProperties: true
        file_type:
          type: string
          description: 转换结果类型，例如 pdf、image 或 spreadsheet。
        source_file_type:
          type: string
          description: 检测到的源文件扩展类型。
        spreadsheet_manifest_file_id:
          type: string
        spreadsheet_manifest_url:
          type: string
          description: Excel 原生预览 Manifest 临时下载地址。
        view_type:
          type: string
          description: Excel 原生解析时为 spreadsheet。
        page_count:
          type: integer
          minimum: 0
        sheet_count:
          type: integer
          minimum: 0
        logical_unit_count:
          type: integer
          minimum: 0
        document_contents:
          type: array
          items:
            type: string
        document_details:
          type: array
          items: {}
        warnings:
          type: array
          items:
            type: object
            additionalProperties: true
        billing:
          type: object
          additionalProperties: true
      required: [task_id, img_detail_list, total_num, metadata, file_type, source_file_type, spreadsheet_manifest_file_id, spreadsheet_manifest_url, view_type, page_count, sheet_count, logical_unit_count, document_contents, document_details, warnings, billing]
    DocumentConvertImage:
      type: object
      properties:
        page_num: {type: integer, minimum: 0}
        img_base64:
          type: string
          description: result_mode=base64 时的页面图片内容，否则通常为空字符串。
        img_url:
          type: string
          description: result_mode=url 时的临时页面地址，否则通常为空字符串。
        width: {type: integer, minimum: 0}
        height: {type: integer, minimum: 0}
        preprocess:
          type: object
          additionalProperties: true
      required: [page_num, img_base64, img_url, width, height, preprocess]
    EmptyDataResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
          required: [data]
    WebhookEventType:
      type: string
      enum:
        - doc_parse_completed
