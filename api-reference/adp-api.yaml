            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '200':
          $ref: '#/components/responses/FileUploadResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_engine/laiye/files/{file_id}:
    get:
      tags: [工作流文件]
      summary: 获取文件信息
      description: 根据文件 ID 获取文件元信息。
      operationId: getDocFlowFile
      security:
        - EngineApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          $ref: '#/components/responses/FileInfoResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: 生产环境 API Key，可在 ADP 平台的「我的 API」中查看。请确保 API Key 有效且属于生产环境。
    EngineApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 用于调用工作流接口的 API Key。
  parameters:
    TenantName:
      name: tenant_name
      in: path
      required: true
      description: 租户名称，默认 laiye。
      schema:
        type: string
        default: laiye
    TaskId:
      name: task_id
      in: path
      required: true
      description: 任务 ID。
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      description: 运行 ID。
      schema:
        type: string
    FileId:
      name: file_id
      in: path
      required: true
      description: 文件 ID。
      schema:
        type: string
    AcceptLanguage:
      name: accept-language
      in: header
      required: false
      description: 返回字段名称的语言。默认 zh 返回中文字段名；设置为 en 返回英文字段名。
      schema:
        type: string
        enum: [zh, en]
        default: zh
  examples:
    DocumentRecognitionFileBase64:
      summary: 使用文件 Base64
      value:
        file_base64: &documentRecognitionFileBase64 data:image/jpeg;base64,
        app_id: &documentRecognitionAppId ootb_k7m2x9p4v1n8w3q6r5t0y2b4
        model_params:
          recognize_config:
            recognize_mode: standard
            enable_highlight: 1
            enable_pdf_parse: false
            pdf_pic_second_parsing: false
            enable_stamp_recognition: false
    DocumentRecognitionFileUrl:
      summary: 使用文件 URL
      value:
        file_url: &documentRecognitionFileUrl https://adp.laiye.com/web/agentic_doc_processor/laiye/file/2003c711818811f1a36200163e358400
        app_id: *documentRecognitionAppId
        model_params:
          recognize_config:
            recognize_mode: standard
            enable_highlight: 1
            enable_pdf_parse: true
            pdf_pic_second_parsing: false
            enable_stamp_recognition: false
  requestBodies:
    DocumentFileRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentFileRequest'
          examples:
            fileUrl:
              $ref: '#/components/examples/DocumentRecognitionFileUrl'
            fileBase64:
              $ref: '#/components/examples/DocumentRecognitionFileBase64'
    DocumentExtractRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentExtractRequest'
          examples:
            fileUrl:
              value:
                app_id: app_abc123
                file_url: https://adp.laiye.com/web/agentic_doc_processor/laiye/file/2003c711818811f1a36200163e358400
                with_rec_result: false
            fileBase64:
              value:
                app_id: app_abc123
                file_base64: JVBERi0xLjQKJcfs...
                with_rec_result: true
    AppIdRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppIdRequest'
          examples:
            standardCustomExtractionApp:
              summary: 删除标准版自定义抽取应用
              value:
                app_id: app_abc123
            highSpeedCustomExtractionApp:
              summary: 删除高速版自定义抽取应用
              value:
                app_id: app_1425
    AppVersionDeleteRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppVersionDeleteRequest'
          examples:
            highSpeedConfigVersion:
              summary: 删除高速版自定义抽取应用配置版本
              value:
                app_id: app_1425
                config_version: v2
    ExtractionAppCreateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExtractionAppCreateRequest'
          examples:
            standardCustomExtractionApp:
              summary: 创建标准版自定义抽取应用
              value:
                ai_function: 1406
                app_name: 采购单抽取应用
                app_label: [purchase-order]
                extract_fields:
                  - field_name: 订单号
                    field_type: string
                    field_prompt: 抽取采购订单编号。
                  - field_name: 订单日期
                    field_type: date
                    field_prompt: 抽取订单日期。
                parse_mode: standard
                enable_highlight: 1
                enable_pdf_parse: false
                pdf_pic_second_parsing: false
                enable_stamp_recognition: false
                enable_long_doc: false
            highSpeedCustomExtractionApp:
              summary: 创建高速版自定义抽取应用
              value:
                ai_function: 1425
                app_name: 高速版发票抽取应用
                app_label: [invoice, high-speed]
                extract_fields:
                  - field_key: invoice_no
                    field_name: 发票号码
                    field_type: string
                    field_prompt: 抽取发票上的唯一发票号码。
                  - field_key: invoice_date
                    field_name: 开票日期
                    field_type: date
                    field_prompt: 抽取发票开具日期。
                  - field_key: line_items
                    field_name: 明细
                    field_type: table
                    sub_fields:
                      - field_key: item_name
                        field_name: 商品名称
                        field_type: string
                      - field_key: item_date
                        field_name: 日期
                        field_type: date
                enable_field_value_translation: false
    ExtractionAppUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExtractionAppUpdateRequest'
          examples:
            standardCustomExtractionApp:
              summary: 修改标准版自定义抽取应用
              value:
                app_id: app_1406
                app_name: 采购单抽取应用（新版）
                config_version: v1
                app_label: [purchase-order]
                extract_fields:
                  - field_name: 订单号
                    field_type: string
                    field_prompt: 抽取采购订单编号。
                  - field_name: 供应商名称
                    field_type: string
                    field_prompt: 抽取供应商名称。
                parse_mode: fast_vlm
                enable_highlight: 1
                enable_pdf_parse: true
                pdf_pic_second_parsing: false
                enable_stamp_recognition: true
                enable_long_doc: false
            highSpeedCustomExtractionApp:
              summary: 修改高速版自定义抽取应用
              value:
                app_id: app_1425
                app_name: 高速版发票抽取应用（新版）
                config_version: v1
                app_label: [invoice, high-speed]
                extract_fields:
                  - field_key: invoice_no
                    field_name: 发票号码
                    field_type: string
                    field_prompt: 抽取发票上的唯一发票号码。
                  - field_key: invoice_date
                    field_name: 开票日期
                    field_type: date
                    field_prompt: 抽取发票开具日期。
                  - field_key: total_amount
                    field_name: 价税合计
                    field_type: string
                    field_prompt: 抽取发票价税合计金额。
                  - field_key: line_items
                    field_name: 明细
                    field_type: table
                    sub_fields:
                      - field_key: item_name
                        field_name: 商品名称
                        field_type: string
                      - field_key: item_amount
                        field_name: 金额
                        field_type: string
                enable_field_value_translation: false
    AppConfigQueryRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppConfigQueryRequest'
          examples:
            highSpeedConfig:
              summary: 查询高速版自定义抽取应用配置
              value:
                app_id: app_1425
            highSpeedConfigVersion:
              summary: 查询高速版指定配置版本
              value:
                app_id: app_1425
                config_version: v1
    AiRecommendRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AiRecommendRequest'
          examples:
            standardCustomExtractionApp:
              summary: 标准版自定义抽取应用生成字段提示词
              value:
                app_id: app_1406
                prompt: 请从发票中抽取发票号码、开票日期和价税合计。
            highSpeedCustomExtractionApp:
              summary: 高速版自定义抽取应用自动生成配置预览
              value:
                app_id: app_1425
                file_url: https://adp.laiye.com/web/agentic_doc_processor/laiye/file/2003c711818811f1a36200163e358400
                prompt: 请根据票据版面生成字段配置，字段 key 使用英文下划线命名。
    DocFlowRunRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocFlowRunRequest'
          example:
            application_id: app_abc123
            inputs:
              query: 请帮我分析这份采购单
            files:
              - url: https://adp.laiye.com/web/agentic_doc_processor/laiye/file/2003c711818811f1a36200163e358400
                name: 采购单.pdf
                mime_type: application/pdf
    DocFlowCancelRunRequest:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocFlowCancelRunRequest'
          example:
            reason: 用户主动取消
    DocumentConvertRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentConvertRequest'
          examples:
            fileUrl:
              value:
                file_url: https://example.com/invoice.pdf
                scale: 1
                first_convert_page: 1
                last_convert_page: 5
                result_mode: url
            fileBase64:
              value:
                file_base64: JVBERi0xLjQKJcfs...
                result_mode: base64
    DocumentConvertAsyncRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentConvertAsyncRequest'
          example:
            file_url: https://example.com/long-document.pdf
            first_convert_page: 1
            last_convert_page: 20
    WebhookCreateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookCreateRequest'
          example:
            webhook_url: https://hooks.example.com/adp
            event_types: [doc_extract_completed]
            app_id: [app_abc123]
    WebhookUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookUpdateRequest'
          example:
            webhook_id: webhook_abc123
            event_types: [doc_parse_completed, doc_extract_completed]
    WebhookDeleteRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookDeleteRequest'
          example:
            webhook_id: webhook_abc123
    WebhookLogQueryRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookLogQueryRequest'
          example:
            webhook_id: webhook_abc123
            start_time: '2026-08-01 00:00:00'
            end_time: '2026-08-02 00:00:00'
            page: 1
            page_size: 20
    WorkflowRunExportRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkflowRunExportRequest'
          example:
            application_id: app_abc123
            run_ids: [run_xyz789]
            format: excel
            report_mode: merged
            include_failed_runs: false
            max_text_length: 10000
  responses:
    SimpleResponse:
      description: 通用响应。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleResponse'
          example:
            code: success
            message: success
    ValidationError:
      description: 参数校验错误。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPValidationError'
          example:
            detail:
              - type: greater_than
                loc: [query, limit]
                msg: Input should be greater than 0
                input: 0
                ctx:
                  gt: 0
    TaskCreateResponse:
      description: 任务创建结果。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SimpleResponse'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      task_id:
                        type: string
                      metadata:
