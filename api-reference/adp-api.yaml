      description: 根据历史运行记录重新触发一次工作流运行。接口会复用原运行的应用、版本和输入，并创建新的异步运行任务。
      operationId: rerunDocFlowRunTask
      security:
        - EngineApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          $ref: '#/components/responses/DocFlowRunResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_engine/laiye/v1/app/run/{run_id}/cancel:
    post:
      tags: [工作流]
      summary: 取消工作流运行
      description: 取消等待中、运行中或已暂停的工作流运行。已成功、失败、已取消或超时的运行不能取消。
      operationId: cancelDocFlowRunTask
      security:
        - EngineApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        $ref: '#/components/requestBodies/DocFlowCancelRunRequest'
      responses:
        '200':
          $ref: '#/components/responses/DocFlowRunResponse'
