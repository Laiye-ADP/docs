              type: number
            ocr_min_confidence:
              type: number
            is_overall_confidence:
              type: integer
    Point:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
    ExtractionField:
      type: object
      additionalProperties: true
      properties:
        field_key:
          type: string
        field_name:
          type: string
        field_values:
          type: array
          items:
            type: object
            additionalProperties: true
        references:
          type: array
          items:
            type: object
            additionalProperties: true
        table_values:
          type: array
          items:
            type: array
            items:
              type: object
              additionalProperties: true
    ExtractionFieldConfig:
      type: object
      additionalProperties: false
      properties:
        field_key:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
          description: 字段唯一标识。创建高速版自定义抽取应用时必填；标准版不要求传入。
        field_name:
          type: string
          minLength: 1
          maxLength: 50
          description: 字段名称。
        field_type:
          type: string
          enum: [string, date, table]
          description: 字段类型。表格字段使用 table。
        field_prompt:
          type: string
          description: 字段抽取提示词。
        sub_fields:
          type: array
          minItems: 1
          maxItems: 20
          description: 表格子字段。field_type 为 table 时必须至少提供 1 个有效子字段。
          items:
            $ref: '#/components/schemas/ExtractionSubFieldConfig'
      required: [field_name, field_type]
    ExtractionSubFieldConfig:
      type: object
      additionalProperties: false
      properties:
        field_key:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
          description: 子字段唯一标识。创建高速版自定义抽取应用时必填；标准版不要求传入。
        field_name:
          type: string
          minLength: 1
          maxLength: 50
          description: 子字段名称。
        field_type:
          type: string
          enum: [string, date]
          description: 子字段类型。表格内不允许再嵌套表格。
        field_prompt:
          type: string
          description: 子字段抽取提示词。
      required: [field_name, field_type]
    LongDocConfig:
      type: object
      additionalProperties: false
      properties:
        doc_type:
          type: string
          description: 文档类型。
        doc_desc:
          type: string
          description: 文档类型描述。
      required: [doc_type]
    ExtractionAppCreateRequest:
      description: 先设置 ai_function。ai_function 为 1406 时使用标准版自定义抽取应用参数；为 1425 时使用高速版自定义抽取应用参数。
      discriminator:
        propertyName: ai_function
        mapping:
          '1406': '#/components/schemas/StandardExtractionAppCreateRequest'
          '1425': '#/components/schemas/HighSpeedExtractionAppCreateRequest'
      oneOf:
        - $ref: '#/components/schemas/StandardExtractionAppCreateRequest'
        - $ref: '#/components/schemas/HighSpeedExtractionAppCreateRequest'
    StandardExtractionAppCreateRequest:
      type: object
      additionalProperties: false
      title: 创建标准版自定义抽取应用
      properties:
        ai_function:
          type: integer
          enum: [1406]
          default: 1406
          description: 应用类型。创建标准自定义抽取应用传 1406；不传时默认按 1406 处理。
        app_name:
          type: string
          minLength: 1
          maxLength: 100
          description: 应用名称。
        app_label:
          type: array
          maxItems: 5
          description: 应用标签列表，最多 5 个。
          items:
            type: string
        extract_fields:
          type: array
          minItems: 1
          maxItems: 20
          description: 抽取字段配置列表，最多 20 个字段。
          items:
            $ref: '#/components/schemas/ExtractionFieldConfig'
        parse_mode:
          type: string
          enum: [standard, advance, agentic, fast_vlm, agentic_v2]
          description: |
            解析模式。标准版自定义抽取应用必填。可选解析模式如下：

            - standard：标准解析，适用于清晰的电子版文档，速度和准确率均衡。
            - advance：增强解析 1.0，适用于印章、签名、多表格等版式较复杂的文档。
            - agentic：智能解析，组合标准解析与增强解析，并按条件进行二次解析。
            - fast_vlm：增强解析 2.0，适用于复杂版式、扫描件、多表格等文档，提升解析稳定性。
            - agentic_v2：智能解析 2.0，采用两阶段版面分析与内容识别，适用于复杂版式、表格和公式文档。
        enable_highlight:
          type: integer
          enum: [0, 1]
          default: 1
          description: 是否显示来源位置。传 1 开启，传 0 关闭；standard、agentic、fast_vlm、agentic_v2 支持，advance 不支持。
        enable_pdf_parse:
          type: boolean
          default: false
          description: 是否开启 PDF 文本优先。适合可复制文字的电子 PDF，可提升处理速度和文字稳定性。
        pdf_pic_second_parsing:
          type: boolean
          default: false
          description: 开启 PDF 文本优先时，是否对 PDF 中的图片进行二次解析。
        enable_stamp_recognition:
          type: boolean
          default: false
          description: 是否开启印章识别。开启后会尝试识别文档中的印章信息，需要印章识别能力授权。
        enable_field_value_translation:
          type: boolean
          default: false
          description: 是否开启抽取结果翻译，默认关闭。
        enable_long_doc:
          type: boolean
          default: false
          description: 是否开启长文档支持。
        long_doc_config:
          type: array
          maxItems: 5
          description: 长文档配置，仅 enable_long_doc 为 true 时使用。
          items:
            $ref: '#/components/schemas/LongDocConfig'
      required: [ai_function, app_name, extract_fields, parse_mode]
    HighSpeedExtractionAppCreateRequest:
      type: object
      additionalProperties: false
      title: 创建高速版抽取应用
      properties:
        ai_function:
          type: integer
          enum: [1425]
          default: 1425
          description: 应用类型。创建高速版自定义抽取应用固定传 1425。
        app_name:
          type: string
          minLength: 1
          maxLength: 100
          description: 应用名称。
        app_label:
          type: array
          maxItems: 5
          description: 应用标签列表，最多 5 个。
          items:
            type: string
        extract_fields:
          type: array
          minItems: 1
          maxItems: 50
          description: 高速版抽取字段配置列表，最多 50 个字段。每个字段都需要提供 field_key。
          items:
            $ref: '#/components/schemas/HighSpeedExtractionFieldConfig'
        enable_field_value_translation:
          type: boolean
          default: false
          description: 是否开启抽取结果翻译，默认关闭。
      required: [ai_function, app_name, extract_fields]
    HighSpeedExtractionFieldConfig:
      type: object
      additionalProperties: false
      title: 高速版字段
      description: 高速版字段配置。普通字段的 field_type 为 string 或 date，不要传 sub_fields；表格字段的 field_type 为 table，必须传 sub_fields。
      properties:
        field_key:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
          description: 字段唯一标识。必须以英文字母开头，只能包含英文字母、数字和下划线，最多 64 个字符。
        field_name:
          type: string
          minLength: 1
          maxLength: 50
          description: 字段名称。
        field_type:
          type: string
          enum: [string, date, table]
          description: 字段类型。普通字段使用 string 或 date；表格字段使用 table。
        field_prompt:
          type: string
          maxLength: 200
          description: 字段抽取提示词。
        sub_fields:
          type: array
          maxItems: 30
          description: 表格子字段。仅 field_type 为 table 时填写，且必须至少提供 1 个有效子字段；普通字段不要传该参数。
          items:
            $ref: '#/components/schemas/HighSpeedExtractionSubFieldConfig'
          examples:
            - - field_key: item_name
                field_name: 商品名称
                field_type: string
      required: [field_key, field_name, field_type]
      allOf:
        - if:
            properties:
              field_type:
                const: table
            required: [field_type]
          then:
            required: [sub_fields]
            properties:
              sub_fields:
                minItems: 1
    HighSpeedExtractionSubFieldConfig:
      type: object
      additionalProperties: false
      properties:
        field_key:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
          description: 子字段唯一标识。必须以英文字母开头，只能包含英文字母、数字和下划线，最多 64 个字符。
        field_name:
          type: string
          minLength: 1
          maxLength: 50
          description: 子字段名称。
        field_type:
          type: string
          enum: [string, date]
          description: 子字段类型。表格内不允许再嵌套表格。
        field_prompt:
          type: string
          maxLength: 200
          description: 子字段抽取提示词。
      required: [field_key, field_name, field_type]
    ExtractionAppUpdateRequest:
      oneOf:
        - $ref: '#/components/schemas/StandardExtractionAppUpdateRequest'
        - $ref: '#/components/schemas/HighSpeedExtractionAppUpdateRequest'
    StandardExtractionAppUpdateRequest:
      type: object
      additionalProperties: false
      title: 修改标准版自定义抽取应用
      properties:
        app_id:
          type: string
          description: 应用 ID。
        app_name:
          type: string
          description: 应用名称。不传或传空字符串时不更新应用名称。
        config_version:
          type: string
          description: 当前配置版本。修改后会另存为新版本。
        app_label:
          type: array
          maxItems: 5
          description: 应用标签列表，最多 5 个。
          items:
            type: string
        extract_fields:
          type: array
          maxItems: 20
          description: 抽取字段配置列表，最多 20 个字段。
          items:
            $ref: '#/components/schemas/ExtractionFieldConfig'
        parse_mode:
          type: string
          enum: [standard, advance, agentic, fast_vlm, agentic_v2]
          description: |
            解析模式。标准版自定义抽取应用必填；高速版自定义抽取应用不支持设置该参数。可选解析模式如下：

            - standard：标准解析，适用于清晰的电子版文档，速度和准确率均衡。
            - advance：增强解析 1.0，适用于印章、签名、多表格等版式较复杂的文档。
            - agentic：智能解析，组合标准解析与增强解析，并按条件进行二次解析。
            - fast_vlm：增强解析 2.0，适用于复杂版式、扫描件、多表格等文档，提升解析稳定性。
            - agentic_v2：智能解析 2.0，采用两阶段版面分析与内容识别，适用于复杂版式、表格和公式文档。
        enable_highlight:
          type: integer
          enum: [0, 1]
          default: 1
          description: 是否显示来源位置。传 1 开启，传 0 关闭；standard、agentic、fast_vlm、agentic_v2 支持，advance 不支持。
        enable_pdf_parse:
          type: boolean
          default: false
          description: 是否开启 PDF 文本优先。适合可复制文字的电子 PDF，可提升处理速度和文字稳定性。
        pdf_pic_second_parsing:
          type: boolean
          default: false
          description: 开启 PDF 文本优先时，是否对 PDF 中的图片进行二次解析。
        enable_stamp_recognition:
          type: boolean
          default: false
          description: 是否开启印章识别。开启后会尝试识别文档中的印章信息，需要印章识别能力授权。
        enable_field_value_translation:
          type: boolean
          default: false
          description: 是否开启抽取结果翻译，默认关闭。
        enable_long_doc:
          type: boolean
          default: false
          description: 是否开启长文档支持。标准版自定义抽取应用支持该参数；高速版自定义抽取应用不支持该参数的设置。
        long_doc_config:
          type: array
          maxItems: 5
          description: 长文档配置，仅 enable_long_doc 为 true 时使用。
          items:
            $ref: '#/components/schemas/LongDocConfig'
      required: [app_id, extract_fields, parse_mode]
    HighSpeedExtractionAppUpdateRequest:
      type: object
      additionalProperties: false
      title: 修改高速版抽取应用
      properties:
        app_id:
          type: string
          description: 高速版自定义抽取应用 ID。
        app_name:
          type: string
          description: 应用名称。不传或传空字符串时不更新应用名称。
        config_version:
          type: string
          description: 当前配置版本。修改后会另存为新版本。
        app_label:
          type: array
          maxItems: 5
          description: 应用标签列表，最多 5 个。
          items:
            type: string
        extract_fields:
          type: array
          minItems: 1
          maxItems: 50
          description: 高速版抽取字段配置列表，最多 50 个字段。每个字段都需要提供 field_key。
          items:
            $ref: '#/components/schemas/HighSpeedExtractionFieldConfig'
        enable_field_value_translation:
          type: boolean
          default: false
          description: 是否开启抽取结果翻译，默认关闭。
      required: [app_id, extract_fields]
    AppIdRequest:
      type: object
      additionalProperties: false
      properties:
        app_id:
          type: string
          description: 应用 ID。删除高速版自定义抽取应用时，传入高速版应用的 app_id。
      required: [app_id]
    AppVersionDeleteRequest:
      type: object
      additionalProperties: false
      properties:
        app_id:
          type: string
          description: 应用 ID。删除高速版自定义抽取应用配置时，传入高速版应用的 app_id。
        config_version:
          type: string
          description: 要删除的配置版本。
      required: [app_id, config_version]
    AppConfigQueryRequest:
      type: object
      additionalProperties: false
      properties:
        app_id:
          type: string
          description: 应用 ID。查询高速版自定义抽取应用配置时，传入高速版应用的 app_id。
        config_version:
          type: string
          description: 配置版本。可选，默认返回最新版本。
      required: [app_id]
    AiRecommendRequest:
      type: object
      additionalProperties: false
      description: 智能体生成字段配置请求。标准版应用至少提供 prompt、file_url 或 file_base64 之一；高速版应用仍必须提供 file_url 或 file_base64，prompt 只作为辅助说明。应用类型由 app_id 对应的应用决定，因此 OpenAPI 无法仅根据请求字段进一步区分两种条件约束。
      properties:
        app_id:
          type: string
          description: 应用 ID。传入高速版自定义抽取应用时，返回高速版自动生成配置预览。
        file_base64:
          type: string
          description: 文件 Base64 编码。高速版应用与 file_url 二选一必填。
        file_url:
          type: string
          format: uri
          description: 文件 URL。高速版应用与 file_base64 二选一必填。
        prompt:
          type: string
          description: 用户提供的生成提示。标准版可只传 prompt；高速版需要同时提供文件。
        doc_type:
          type: string
          description: 文档类型。标准版自动生成建议时可传入；高速版会根据文档自动识别。
        doc_type_description:
          type: string
          description: 文档类型描述。标准版自动生成建议时可传入。
      required: [app_id]
      anyOf:
        - required: [prompt]
        - required: [file_base64]
        - required: [file_url]
