        - billable_pages
      properties:
        trace_id:
          type: string
          description: 链路追踪 ID；排查问题时应随工单提供。
        attempt_verify_page_count:
          type: integer
          enum: [0, 1]
          description: 要素完整并尝试调用查验服务的票据数。
        actual_consume_page_count:
          type: integer
          enum: [0, 1]
          description: |
