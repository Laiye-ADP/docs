openapi: 3.1.0
info:
  title: 国内通用票据
  version: 1.1.0
  description: ADP 预置应用接口，适用于国内通用票据抽取场景。
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://adp.laiye.com
    description: ADP 生产环境
tags:
  - name: 国内通用票据抽取
    description: 抽取国内通用票据字段。
  - name: 国内发票验真
    description: 根据发票要素查验国内发票。
paths:
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract:
    post:
      tags: [国内通用票据抽取]
      summary: 国内通用票据抽取（同步接口）
      description: 针对国内通用票据文件进行字段抽取。传入 enable_invoice_verify=true 可为本次抽取开启发票验真；不传时使用应用已保存的配置。可验真的发票会在抽取字段中返回验真结果、验真报错信息和作废标志。
      operationId: extractDomesticBill
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/DocumentExtractRequest'
      responses:
        '200':
          $ref: '#/components/responses/DocumentExtractResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract/create/task:
    post:
      tags: [国内通用票据抽取]
      summary: 创建国内通用票据抽取异步任务
      description: 创建国内通用票据抽取任务，并立即返回 task_id。适用于大文件或处理时间较长的任务。
      operationId: createDomesticBillExtractTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/DocumentExtractRequest'
      responses:
        '200':
          $ref: '#/components/responses/TaskCreateResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract/query/task/{task_id}:
    get:
      tags: [国内通用票据抽取]
      summary: 查询国内通用票据抽取任务结果
      description: 根据 task_id 查询国内通用票据抽取任务状态和结果。
      operationId: queryDomesticBillExtractTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          $ref: '#/components/responses/DocumentExtractResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/invoice/verify:
    post:
      tags: [国内发票验真]
      summary: 国内发票验真
      description: |
        根据票种及对应查验要素，对单张国内发票执行验真。

        **兼容规则**

        - 请求体保持扁平结构，不使用批量数组或嵌套 `verify_params`。
        - `type_key` 可省略；省略时固定按 `vat_electronic_invoice_new` 处理。
        - `fpNumber` 和 `fpDate` 是所有票种的公共要素，其余字段根据 `type_key` 条件必需。
        - 所有代码、号码、日期、金额和校验码均建议使用 JSON 字符串，避免前导零或数值精度丢失。
        - 不应通过字段组合推断票种；非默认票种必须显式传入 `type_key`。

        **票种要素矩阵**

        | type_key | 票种 | 必需字段 |
        | --- | --- | --- |
        | `vat_special_invoice` | 增值税专用发票 | `fpCode`, `fpNumber`, `fpDate`, `fpNoTaxAmount` |
        | `vat_electronic_special_invoice` | 增值税电子专用发票 | `fpCode`, `fpNumber`, `fpDate`, `fpNoTaxAmount` |
        | `vat_common_invoice` | 增值税普通发票 | `fpCode`, `fpNumber`, `fpDate`, `fpCRC` |
        | `vat_electronic_invoice` | 增值税电子普通发票 | `fpCode`, `fpNumber`, `fpDate`, `fpCRC` |
        | `vat_roll_invoice` | 增值税发票卷票 | `fpCode`, `fpNumber`, `fpDate`, `fpCRC` |
        | `vat_electronic_special_invoice_new` | 电子发票增值税专用发票 | `fpNumber`, `fpDate`, `fpAmount` |
        | `vat_electronic_invoice_new` | 电子发票普通发票 | `fpNumber`, `fpDate`, `fpAmount` |
        | `motor_vehicle_sale_invoice` | 机动车销售统一发票 | `fpCode`, `fpNumber`, `fpDate`, `fpNoTaxAmount` |
        | `used_car_purchase_invoice` | 二手车销售统一发票 | `fpCode`, `fpNumber`, `fpDate`, `fpAmount` |
        | `electronic_air_transport` | 电子发票航空运输电子客票行程单 | `fpNumber`, `fpDate`, `fpAmount` |
        | `electronic_train_ticket` | 电子发票铁路电子客票 | `fpNumber`, `fpDate`, `fpAmount` |

        **结果判断**

        HTTP 200 且 `code=success` 表示请求已被接口正常处理，不等同于发票验真成功。
        调用方必须读取 `data.result.fpVerification` 判断验真结果。
        条件要素缺失、下游查验失败等情况仍可能返回 HTTP 200，并在
        `fpVerification` 和 `fpVerificationMsg` 中给出业务结果。

        **计费元数据**

        `attempt_verify_page_count` 表示要素完整并尝试调用查验服务的票据数；本接口为单张验真，值为 0 或 1。
        `actual_consume_page_count` 表示命中计费状态的票据数，值为 0 或 1；
        实际积分消耗仍可能被功能包覆盖。
      operationId: verifyDomesticInvoice
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
      requestBody:
        $ref: '#/components/requestBodies/InvoiceVerifyRequest'
      responses:
        '200':
          $ref: '#/components/responses/InvoiceVerifyResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/TenantNotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: ADP OpenAPI 密钥。
  parameters:
    TenantName:
      name: tenant_name
      in: path
      required: true
      description: 租户名称。该路径参数必须显式提供。
      schema:
        type: string
      example: laiye
    TaskId:
      name: task_id
      in: path
      required: true
      description: 任务 ID。
      schema:
        type: string
  examples:
    DomesticBillsFileBase64:
      summary: 使用文件 Base64
      value:
        file_base64: &domesticBillsFileBase64 data:image/jpeg;base64,
        app_id: &domesticBillsAppId ootb_v9x2y5z8a1b4c7d0e3f6h9j1k4m7
        enable_invoice_verify: true
    DomesticBillsFileUrl:
      summary: 使用文件 URL
      value:
        file_url: &domesticBillsFileUrl https://adp.laiye.com/web/agentic_doc_processor/laiye/file/2003c711818811f1a36200163e358400
        app_id: *domesticBillsAppId
        enable_invoice_verify: true
    LegacyElectronicInvoiceRequest:
      summary: 兼容既有三字段调用
      description: 结构示例；省略 `type_key`，按电子发票普通发票处理。请替换为真实票面值。
      value:
        fpNumber: '23322000000000000000'
        fpDate: '2026-08-25'
        fpAmount: '106.00'
    VatSpecialInvoiceRequest:
      summary: 增值税专用发票
      value:
        type_key: vat_special_invoice
        fpCode: '044001900111'
        fpNumber: '12345678'
        fpDate: '2026-08-25'
        fpNoTaxAmount: '100.00'
    VatElectronicSpecialInvoiceRequest:
      summary: 增值税电子专用发票
      value:
        type_key: vat_electronic_special_invoice
        fpCode: '044001900111'
        fpNumber: '12345678'
        fpDate: '2026-08-25'
        fpNoTaxAmount: '100.00'
    VatCommonInvoiceRequest:
      summary: 增值税普通发票
      value:
        type_key: vat_common_invoice
        fpCode: '044001900111'
        fpNumber: '12345678'
        fpDate: '2026-08-25'
        fpCRC: '123456'
    VatElectronicInvoiceRequest:
      summary: 增值税电子普通发票
      value:
        type_key: vat_electronic_invoice
        fpCode: '044001900111'
        fpNumber: '12345678'
        fpDate: '2026-08-25'
        fpCRC: '123456'
    VatRollInvoiceRequest:
      summary: 增值税发票卷票
      value:
        type_key: vat_roll_invoice
        fpCode: '044001900111'
        fpNumber: '12345678'
        fpDate: '2026-08-25'
        fpCRC: '123456'
    VatElectronicSpecialInvoiceNewRequest:
      summary: 电子发票增值税专用发票
      value:
        type_key: vat_electronic_special_invoice_new
        fpNumber: '23322000000000000001'
        fpDate: '2026-08-25'
        fpAmount: '106.00'
    VatElectronicInvoiceNewRequest:
      summary: 电子发票普通发票
      value:
        type_key: vat_electronic_invoice_new
        fpNumber: '23322000000000000000'
        fpDate: '2026-08-25'
        fpAmount: '106.00'
    MotorVehicleSaleInvoiceRequest:
      summary: 机动车销售统一发票
      value:
        type_key: motor_vehicle_sale_invoice
        fpCode: '044001900111'
        fpNumber: '12345678'
        fpDate: '2026-08-25'
        fpNoTaxAmount: '100000.00'
    UsedCarPurchaseInvoiceRequest:
      summary: 二手车销售统一发票
      value:
        type_key: used_car_purchase_invoice
        fpCode: '044001900111'
        fpNumber: '12345678'
        fpDate: '2026-08-25'
        fpAmount: '80000.00'
    ElectronicAirTransportRequest:
      summary: 电子发票航空运输电子客票行程单
      value:
        type_key: electronic_air_transport
        fpNumber: '23322000000000000002'
        fpDate: '2026-08-25'
        fpAmount: '1280.00'
    ElectronicTrainTicketRequest:
      summary: 电子发票铁路电子客票
      value:
        type_key: electronic_train_ticket
        fpNumber: '23322000000000000003'
        fpDate: '2026-08-25'
        fpAmount: '553.00'
    VerifiedInvoiceResponse:
      summary: 验真成功且发票一致
      value:
        code: success
        message: ''
        tips: null
        data:
          result:
            type_key: vat_electronic_invoice_new
            instance_id: customer-order-001
            invoice_pdf_page_number: 1
            fpVerification: 查验成功发票一致
            fpVerificationMsg: ''
            fpIsVoided: 未作废
            fpType: 电子发票普通发票
            fpCode: null
            fpNumber: '23322000000000000000'
            fpDate: '2026-08-25'
            fpAmount: '106.00'
            fpNoTaxAmount: '100.00'
            fpTotalTaxAmount: '6.00'
            fpSellerName: 示例销售方有限公司
            fpSellerID: '91310000XXXXXXXXXX'
            fpPayerName: 示例购买方有限公司
            fpPayerID: '91320000XXXXXXXXXX'
            fpRemarks: ''
            fpItems:
              - itemName: 技术服务
                itemModel: null
                itemUnit: 次
                itemQuantity: '1'
                itemUnitPrice: '100.00'
                itemAmount: '100.00'
                itemTaxRate: '6%'
                itemTaxAmount: '6.00'
          metadata:
            trace_id: 94fe9b74e0e311f091505e345594c618
            attempt_verify_page_count: 1
            actual_consume_page_count: 1
            billable_pages: [1]
    MissingRequiredElementResponse:
      summary: 票种条件要素缺失
      description: 业务未完成验真，但兼容 v1 行为仍返回 HTTP 200 和 `code=success`。
      value:
        code: success
        message: ''
        tips: null
        data:
          result:
            type_key: vat_special_invoice
            instance_id: vat_special_invoice_0
            invoice_pdf_page_number: 1
            fpVerification: 未能查验
            fpVerificationMsg: 增值税专用发票 识别结果缺少查验必须字段 不含税金额
            fpIsVoided: ''
          metadata:
            trace_id: 94fe9b74e0e311f091505e345594c619
            attempt_verify_page_count: 0
            actual_consume_page_count: 0
            billable_pages: []
    FrameworkBusinessErrorResponse:
      summary: 框架级业务错误
      description: 当前 v1 兼容框架可能以 HTTP 200 返回非 `success` 接口错误。
      value:
        code: http_server_error
        message: 业务处理失败
        tips: null
  requestBodies:
    DocumentExtractRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentExtractRequest'
          examples:
            fileUrl:
              $ref: '#/components/examples/DomesticBillsFileUrl'
            fileBase64:
              $ref: '#/components/examples/DomesticBillsFileBase64'
    InvoiceVerifyRequest:
      required: true
      description: 单张发票验真要素。所有示例仅用于说明请求结构，请替换为真实票面值。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvoiceVerifyRequest'
          examples:
            legacyElectronicInvoice:
              $ref: '#/components/examples/LegacyElectronicInvoiceRequest'
            vatSpecialInvoice:
              $ref: '#/components/examples/VatSpecialInvoiceRequest'
            vatElectronicSpecialInvoice:
              $ref: '#/components/examples/VatElectronicSpecialInvoiceRequest'
            vatCommonInvoice:
              $ref: '#/components/examples/VatCommonInvoiceRequest'
            vatElectronicInvoice:
              $ref: '#/components/examples/VatElectronicInvoiceRequest'
            vatRollInvoice:
              $ref: '#/components/examples/VatRollInvoiceRequest'
            vatElectronicSpecialInvoiceNew:
              $ref: '#/components/examples/VatElectronicSpecialInvoiceNewRequest'
            vatElectronicInvoiceNew:
              $ref: '#/components/examples/VatElectronicInvoiceNewRequest'
            motorVehicleSaleInvoice:
              $ref: '#/components/examples/MotorVehicleSaleInvoiceRequest'
            usedCarPurchaseInvoice:
              $ref: '#/components/examples/UsedCarPurchaseInvoiceRequest'
            electronicAirTransport:
              $ref: '#/components/examples/ElectronicAirTransportRequest'
            electronicTrainTicket:
              $ref: '#/components/examples/ElectronicTrainTicketRequest'
  responses:
    DocumentExtractResponse:
      description: 抽取结果。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentExtractResponse'
          examples:
            invoiceVerification:
              summary: 包含发票验真字段的抽取结果
              value:
                code: success
                message: ''
                tips: null
                data:
                  task_id: ''
                  file_url: ''
                  status: 4
                  extraction_result:
                    - field_key: vat_electronic_special_invoice_new
                      field_name: 电子发票增值税专用发票
                      object_values:
                        - document_type: vat_electronic_special_invoice_new
                          pages: [0]
                          extraction_result:
                            - field_key: fpVerification
                              field_name: 查验结果
                              field_values:
                                - field_value: ''
                                  confidence: 0.0
                            - field_key: fpVerificationMsg
                              field_name: 查验报错信息
                              field_values:
                                - field_value: ''
                                  confidence: 0.0
                            - field_key: fpIsVoided
                              field_name: 作废标志
                              field_values:
                                - field_value: ''
                                  confidence: 0.0
    InvoiceVerifyResponse:
      description: |
        请求处理结果。`code=success` 仅表示接口处理完成；发票验真结论以
        `data.result.fpVerification` 为准。
      headers:
        X-Process-Time:
          $ref: '#/components/headers/ProcessTime'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvoiceVerifyResponse'
          examples:
            verifiedInvoice:
              $ref: '#/components/examples/VerifiedInvoiceResponse'
            missingRequiredElement:
              $ref: '#/components/examples/MissingRequiredElementResponse'
            frameworkBusinessError:
              $ref: '#/components/examples/FrameworkBusinessErrorResponse'
    TaskCreateResponse:
      description: 任务创建结果。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskCreateResponse'
    BusinessError:
      description: 业务参数错误。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleResponse'
    ValidationError:
      description: 请求体、路径参数或字段类型校验失败。
      headers:
        X-Process-Time:
          $ref: '#/components/headers/ProcessTime'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPValidationError'
          example:
            detail:
              - type: missing
                loc: [body, fpNumber]
                msg: Field required
                input:
                  fpDate: '2026-08-25'
                  fpAmount: '100.00'
    UnauthorizedError:
      description: 未提供有效的 OpenAPI 密钥。
      headers:
        X-Process-Time:
          $ref: '#/components/headers/ProcessTime'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
          example:
            detail: Invalid API Key
    TenantNotFoundError:
      description: 路径中的租户不存在。
      headers:
        X-Process-Time:
          $ref: '#/components/headers/ProcessTime'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
          example:
            detail: Tenant invalid-tenant not found
    InternalServerError:
      description: 未处理的服务端异常。
      headers:
        X-Process-Time:
          $ref: '#/components/headers/ProcessTime'
      content:
        text/plain:
          schema:
            type: string
          example: Internal server error
  schemas:
    DocumentExtractRequest:
      oneOf:
        - title: 使用文件 URL
          type: object
          additionalProperties: false
          properties:
            file_url:
              default: *domesticBillsFileUrl
              type: string
              format: uri
              description: 待抽取文件 URL，与 file_base64 二选一。
            file_name:
              type: string
              description: 文件名称。使用 Base64 或无法从 URL 判断文件名时可传入。
            app_id:
              default: *domesticBillsAppId
              type: string
              description: 国内通用票据预置应用的唯一标识。
            enable_invoice_verify:
              type: boolean
              description: 是否为本次国内通用票据抽取开启发票验真。true 开启，false 关闭；不传则使用应用已保存配置。
          required: [app_id, file_url]
        - title: 使用文件 Base64
          type: object
          additionalProperties: false
          properties:
            file_base64:
              default: *domesticBillsFileBase64
              type: string
              description: 待抽取文件 Base64，与 file_url 二选一。
            file_name:
              type: string
              description: 文件名称。使用 Base64 或无法从 URL 判断文件名时可传入。
            app_id:
              default: *domesticBillsAppId
              type: string
              description: 国内通用票据预置应用的唯一标识。
            enable_invoice_verify:
              type: boolean
              description: 是否为本次国内通用票据抽取开启发票验真。true 开启，false 关闭；不传则使用应用已保存配置。
          required: [app_id, file_base64]
    SimpleResponse:
      type: object
      additionalProperties: true
      required: [code, message, tips]
      properties:
        code:
          oneOf:
            - type: string
            - type: integer
          description: |
            接口处理代码。正常进入验真业务流程时为 `success`；
            `success` 不等同于发票验真成功。
        message:
          type: string
          description: 接口级消息。
        tips:
          type: [string, 'null']
          description: 可选提示信息。
    HTTPValidationError:
      type: object
      additionalProperties: true
      required: [detail]
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
    ValidationErrorItem:
      type: object
      additionalProperties: true
      required: [type, loc, msg]
      properties:
        type:
          type: string
          description: 校验错误类型。
        loc:
          type: array
          description: 错误字段位置。
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
          description: 错误信息。
        input:
          description: 导致校验错误的输入值。
        ctx:
          type: object
          additionalProperties: true
          description: 可选校验上下文。
    TaskCreateResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                task_id:
                  type: string
                metadata:
                  type: object
                  additionalProperties: true
                  description: 文档处理任务元数据。
    InvoiceVerifyRequest:
      description: 按发票票种选择请求模型。选择 type_key 后，接口文档仅展示该票种需要的查验字段；既有调用可选择兼容模式并省略 type_key。
      oneOf:
        - $ref: '#/components/schemas/LegacyInvoiceVerifyRequest'
        - $ref: '#/components/schemas/VatSpecialInvoiceVerifyRequest'
        - $ref: '#/components/schemas/VatElectronicSpecialInvoiceVerifyRequest'
        - $ref: '#/components/schemas/VatCommonInvoiceVerifyRequest'
        - $ref: '#/components/schemas/VatElectronicInvoiceVerifyRequest'
        - $ref: '#/components/schemas/VatRollInvoiceVerifyRequest'
        - $ref: '#/components/schemas/VatElectronicSpecialInvoiceNewVerifyRequest'
        - $ref: '#/components/schemas/VatElectronicInvoiceNewVerifyRequest'
        - $ref: '#/components/schemas/MotorVehicleSaleInvoiceVerifyRequest'
        - $ref: '#/components/schemas/UsedCarPurchaseInvoiceVerifyRequest'
        - $ref: '#/components/schemas/ElectronicAirTransportVerifyRequest'
        - $ref: '#/components/schemas/ElectronicTrainTicketVerifyRequest'
      discriminator:
        propertyName: type_key
        mapping:
          vat_special_invoice: '#/components/schemas/VatSpecialInvoiceVerifyRequest'
          vat_electronic_special_invoice: '#/components/schemas/VatElectronicSpecialInvoiceVerifyRequest'
          vat_common_invoice: '#/components/schemas/VatCommonInvoiceVerifyRequest'
          vat_electronic_invoice: '#/components/schemas/VatElectronicInvoiceVerifyRequest'
