    InvoiceVerifyResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              oneOf:
                - $ref: '#/components/schemas/InvoiceVerifyData'
                - type: 'null'
              description: |
                正常进入业务流程时返回验真数据；框架级业务错误时可能为空或不返回。
    InvoiceVerifyResult:
      type: object
      additionalProperties: true
      description: |
        单张发票验真结果。查验服务可能随票种返回额外权威字段；调用方应只依赖
        本契约明确声明的稳定字段，并忽略未知字段。
      properties:
        type_key:
          type: [string, 'null']
          description: 请求采用的发票票种标识。
        instance_id:
          type: [string, 'null']
          description: 客户传入或服务端生成的业务侧实例 ID。
        invoice_pdf_page_number:
          type: [integer, 'null']
          description: 票据页码。独立单张验真固定为 1。
          minimum: 1
        fpVerification:
          type: [string, 'null']
          description: |
            验真业务状态。已知值包括 `查验成功发票一致`、`查验成功发票不一致`、
            `发票不存在`、`未能查验`、`不支持查验` 和 `未知`。
        fpVerificationMsg:
          type: [string, 'null']
          description: 验真提示、要素缺失说明或下游错误信息。
        fpIsVoided:
          type: [string, 'null']
          enum: [已作废, 未作废, '', null]
          description: 作废状态；无法判断时为空字符串或 null。
        fpType:
          type: [string, 'null']
          description: 查验服务返回的票种中文名称。
        fpCode:
          type: [string, 'null']
          description: 发票代码。
        fpNumber:
          type: [string, 'null']
          description: 发票号码。
        fpDate:
          type: [string, 'null']
          description: 开票日期、填制日期或乘车日期。
        fpAmount:
          type: [string, 'null']
          description: 价税合计、合计金额或票价。
        fpNoTaxAmount:
          type: [string, 'null']
          description: 不含税金额。
        fpTotalTaxAmount:
          type: [string, 'null']
          description: 税额合计。
        fpSellerName:
          type: [string, 'null']
          description: 销售方名称。
        fpSellerID:
          type: [string, 'null']
          description: 销售方纳税人识别号。
        fpPayerName:
          type: [string, 'null']
          description: 购买方名称。
        fpPayerID:
          type: [string, 'null']
          description: 购买方纳税人识别号。
        fpRemarks:
          type: [string, 'null']
          description: 发票备注。
        fpItems:
          type: [array, 'null']
          description: 发票商品或服务明细。
          items:
            $ref: '#/components/schemas/InvoiceVerifyItem'
