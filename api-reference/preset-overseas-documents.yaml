openapi: 3.1.0
info:
  title: 海外发票和收据
  version: 1.0.0
  description: ADP 预置应用接口，适用于海外发票和收据抽取场景。
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://adp.laiye.com
    description: ADP 生产环境
tags:
  - name: 海外发票和收据抽取
    description: 抽取海外发票和收据字段。
paths:
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract:
    post:
      tags: [海外发票和收据抽取]
      summary: 海外发票和收据抽取（同步接口）
      description: 针对海外发票和收据文件进行字段抽取。返回字段由预置应用配置决定。
      operationId: extractOverseasDocuments
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        $ref: '#/components/requestBodies/DocumentExtractRequest'
      responses:
        '200':
          $ref: '#/components/responses/DocumentExtractResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract/create/task:
    post:
      tags: [海外发票和收据抽取]
      summary: 创建海外发票和收据抽取异步任务
      description: 创建海外发票或收据抽取任务，并立即返回 task_id。
      operationId: createOverseasDocumentExtractTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        $ref: '#/components/requestBodies/DocumentExtractRequest'
      responses:
        '200':
          $ref: '#/components/responses/TaskCreateResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /open/agentic_doc_processor/{tenant_name}/v1/app/doc/extract/query/task/{task_id}:
    get:
      tags: [海外发票和收据抽取]
      summary: 查询海外发票和收据抽取任务结果
      description: 根据 task_id 查询海外发票或收据抽取任务结果。
      operationId: queryOverseasDocumentExtractTask
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantName'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          $ref: '#/components/responses/DocumentExtractResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
  parameters:
    TenantName:
      name: tenant_name
      in: path
      required: true
      description: 租户名称，默认 laiye。
      schema:
        type: string
        default: laiye
    TaskId:
      name: task_id
      in: path
      required: true
      description: 任务 ID。
      schema:
        type: string
    AcceptLanguage:
      name: accept-language
      in: header
      required: false
      description: 返回字段名称的语言。默认 zh 返回中文字段名；设置为 en 返回英文字段名。
      schema:
        type: string
        enum: [zh, en]
        default: zh
  examples:
    OverseasDocumentsFileBase64:
      summary: 使用文件 Base64
      value:
        file_base64: &overseasDocumentsFileBase64 data:image/jpeg;base64,
        app_id: ootb_r3s6t9u2v5w8x1y4z7a0b3c6d9e2
        enable_multi_ticket: true
        enable_field_value_translation: false
    OverseasDocumentsFileUrl:
      summary: 使用文件 URL
      value:
        file_url: &overseasDocumentsFileUrl https://adp.laiye.com/web/agentic_doc_processor/laiye/file/2003c711818811f1a36200163e358400
        app_id: ootb_r3s6t9u2v5w8x1y4z7a0b3c6d9e2
        enable_multi_ticket: true
        enable_field_value_translation: false
  requestBodies:
    DocumentExtractRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentExtractRequest'
          examples:
            fileUrl:
              $ref: '#/components/examples/OverseasDocumentsFileUrl'
            fileBase64:
              $ref: '#/components/examples/OverseasDocumentsFileBase64'
  responses:
    DocumentExtractResponse:
      description: 抽取结果。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DocumentExtractResponse'
    TaskCreateResponse:
      description: 任务创建结果。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskCreateResponse'
    ValidationError:
      description: 参数校验错误。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPValidationError'
  schemas:
    DocumentExtractRequest:
      oneOf:
        - title: 使用文件 URL
          type: object
          additionalProperties: false
          properties:
            file_url:
              default: *overseasDocumentsFileUrl
              type: string
              format: uri
              description: 待抽取文件 URL，与 file_base64 二选一。
            file_name:
              type: string
              description: 文件名（含扩展名）。使用文件 Base64，或无法从 URL 判断文件名时传入。
            enable_multi_ticket:
              type: boolean
              default: true
              description: 是否将同一文件中的多张票据拆分为独立结果。仅高速版（国际通用）和东南亚版支持；仅对本次调用生效，不修改应用配置。
            enable_field_value_translation:
              type: [boolean, 'null']
              description: 是否仅为本次调用开启字段值翻译。不传或传 null 时使用应用已保存的配置，且不会修改应用配置。翻译目标语言由 accept-language 请求头决定。
            app_id:
              type: string
              enum:
                - ootb_r3s6t9u2v5w8x1y4z7a0b3c6d9e2
                - ootb_u2v5w8x1y4z7a0b3c6d9e2f5g8
                - ootb_a3f8h1j5k9n2p7q4w6x0y3b5c8d1
              x-enumNames:
                - 高速版（国际通用）
                - 东南亚版
                - 标准版
              x-enumDescriptions:
                - 高速版（国际通用，默认）
                - 东南亚版（增强预扣税相关字段）
                - 标准版
              default: ootb_r3s6t9u2v5w8x1y4z7a0b3c6d9e2
              description: 预置应用标识。高速版（国际通用，默认）：ootb_r3s6t9u2v5w8x1y4z7a0b3c6d9e2；东南亚版：ootb_u2v5w8x1y4z7a0b3c6d9e2f5g8；标准版：ootb_a3f8h1j5k9n2p7q4w6x0y3b5c8d1。
          required: [app_id, file_url]
        - title: 使用文件 Base64
          type: object
          additionalProperties: false
          properties:
            file_base64:
              default: *overseasDocumentsFileBase64
              type: string
              description: 待抽取文件 Base64，与 file_url 二选一。
            file_name:
              type: string
              description: 文件名（含扩展名）。使用文件 Base64，或无法从 URL 判断文件名时传入。
            enable_multi_ticket:
              type: boolean
              default: true
              description: 是否将同一文件中的多张票据拆分为独立结果。仅高速版（国际通用）和东南亚版支持；仅对本次调用生效，不修改应用配置。
            enable_field_value_translation:
              type: [boolean, 'null']
              description: 是否仅为本次调用开启字段值翻译。不传或传 null 时使用应用已保存的配置，且不会修改应用配置。翻译目标语言由 accept-language 请求头决定。
            app_id:
              type: string
              enum:
                - ootb_r3s6t9u2v5w8x1y4z7a0b3c6d9e2
                - ootb_u2v5w8x1y4z7a0b3c6d9e2f5g8
                - ootb_a3f8h1j5k9n2p7q4w6x0y3b5c8d1
              x-enumNames:
                - 高速版（国际通用）
                - 东南亚版
                - 标准版
              x-enumDescriptions:
                - 高速版（国际通用，默认）
                - 东南亚版（增强预扣税相关字段）
                - 标准版
              default: ootb_r3s6t9u2v5w8x1y4z7a0b3c6d9e2
              description: 预置应用标识。高速版（国际通用，默认）：ootb_r3s6t9u2v5w8x1y4z7a0b3c6d9e2；东南亚版：ootb_u2v5w8x1y4z7a0b3c6d9e2f5g8；标准版：ootb_a3f8h1j5k9n2p7q4w6x0y3b5c8d1。
          required: [app_id, file_base64]
    SimpleResponse:
      type: object
      properties:
        code:
          oneOf:
            - type: string
            - type: integer
        message:
          type: string
        tips:
          type:
            - string
            - 'null'
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
      required: [detail]
    ValidationErrorItem:
      type: object
      properties:
        loc:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
      required: [loc, msg, type]
    TaskCreateResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                task_id:
                  type: string
                metadata:
                  type: object
                  additionalProperties: true
    DocumentExtractResponse:
      allOf:
        - $ref: '#/components/schemas/SimpleResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true
              properties:
                task_id:
                  type: string
                file_url:
                  type: string
                status:
                  type: integer
                  enum: [0, 1, 2, 4, 5, 6]
                  description: 0=未知，1=就绪，2=运行中，4=成功，5=失败，6=取消或拒绝。
                message:
                  type: string
                extract_config_version:
                  type: string
                metadata:
                  type:
                    - object
                    - 'null'
                  additionalProperties: true
                aigc:
                  type:
                    - object
                    - 'null'
                  additionalProperties: true
                doc_recognize_result:
                  type: array
                  description: 文档解析结果。
                  items:
                    type: object
                    additionalProperties: true
                extraction_result:
                  type: array
                  description: 文档字段抽取结果。
                  items:
                    type: object
                    additionalProperties: true
                classify_result:
                  type: object
                  description: 文档分类结果。
                  additionalProperties: true
